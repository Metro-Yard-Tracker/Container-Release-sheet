<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empty Container Release Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
            },
            darkbg: '#0b0f17',
            panelbg: '#111827',
            panelborder: '#1f293d',
            cellbg: '#1a2234'
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- React 18, React DOM, Babel, SheetJS, Lucide Icons -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f17;
      color: #e2e8f0;
      font-size: 15px;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f17;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f293d;
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }
    @keyframes pulse-red {
      0%, 100% { border-color: rgba(239, 68, 68, 0.9); box-shadow: 0 0 18px rgba(239, 68, 68, 0.4); }
      50% { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 6px rgba(239, 68, 68, 0.15); }
    }
    .editing-highlight {
      animation: pulse-red 1.5s infinite ease-in-out;
      background-color: rgba(127, 29, 29, 0.3) !important;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Firebase Credentials (yard-tracker-2ac18)
    const firebaseConfig = {
      apiKey: "AIzaSyAhff_1dvm67tn9hiBE0Nj1IAQO7jaTcX0",
      authDomain: "yard-tracker-2ac18.firebaseapp.com",
      databaseURL: "https://yard-tracker-2ac18-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "yard-tracker-2ac18",
      storageBucket: "yard-tracker-2ac18.firebasestorage.app",
      messagingSenderId: "744613034410",
      appId: "1:744613034410:web:cdde909508c255880653d3"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const releaseRef = db.ref('containerReleaseTracker');

    const DOOR_OPTIONS = ['REAR', 'FRONT', 'PASSENGER', 'DRIVERS', 'ANY'];

    const getGridBadgeStyle = (gridStr) => {
      if (!gridStr) return 'bg-slate-800 text-slate-300 border-slate-700';
      const clean = String(gridStr).trim().toUpperCase();

      if (clean.includes('AV1')) return 'bg-amber-500/20 text-amber-300 border-amber-500/50 shadow-sm';
      if (clean.includes('AV2')) return 'bg-sky-500/20 text-sky-300 border-sky-500/50 shadow-sm';
      if (clean.includes('AV3')) return 'bg-purple-500/20 text-purple-300 border-purple-500/50 shadow-sm';
      if (clean.includes('AV4')) return 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50 shadow-sm';
      if (clean.includes('AV5')) return 'bg-rose-500/20 text-rose-300 border-rose-500/50 shadow-sm';
      if (clean.includes('AV6')) return 'bg-indigo-500/20 text-indigo-300 border-indigo-500/50 shadow-sm';

      return 'bg-teal-500/20 text-teal-300 border-teal-500/50 shadow-sm';
    };

    const getCurrent24HourTime = () => {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      return `${hours}${minutes}`;
    };

    const formatTo24Hour = (inputVal) => {
      if (!inputVal) return '';
      let str = String(inputVal).trim().toUpperCase();

      const isPM = str.includes('PM');
      const isAM = str.includes('AM');
      str = str.replace(/AM|PM/g, '').trim();

      const digitsOnly = str.replace(/\D/g, '');
      if (!digitsOnly) return '';

      let hours = 0;
      let minutes = 0;

      if (digitsOnly.length === 1 || digitsOnly.length === 2) {
        hours = parseInt(digitsOnly, 10);
        minutes = 0;
      } else if (digitsOnly.length === 3) {
        hours = parseInt(digitsOnly.substring(0, 1), 10);
        minutes = parseInt(digitsOnly.substring(1, 3), 10);
      } else {
        hours = parseInt(digitsOnly.substring(0, 2), 10);
        minutes = parseInt(digitsOnly.substring(2, 4), 10);
      }

      if (isPM && hours < 12) hours += 12;
      if (isAM && hours === 12) hours = 0;

      hours = Math.min(23, Math.max(0, hours));
      minutes = Math.min(59, Math.max(0, minutes));

      return `${String(hours).padStart(2, '0')}${String(minutes).padStart(2, '0')}`;
    };

    const DEFAULT_DAYS = [
      { id: 'mon', name: 'Monday 9th', key: 'Monday 9th' },
      { id: 'tue', name: 'Tuesday 10th', key: 'Tuesday 10th' },
      { id: 'wed', name: 'Wednesday 11th', key: 'Wednesday 11th' },
      { id: 'thu', name: 'Thursday 12th', key: 'Thursday 12th' },
      { id: 'fri', name: 'Friday 13th', key: 'Friday 13th' },
      { id: 'sat', name: 'Saturday 14th', key: 'Saturday 14th' },
      { id: 'sun', name: 'Sunday 15th', key: 'Sunday 15th' }
    ];

    const INITIAL_CUSTOMERS = ['Sorted Logistics', 'MF 2Home', 'Chrisco', 'Mainfreight Sea', 'Oceana Container', 'Basciks', 'Chemcouriers', 'MF Port Ops'];
    const INITIAL_TYPES = ['GFH', 'GTH', 'GSM', '20GP', '40HC', '40GP', '20RF', '40RF'];

    const INITIAL_ADMINS = [
      { id: 'adm_1', name: 'Operations Admin', pin: '1234' },
      { id: 'adm_2', name: 'Yard Supervisor', pin: '9999' }
    ];

    const INITIAL_MOCK_DATA = {
      'Monday 9th': [
        { id: 'm1', lineNum: 1, customer: 'Sorted Logistics', units: 1, type: 'GFH', booking: 'BEX5973', exGrid: 'AV5', ctnReleased: 'GFH5381', truckId: 'SORT28', time: '0811', doors: 'FRONT', comments: '', status: 'Released' },
        { id: 'm2', lineNum: 2, customer: 'Hemisphere Freight', units: 1, type: 'GTH', booking: 'BEX6081', exGrid: 'AV4', ctnReleased: '', truckId: '', time: '', doors: 'ANY', comments: '', status: 'Pending' }
      ],
      'Tuesday 10th': [],
      'Wednesday 11th': [],
      'Thursday 12th': [],
      'Friday 13th': [],
      'Saturday 14th': [],
      'Sunday 15th': []
    };

    function App() {
      const [selectedDay, setSelectedDay] = useState('Monday 9th');
      const [releaseData, setReleaseData] = useState(INITIAL_MOCK_DATA);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [activeEdits, setActiveEdits] = useState({});

      const [isAdmin, setIsAdmin] = useState(false);
      const [currentAdmin, setCurrentAdmin] = useState(null);
      const [adminList, setAdminList] = useState(INITIAL_ADMINS);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');
      const [showPinModal, setShowPinModal] = useState(false);
      const [showAdminManageModal, setShowAdminManageModal] = useState(false);
      const [lockedSheets, setLockedSheets] = useState({});
      const [toast, setToast] = useState(null);
      const [expandedComment, setExpandedComment] = useState(null);

      // Real-time Firebase Sync
      useEffect(() => {
        const handleData = (snapshot) => {
          const data = snapshot.val();
          if (data && data.releaseData) {
            setReleaseData(data.releaseData);
          }
          if (data && data.activeEdits) {
            setActiveEdits(data.activeEdits);
          }
          if (data && data.lockedSheets) {
            setLockedSheets(data.lockedSheets);
          }
        };

        releaseRef.on('value', handleData);
        return () => releaseRef.off('value', handleData);
      }, []);

      const saveToFirebase = (newData, newEdits, newLocks) => {
        releaseRef.update({
          releaseData: newData !== undefined ? newData : releaseData,
          activeEdits: newEdits !== undefined ? newEdits : activeEdits,
          lockedSheets: newLocks !== undefined ? newLocks : lockedSheets
        });
      };

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      useEffect(() => {
        const interval = setInterval(() => {
          const now = Date.now();
          setActiveEdits(prev => {
            let changed = false;
            const updated = { ...prev };
            Object.keys(updated).forEach(rowId => {
              if (now - updated[rowId].timestamp > 30000) {
                delete updated[rowId];
                changed = true;
              }
            });
            if (changed) {
              releaseRef.child('activeEdits').set(updated);
            }
            return changed ? updated : prev;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const triggerToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      const handleCellFocusOrType = (rowId) => {
        const userName = isAdmin ? currentAdmin?.name : 'User';
        const updatedEdits = {
          ...activeEdits,
          [rowId]: { timestamp: Date.now(), user: userName }
        };
        setActiveEdits(updatedEdits);
        releaseRef.child('activeEdits').set(updatedEdits);
      };

      const handleCellEdit = (rowId, field, value) => {
        if (lockedSheets[selectedDay]) {
          triggerToast('This day sheet is locked by Admin', 'error');
          return;
        }

        handleCellFocusOrType(rowId);

        const updatedDayRows = (releaseData[selectedDay] || []).map(row => {
          if (row.id === rowId) {
            const updatedRow = { ...row, [field]: value };

            if (field === 'doors') {
              updatedRow.time = getCurrent24HourTime();
            }

            if (field === 'time') {
              updatedRow.time = formatTo24Hour(value);
            }

            if (field === 'ctnReleased' || field === 'truckId' || field === 'units') {
              const hasTruck = Boolean(updatedRow.truckId && updatedRow.truckId.trim());
              const ctnCount = updatedRow.ctnReleased ? updatedRow.ctnReleased.split(',').filter(s => s.trim().length > 0).length : 0;
              
              if (ctnCount >= updatedRow.units && hasTruck) {
                updatedRow.status = 'Released';
              } else if (ctnCount > 0 || hasTruck) {
                updatedRow.status = 'In Progress';
              } else {
                updatedRow.status = 'Pending';
              }
            }
            return updatedRow;
          }
          return row;
        });

        const updatedData = {
          ...releaseData,
          [selectedDay]: updatedDayRows
        };

        setReleaseData(updatedData);
        saveToFirebase(updatedData, undefined, undefined);
      };

      const currentRows = useMemo(() => releaseData[selectedDay] || [], [releaseData, selectedDay]);

      const filteredRows = useMemo(() => {
        return currentRows.filter(row => {
          const isRowEmpty = !row.customer && !row.booking && !row.ctnReleased && !row.truckId && !row.exGrid;
          if (!isAdmin && isRowEmpty) return false;

          const matchesQuery = 
            (row.customer || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (row.booking || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (row.ctnReleased || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (row.truckId || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (row.exGrid || '').toLowerCase().includes(searchQuery.toLowerCase());

          const matchesStatus = filterStatus === 'ALL' || row.status === filterStatus;
          return matchesQuery && matchesStatus;
        });
      }, [currentRows, searchQuery, filterStatus, isAdmin]);

      const dayStats = useMemo(() => {
        const totalRows = currentRows.length;
        const totalUnits = currentRows.reduce((acc, r) => acc + (Number(r.units) || 0), 0);
        const releasedUnits = currentRows.filter(r => r.status === 'Released').reduce((acc, r) => acc + (Number(r.units) || 0), 0);
        const pendingUnits = totalUnits - releasedUnits;
        return { totalRows, totalUnits, releasedUnits, pendingUnits };
      }, [currentRows]);

      const handlePinSubmit = (e) => {
        e.preventDefault();
        const foundAdmin = adminList.find(a => a.pin === pinInput.trim());

        if (foundAdmin) {
          setIsAdmin(true);
          setCurrentAdmin(foundAdmin);
          setShowPinModal(false);
          setPinInput('');
          setPinError('');
          triggerToast(`Welcome back, ${foundAdmin.name}! Admin mode active.`, 'success');
        } else {
          setPinError('Invalid 4-Digit PIN');
        }
      };

      const handleLogoutAdmin = () => {
        setIsAdmin(false);
        setCurrentAdmin(null);
        triggerToast('Switched to General User Mode', 'info');
      };

      const [newAdminName, setNewAdminName] = useState('');
      const [newAdminPin, setNewAdminPin] = useState('');

      const handleAddAdmin = (e) => {
        e.preventDefault();
        if (!newAdminName.trim() || newAdminPin.length !== 4) {
          triggerToast('Please provide a valid name and a 4-digit PIN', 'error');
          return;
        }

        const newAdmin = {
          id: 'adm_' + Date.now(),
          name: newAdminName.trim(),
          pin: newAdminPin.trim()
        };

        setAdminList(prev => [...prev, newAdmin]);
        setNewAdminName('');
        setNewAdminPin('');
        triggerToast(`Admin "${newAdmin.name}" added successfully`, 'success');
      };

      const handleRemoveAdmin = (id) => {
        if (adminList.length <= 1) {
          triggerToast('Cannot delete the last remaining Admin account', 'error');
          return;
        }
        setAdminList(prev => prev.filter(a => a.id !== id));
        triggerToast('Admin removed', 'info');
      };

      const handleAddRow = () => {
        if (lockedSheets[selectedDay]) {
          triggerToast('Cannot add rows to a locked sheet', 'error');
          return;
        }

        const newRow = {
          id: 'row_' + Date.now(),
          lineNum: currentRows.length + 1,
          customer: INITIAL_CUSTOMERS[0],
          units: 1,
          type: INITIAL_TYPES[0],
          booking: 'BEX' + Math.floor(1000 + Math.random() * 9000),
          exGrid: 'AV1',
          ctnReleased: '',
          truckId: '',
          time: '',
          doors: 'ANY',
          comments: '',
          status: 'Pending'
        };

        const updated = {
          ...releaseData,
          [selectedDay]: [...(releaseData[selectedDay] || []), newRow]
        };
        setReleaseData(updated);
        saveToFirebase(updated, undefined, undefined);
        triggerToast('New row added', 'success');
      };

      const handleDeleteRow = (rowId) => {
        if (!isAdmin) return;
        const updated = {
          ...releaseData,
          [selectedDay]: (releaseData[selectedDay] || []).filter(r => r.id !== rowId)
        };
        setReleaseData(updated);
        saveToFirebase(updated, undefined, undefined);
        triggerToast('Row deleted', 'info');
      };

      const toggleSheetLock = () => {
        if (!isAdmin) return;
        const updatedLocks = {
          ...lockedSheets,
          [selectedDay]: !lockedSheets[selectedDay]
        };
        setLockedSheets(updatedLocks);
        saveToFirebase(undefined, undefined, updatedLocks);
        triggerToast(updatedLocks[selectedDay] ? `${selectedDay} Locked` : `${selectedDay} Unlocked`, 'info');
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary' });
            const importedData = {};

            wb.SheetNames.forEach(sheetName => {
              const ws = wb.Sheets[sheetName];
              const json = XLSX.utils.sheet_to_json(ws, { header: 1 });

              if (json.length > 2) {
                const rows = [];
                for (let i = 2; i < json.length; i++) {
                  const r = json[i];
                  if (!r || r.length === 0 || (!r[1] && !r[4])) continue;

                  rows.push({
                    id: `imp_${sheetName}_${i}`,
                    lineNum: rows.length + 1,
                    customer: r[1] || '',
                    units: Number(r[2]) || 1,
                    type: r[3] || '20GP',
                    booking: String(r[4] || ''),
                    exGrid: String(r[5] || ''),
                    ctnReleased: String(r[6] || ''),
                    truckId: String(r[7] || ''),
                    time: formatTo24Hour(r[8]),
                    doors: DOOR_OPTIONS.includes(String(r[9]).toUpperCase()) ? String(r[9]).toUpperCase() : 'ANY',
                    comments: String(r[10] || ''),
                    status: r[6] ? 'Released' : 'Pending'
                  });
                }
                importedData[sheetName] = rows;
              }
            });

            if (Object.keys(importedData).length > 0) {
              const updatedData = { ...releaseData, ...importedData };
              setReleaseData(updatedData);
              saveToFirebase(updatedData, undefined, undefined);
              triggerToast('Excel release sheet imported!', 'success');
            } else {
              triggerToast('No valid container data found in file', 'error');
            }
          } catch (err) {
            console.error(err);
            triggerToast('Failed to parse Excel file', 'error');
          }
        };
        reader.readAsBinaryString(file);
      };

      const handleExportExcel = () => {
        const wb = XLSX.utils.book_new();

        DEFAULT_DAYS.forEach(day => {
          const dayRows = releaseData[day.key] || [];
          const excelData = [
            ["00:01 TO 23:59 Empty Container Release Sheet"],
            ["Line #", "Customer", "# Units", "Type", "Booking #", "Ex Grid", "Ctn # Released", "Truck id", "Time", "Doors", "Comment/Special Instructions"]
          ];

          dayRows.forEach(r => {
            excelData.push([
              r.lineNum,
              r.customer,
              r.units,
              r.type,
              r.booking,
              r.exGrid,
              r.ctnReleased,
              r.truckId,
              r.time,
              r.doors,
              r.comments
            ]);
          });

          const ws = XLSX.utils.aoa_to_sheet(excelData);
          XLSX.utils.book_append_sheet(wb, ws, day.key);
        });

        XLSX.writeFile(wb, `Empty_Container_Release_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
        triggerToast('Exported weekly release sheet to Excel', 'success');
      };

      return (
        <div className="min-h-screen flex flex-col pb-12">
          
          <header className="bg-panelbg border-b border-panelborder sticky top-0 z-30 shadow-lg">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400">
                  <i data-lucide="truck" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="text-lg font-bold text-white tracking-wide flex items-center gap-2">
                    Empty Container Release Tracker
                    <span className="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-normal border border-slate-700">Page 2 App</span>
                  </h1>
                  <p className="text-xs text-slate-400">Live Firebase Sync Connected</p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                {isAdmin ? (
                  <div className="flex items-center space-x-2">
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/40 text-emerald-400 text-xs font-semibold">
                      <i data-lucide="shield-check" className="w-4 h-4"></i>
                      Admin: {currentAdmin?.name}
                    </span>
                    <button
                      onClick={() => setShowAdminManageModal(true)}
                      className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg border border-slate-700"
                      title="Manage Admins & PINs"
                    >
                      <i data-lucide="users" className="w-4 h-4"></i>
                    </button>
                    <button
                      onClick={handleLogoutAdmin}
                      className="px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-medium rounded-lg border border-rose-500/30 transition-colors"
                    >
                      Lock Admin
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center space-x-2">
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 text-xs">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      General Mode
                    </span>
                    <button
                      onClick={() => setShowPinModal(true)}
                      className="flex items-center space-x-1.5 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium rounded-lg transition-colors shadow-sm"
                    >
                      <i data-lucide="lock" className="w-3.5 h-3.5"></i>
                      <span>Admin Unlock</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {toast && (
            <div className={`fixed bottom-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2 border text-sm font-medium transition-all transform translate-y-0 ${
              toast.type === 'error' ? 'bg-rose-950/90 text-rose-200 border-rose-800' :
              toast.type === 'success' ? 'bg-emerald-950/90 text-emerald-200 border-emerald-800' :
              'bg-slate-800/90 text-slate-200 border-slate-700'
            }`}>
              <i data-lucide={toast.type === 'error' ? 'alert-circle' : toast.type === 'success' ? 'check-circle' : 'info'} className="w-4 h-4"></i>
              <span>{toast.msg}</span>
            </div>
          )}

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 flex-1 w-full">
            
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
              
              <div className="flex items-center overflow-x-auto space-x-1 p-1 bg-panelbg border border-panelborder rounded-xl">
                {DEFAULT_DAYS.map(day => {
                  const isActive = selectedDay === day.key;
                  const isLocked = lockedSheets[day.key];
                  return (
                    <button
                      key={day.id}
                      onClick={() => setSelectedDay(day.key)}
                      className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition-all ${
                        isActive
                          ? 'bg-emerald-600 text-white shadow-md'
                          : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                      }`}
                    >
                      <span>{day.name}</span>
                      {isLocked && <i data-lucide="lock" className="w-3.5 h-3.5 text-rose-400"></i>}
                    </button>
                  );
                })}
              </div>

              <div className="flex items-center space-x-2">
                <div className="relative flex-1 md:w-64">
                  <i data-lucide="search" className="w-4 h-4 absolute left-3 top-2.5 text-slate-500"></i>
                  <input
                    type="text"
                    placeholder="Search..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-3 py-1.5 bg-panelbg border border-panelborder rounded-lg text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <select
                  value={filterStatus}
                  onChange={(e) => setFilterStatus(e.target.value)}
                  className="bg-panelbg border border-panelborder text-xs text-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-emerald-500 font-semibold"
                >
                  <option value="ALL">All Statuses</option>
                  <option value="Released">Released</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Pending">Pending</option>
                </select>

                {isAdmin && (
                  <>
                    <label className="flex items-center space-x-1 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 cursor-pointer transition-colors">
                      <i data-lucide="upload" className="w-3.5 h-3.5 text-emerald-400"></i>
                      <span>Import .xlsx</span>
                      <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="hidden" />
                    </label>

                    <button
                      onClick={handleExportExcel}
                      className="flex items-center space-x-1 px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 text-xs font-medium rounded-lg transition-colors"
                    >
                      <i data-lucide="download" className="w-3.5 h-3.5"></i>
                      <span>Export .xlsx</span>
                    </button>

                    <button
                      onClick={toggleSheetLock}
                      className={`p-1.5 rounded-lg border transition-colors ${
                        lockedSheets[selectedDay]
                          ? 'bg-rose-500/20 text-rose-400 border-rose-500/40'
                          : 'bg-slate-800 text-slate-400 border-slate-700 hover:text-white'
                      }`}
                      title={lockedSheets[selectedDay] ? 'Unlock Sheet' : 'Lock Sheet'}
                    >
                      <i data-lucide={lockedSheets[selectedDay] ? 'lock' : 'unlock'} className="w-4 h-4"></i>
                    </button>
                  </>
                )}
              </div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
              <div className="bg-panelbg border border-panelborder rounded-xl p-4">
                <div className="text-xs text-slate-400 font-semibold">Total Bookings</div>
                <div className="text-2xl font-bold text-white mt-1 font-mono-num">{dayStats.totalRows}</div>
              </div>
              <div className="bg-panelbg border border-panelborder rounded-xl p-4">
                <div className="text-xs text-slate-400 font-semibold">Scheduled Units</div>
                <div className="text-2xl font-bold text-emerald-400 mt-1 font-mono-num">{dayStats.totalUnits}</div>
              </div>
              <div className="bg-panelbg border border-panelborder rounded-xl p-4">
                <div className="text-xs text-slate-400 font-semibold">Released / Dispatched</div>
                <div className="text-2xl font-bold text-blue-400 mt-1 font-mono-num">{dayStats.releasedUnits}</div>
              </div>
              <div className="bg-panelbg border border-panelborder rounded-xl p-4">
                <div className="text-xs text-slate-400 font-semibold">Pending Release</div>
                <div className="text-2xl font-bold text-amber-400 mt-1 font-mono-num">{dayStats.pendingUnits}</div>
              </div>
            </div>

            <div className="bg-panelbg border border-panelborder rounded-2xl shadow-xl overflow-hidden">
              <div className="p-4 border-b border-panelborder flex items-center justify-between bg-slate-900/50">
                <div className="flex items-center space-x-2">
                  <h2 className="text-sm font-semibold text-white">{selectedDay} Container Release List</h2>
                  {lockedSheets[selectedDay] && (
                    <span className="px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 text-xs font-semibold border border-rose-500/30">
                      LOCKED SHEET
                    </span>
                  )}
                </div>

                <div className="flex items-center space-x-2">
                  <button
                    onClick={handleAddRow}
                    disabled={Boolean(lockedSheets[selectedDay])}
                    className="flex items-center space-x-1.5 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium rounded-lg disabled:opacity-50 transition-colors"
                  >
                    <i data-lucide="plus" className="w-3.5 h-3.5"></i>
                    <span>Add Line</span>
                  </button>
                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm text-slate-200">
                  <thead className="bg-slate-900/90 text-slate-300 uppercase text-xs tracking-wider border-b border-panelborder font-bold">
                    <tr>
                      <th className="py-3.5 px-3 w-12 text-center">Line</th>
                      <th className="py-3.5 px-3 w-48">Customer</th>
                      <th className="py-3.5 px-3 w-16 text-center">Units</th>
                      <th className="py-3.5 px-3 w-20">Type</th>
                      <th className="py-3.5 px-3 w-32">Booking #</th>
                      <th className="py-3.5 px-3 w-24 text-center">Ex Grid</th>
                      <th className="py-3.5 px-3 w-52">Ctn # Released</th>
                      <th className="py-3.5 px-3 min-w-[200px]">Truck ID</th>
                      <th className="py-3.5 px-3 min-w-[160px]">Doors</th>
                      <th className="py-3.5 px-3 min-w-[140px] text-center">Time (24h)</th>
                      <th className="py-3.5 px-3 min-w-[240px]">Comment / Special Instructions</th>
                      <th className="py-3.5 px-3 w-28 text-center">Status</th>
                      {isAdmin && <th className="py-3.5 px-3 w-12 text-center">Action</th>}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-panelborder">
                    {filteredRows.length === 0 ? (
                      <tr>
                        <td colSpan={isAdmin ? 13 : 12} className="py-10 text-center text-slate-400 text-sm font-medium">
                          No active release lines found for {selectedDay}.
                        </td>
                      </tr>
                    ) : (
                      filteredRows.map((row) => {
                        const isRowActive = Boolean(activeEdits[row.id]);
                        const activeEditInfo = activeEdits[row.id];

                        return (
                          <tr
                            key={row.id}
                            className={`transition-colors border-l-4 ${
                              isRowActive
                                ? 'editing-highlight border-l-red-500'
                                : 'hover:bg-slate-800/50 border-l-transparent'
                            }`}
                          >
                            <td className="py-3 px-3 text-center font-mono-num text-slate-400 font-bold text-sm">
                              {row.lineNum}
                            </td>

                            <td className="py-3 px-3">
                              {isAdmin ? (
                                <input
                                  type="text"
                                  value={row.customer}
                                  placeholder="Customer Name"
                                  onFocus={() => handleCellFocusOrType(row.id)}
                                  onChange={(e) => handleCellEdit(row.id, 'customer', e.target.value)}
                                  className="w-full bg-cellbg border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm text-slate-100 font-medium focus:outline-none focus:border-emerald-500"
                                />
                              ) : (
                                <span className="font-bold text-slate-100 text-sm">{row.customer || '—'}</span>
                              )}
                            </td>

                            <td className="py-3 px-3 text-center">
                              {isAdmin ? (
                                <input
                                  type="number"
                                  min="1"
                                  value={row.units}
                                  onFocus={() => handleCellFocusOrType(row.id)}
                                  onChange={(e) => handleCellEdit(row.id, 'units', parseInt(e.target.value, 10) || 1)}
                                  className="w-full text-center bg-cellbg border border-slate-700 rounded-lg px-1.5 py-1.5 text-sm text-slate-100 font-mono-num font-bold focus:outline-none focus:border-emerald-500"
                                />
                              ) : (
                                <span className="font-mono-num font-black text-emerald-400 text-base">{row.units}</span>
                              )}
                            </td>

                            <td className="py-3 px-3">
                              {isAdmin ? (
                                <input
                                  type="text"
                                  value={row.type}
                                  onFocus={() => handleCellFocusOrType(row.id)}
                                  onChange={(e) => handleCellEdit(row.id, 'type', e.target.value)}
                                  className="w-full bg-cellbg border border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-100 font-mono-num focus:outline-none focus:border-emerald-500"
                                />
                              ) : (
                                <span className="px-2 py-1 rounded-md bg-slate-800 text-slate-200 font-mono-num text-xs font-bold border border-slate-700">
                                  {row.type}
                                </span>
                              )}
                            </td>

                            <td className="py-3 px-3">
                              {isAdmin ? (
                                <input
                                  type="text"
                                  value={row.booking}
                                  placeholder="Booking #"
                                  onFocus={() => handleCellFocusOrType(row.id)}
                                  onChange={(e) => handleCellEdit(row.id, 'booking', e.target.value)}
                                  className="w-full bg-cellbg border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm text-slate-100 font-mono-num focus:outline-none focus:border-emerald-500"
                                />
                              ) : (
                                <span className="font-mono-num text-slate-200 font-semibold">{row.booking || '—'}</span>
                              )}
                            </td>

                            <td className="py-3 px-3 text-center">
                              {isAdmin ? (
                                <input
                                  type="text"
                                  value={row.exGrid}
                                  onFocus={() => handleCellFocusOrType(row.id)}
                                  onChange={(e) => handleCellEdit(row.id, 'exGrid', e.target.value)}
                                  className="w-full text-center bg-cellbg border border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-100 font-mono-num font-bold focus:outline-none focus:border-emerald-500"
                                />
                              ) : (
                                <span className={`inline-block px-3 py-1 rounded-lg font-mono-num font-extrabold text-xs border ${getGridBadgeStyle(row.exGrid)}`}>
                                  {row.exGrid || 'UNASSIGNED'}
                                </span>
                              )}
                            </td>

                            <td className="py-3 px-3">
                              <input
                                type="text"
                                placeholder="Enter container ID..."
                                value={row.ctnReleased}
                                onFocus={() => handleCellFocusOrType(row.id)}
                                onChange={(e) => handleCellEdit(row.id, 'ctnReleased', e.target.value)}
                                className="w-full bg-cellbg border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 font-mono-num font-semibold placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                              />
                            </td>

                            <td className="py-3 px-3">
                              <input
                                type="text"
                                placeholder="Truck ID"
                                value={row.truckId}
                                onFocus={() => handleCellFocusOrType(row.id)}
                                onChange={(e) => handleCellEdit(row.id, 'truckId', e.target.value)}
                                className="w-full bg-cellbg border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-100 font-mono-num font-semibold placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                              />
                            </td>

                            <td className="py-3 px-3">
                              <select
                                value={row.doors || 'ANY'}
                                onFocus={() => handleCellFocusOrType(row.id)}
                                onChange={(e) => handleCellEdit(row.id, 'doors', e.target.value)}
                                className="w-full bg-cellbg border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 font-bold focus:outline-none focus:border-emerald-500"
                              >
                                {DOOR_OPTIONS.map(opt => (
                                  <option key={opt} value={opt}>{opt}</option>
                                ))}
                              </select>
                            </td>

                            <td className="py-3 px-3 text-center">
                              <input
                                type="text"
                                placeholder="HHmm"
                                maxLength="7"
                                value={row.time}
                                onFocus={() => handleCellFocusOrType(row.id)}
                                onChange={(e) => handleCellEdit(row.id, 'time', e.target.value)}
                                onBlur={(e) => handleCellEdit(row.id, 'time', e.target.value)}
                                className="w-full bg-cellbg border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 font-mono-num font-bold text-center placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                              />
                            </td>

                            <td className="py-3 px-3">
                              <div className="flex flex-col gap-1">
                                <div className="flex items-center space-x-1.5">
                                  <input
                                    type="text"
                                    placeholder="Add comments..."
                                    value={row.comments}
                                    onFocus={() => handleCellFocusOrType(row.id)}
                                    onChange={(e) => handleCellEdit(row.id, 'comments', e.target.value)}
                                    className="w-full bg-cellbg border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                                  />
                                  {row.comments && row.comments.length > 12 && (
                                    <button
                                      onClick={() => setExpandedComment(row.comments)}
                                      className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded-lg border border-slate-700 text-xs font-semibold whitespace-nowrap"
                                      title="View Full Comment"
                                    >
                                      View
                                    </button>
                                  )}
                                </div>
                                {isRowActive && (
                                  <span className="text-[11px] text-red-400 font-bold flex items-center gap-1.5 mt-0.5">
                                    <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                                    ⚡ Active Edit ({activeEditInfo?.user})
                                  </span>
                                )}
                              </div>
                            </td>

                            <td className="py-3 px-3 text-center">
                              <span className={`inline-block px-3 py-1.5 rounded-full text-xs font-black border uppercase tracking-wider ${
                                row.status === 'Released'
                                  ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/40'
                                  : row.status === 'In Progress'
                                  ? 'bg-blue-500/10 text-blue-400 border-blue-500/40'
                                  : 'bg-amber-500/10 text-amber-400 border-amber-500/40'
                              }`}>
                                {row.status}
                              </span>
                            </td>

                            {isAdmin && (
                              <td className="py-3 px-3 text-center">
                                <button
                                  onClick={() => handleDeleteRow(row.id)}
                                  className="p-1.5 text-slate-500 hover:text-rose-400 transition-colors"
                                  title="Delete Line"
                                >
                                  <i data-lucide="trash-2" className="w-5 h-5"></i>
                                </button>
                              </td>
                            )}
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {expandedComment && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-panelbg border border-panelborder rounded-2xl p-6 w-full max-w-lg shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="message-square" className="w-5 h-5 text-emerald-400"></i>
                    Full Comment / Special Instructions
                  </h3>
                  <button onClick={() => setExpandedComment(null)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-6 h-6"></i>
                  </button>
                </div>
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-slate-200 text-sm leading-relaxed mb-6 font-medium whitespace-pre-wrap">
                  {expandedComment}
                </div>
                <div className="flex justify-end">
                  <button
                    onClick={() => setExpandedComment(null)}
                    className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-md"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {showPinModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-panelbg border border-panelborder rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <div className="flex items-center space-x-2">
                    <i data-lucide="shield-alert" className="w-6 h-6 text-emerald-400"></i>
                    <h3 className="text-xl font-bold text-white">Admin Authentication</h3>
                  </div>
                  <button onClick={() => setShowPinModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-6 h-6"></i>
                  </button>
                </div>

                <form onSubmit={handlePinSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Enter 4-Digit Admin PIN</label>
                    <input
                      type="password"
                      maxLength="4"
                      placeholder="••••"
                      value={pinInput}
                      onChange={(e) => setPinInput(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-3xl font-mono-num tracking-widest text-white focus:outline-none focus:border-emerald-500"
                      autoFocus
                    />
                    {pinError && <p className="text-xs text-rose-400 mt-1 font-semibold">{pinError}</p>}
                  </div>

                  <div className="bg-slate-900/60 p-3.5 rounded-xl border border-slate-800 text-xs text-slate-300">
                    <p className="font-bold text-slate-200 mb-1">Default Credentials:</p>
                    <p>• Operations Admin: <span className="font-mono-num text-emerald-400 font-bold">1234</span></p>
                    <p>• Yard Supervisor: <span className="font-mono-num text-emerald-400 font-bold">9999</span></p>
                  </div>

                  <div className="flex justify-end space-x-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowPinModal(false)}
                      className="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-semibold rounded-xl hover:bg-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl hover:bg-emerald-500 shadow-md"
                    >
                      Unlock Admin Mode
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showAdminManageModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-panelbg border border-panelborder rounded-2xl p-6 w-full max-w-lg shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <div className="flex items-center space-x-2">
                    <i data-lucide="users" className="w-6 h-6 text-emerald-400"></i>
                    <h3 className="text-xl font-bold text-white">Manage Admin Accounts</h3>
                  </div>
                  <button onClick={() => setShowAdminManageModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-6 h-6"></i>
                  </button>
                </div>

                <div className="space-y-3 mb-6">
                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Active Admins</h4>
                  <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                    {adminList.map(adm => (
                      <div key={adm.id} className="flex items-center justify-between p-3.5 bg-slate-900 border border-slate-800 rounded-xl">
                        <div>
                          <div className="text-sm font-bold text-slate-200">{adm.name}</div>
                          <div className="text-xs text-slate-400 font-mono-num mt-0.5">PIN: •••• ({adm.pin})</div>
                        </div>
                        <button
                          onClick={() => handleRemoveAdmin(adm.id)}
                          className="p-1.5 text-slate-500 hover:text-rose-400 transition-colors"
                          title="Remove Admin"
                        >
                          <i data-lucide="trash-2" className="w-4 h-4"></i>
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                <form onSubmit={handleAddAdmin} className="border-t border-slate-800 pt-4 space-y-3">
                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Add New Admin</h4>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1 font-semibold">Admin Name</label>
                      <input
                        type="text"
                        placeholder="e.g. John Doe"
                        value={newAdminName}
                        onChange={(e) => setNewAdminName(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1 font-semibold">4-Digit PIN</label>
                      <input
                        type="password"
                        maxLength="4"
                        placeholder="••••"
                        value={newAdminPin}
                        onChange={(e) => setNewAdminPin(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-mono-num tracking-widest focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-colors shadow-md"
                  >
                    Add Admin User
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
