    const { useState, useEffect, useRef } = React;

    // =========================================================================

    const firebaseConfig = {

    // AV Grid Color Palette (UI)

    const DEFAULT_HEADER_BLOCK = [

      ["", "", "", "", "", "", "", "", "", "", ""],
      ["", "Customer", "# Units", "Type", "Booking #", "Ex Grid", "Ctn # Released", "Truck id", "Time", "Doors", "Comment/Special Instructions"]

    const FIELD_LABELS = {
      customer: "Customer",

      ctnReleased: "Ctn # Released",
      truckId: "Truck ID",

    };

    const SCHEDULE_FIELDS = ["customer", "units", "type", "bookingNo", "exGrid"];
    const YARD_FIELDS = ["ctnReleased", "truckId", "time", "doors", "comment"];
    const ALL_COMPARABLE_FIELDS = [...SCHEDULE_FIELDS, ...YARD_FIELDS];

    const SNAPSHOT_COLUMNS = [
      { key: "customer", label: "Customer" },
      { key: "units", label: "Units" },
      { key: "type", label: "Type" },
      { key: "bookingNo", label: "Booking #" },
      { key: "exGrid", label: "Ex Grid" },
      { key: "ctnReleased", label: "Ctn # Released" },
      { key: "truckId", label: "Truck ID" },
      { key: "time", label: "Time" },
      { key: "doors", label: "Doors" },
      { key: "comment", label: "Comments" }
    ];

    // =========================================================================
    // MONDAY-ANCHORED WEEKLY LOG ARCHIVE HELPERS (ADMIN-ONLY LONG-TERM BACKUP)
    // =========================================================================
    const getMondayWeekStartMs = (timestampMs) => {
      const d = new Date(timestampMs);
      d.setHours(0, 0, 0, 0);
      const dayOfWeek = d.getDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat
      const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      d.setDate(d.getDate() + diffToMonday);
      return d.getTime();
    };

    const formatWeekRangeLabel = (mondayStartMs) => {
      const start = new Date(mondayStartMs);
      const end = new Date(mondayStartMs + 6 * 24 * 60 * 60 * 1000);
      const fmt = (dt) => {
        const day = String(dt.getDate()).padStart(2, "0");
        const month = dt.toLocaleString("en-NZ", { month: "short" });
        const year = dt.getFullYear();
        return `${day} ${month} ${year}`;
      };
      return `Mon ${fmt(start)} – Sun ${fmt(end)}`;
    };

    // Automatically bundles logs into Monday-to-Sunday weekly archives before rolling 7-day pruning
    const syncWeeklyLogArchives = (logsList, existingArchives = [], includeCurrentWeek = false, triggerReason = "Auto Weekly Backup (Monday Cycle)") => {
      const safeLogs = Array.isArray(logsList) ? logsList : [];
      const currentWeekStart = getMondayWeekStartMs(Date.now());
      const archiveMap = new Map();

      (Array.isArray(existingArchives) ? existingArchives : []).forEach((arch) => {
        if (arch && arch.weekStartMs) {
          archiveMap.set(arch.weekStartMs, {
            ...arch,
            logs: Array.isArray(arch.logs) ? [...arch.logs] : []
          });
        }
      });

      const logsByWeek = new Map();
      safeLogs.forEach((log) => {
        if (!log || !log.timestamp) return;
        const wkStart = getMondayWeekStartMs(log.timestamp);
        if (!includeCurrentWeek && wkStart >= currentWeekStart) return;
        if (!logsByWeek.has(wkStart)) logsByWeek.set(wkStart, []);
        logsByWeek.get(wkStart).push(log);
      });

      let hasChanges = false;
      logsByWeek.forEach((wkLogs, wkStart) => {
        const existing = archiveMap.get(wkStart);
        const existingById = new Map(existing ? existing.logs.map((l) => [l.id, l]) : []);

        let weekModified = !existing;
        wkLogs.forEach((l) => {
          const prev = existingById.get(l.id);
          if (!prev || JSON.stringify(prev) !== JSON.stringify(l)) {
            existingById.set(l.id, l);
            weekModified = true;
          }
        });

        if (weekModified) {
          hasChanges = true;
          const mergedLogs = Array.from(existingById.values());
          mergedLogs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          archiveMap.set(wkStart, {
            id: `week-arch-${wkStart}`,
            weekStartMs: wkStart,
            weekLabel: formatWeekRangeLabel(wkStart),
            archivedAt: Date.now(),
            backupNote: triggerReason,
            entryCount: mergedLogs.length,
            logs: mergedLogs
          });
        }
      });

      const sortedArchives = Array.from(archiveMap.values()).sort(
        (a, b) => b.weekStartMs - a.weekStartMs
      );

      return { archives: sortedArchives, hasChanges };
    };

    const createEmptyDaysObject = () => ({
      Monday: [],
      Tuesday: [],
      Wednesday: [],
      Thursday: [],
      Friday: [],
      Saturday: [],
      Sunday: []
    });

    const generateRowId = () =>
      `row-${Date.now()}-${Math.random().toString(36).substr(2, 7)}`;

    const normalizeDaysData = (rawDays) => {
      const normalized = createEmptyDaysObject();
      if (!rawDays) return normalized;
      DAYS.forEach((day) => {
        let list = [];
        if (Array.isArray(rawDays[day])) {
          list = rawDays[day];
        } else if (rawDays[day] && typeof rawDays[day] === "object") {
          list = Object.values(rawDays[day]);
        }
        normalized[day] = list.map((row, idx) => ({
          ...row,
          rowId: row.rowId || `${day.toLowerCase()}-row-${idx}-${(row.bookingNo || "").replace(/[^a-zA-Z0-9]/g, "")}`
        }));
      });
      return normalized;
    };

    const arrayBufferToBase64 = (buffer) => {
      const bytes = new Uint8Array(buffer);
      const chunkSize = 0x8000;
      let binary = "";
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const sub = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode.apply(null, sub);
      }
      return btoa(binary);
    };

    const base64ToArrayBuffer = (base64) => {
      const binary = atob(base64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    };

    const cloneExcelStyle = (styleObj) => {
      if (!styleObj) return {};
      try {
        return JSON.parse(JSON.stringify(styleObj));
      } catch (e) {
        return {};
      }
    };

    const getExcelCellText = (cell) => {
      if (!cell || cell.value === null || cell.value === undefined) return "";
      const val = cell.value;
      if (typeof val === "object") {
        if (val.result !== undefined && val.result !== null) return String(val.result).trim();
        if (Array.isArray(val.richText)) {
          return val.richText.map((part) => part.text || "").join("").trim();
        }
        if (val.text !== undefined) return String(val.text).trim();
      }
      return String(val).trim();
    };

    const normStr = (v) => (v !== undefined && v !== null ? String(v).trim().replace(/\s+/g, " ") : "");
    const normKey = (v) => normStr(v).toLowerCase();

    // =========================================================================
    // FULL 10-COLUMN IMPORT COMPARISON ENGINE (DETECTS ANY CHANGED FIELD)
    // =========================================================================
    const computeImportAnalysis = (currentDays, incomingDays) => {
      const mergedDays = createEmptyDaysObject();
      const summary = {
        addedCount: 0,
        updatedCount: 0,
        unchangedCount: 0,
        removedCount: 0,
        items: []
      };

      const buildRowDiffsAndMerge = (ex, inc) => {
        const diffs = [];
        ALL_COMPARABLE_FIELDS.forEach((field) => {
          const oldVal = normStr(ex[field]);
          const newVal = normStr(inc[field]);

          if (YARD_FIELDS.includes(field)) {
            if (newVal !== "" && normKey(oldVal) !== normKey(newVal)) {
              diffs.push({
                field,
                label: FIELD_LABELS[field] || field,
                oldVal: oldVal || "Empty",
                newVal
              });
            }
          } else {
            if (normKey(oldVal) !== normKey(newVal)) {
              diffs.push({
                field,
                label: FIELD_LABELS[field] || field,
                oldVal: oldVal || "Empty",
                newVal: newVal || "Empty"
              });
            }
          }
        });

        const mergedRow = {
          ...ex,
          customer: normStr(inc.customer) !== "" ? inc.customer : ex.customer,
          units: normStr(inc.units) !== "" ? inc.units : ex.units,
          type: normStr(inc.type) !== "" ? inc.type : ex.type,
          bookingNo: normStr(inc.bookingNo) !== "" ? inc.bookingNo : ex.bookingNo,
          exGrid: normStr(inc.exGrid) !== "" ? inc.exGrid : ex.exGrid,
          ctnReleased: normStr(inc.ctnReleased) !== "" ? inc.ctnReleased : ex.ctnReleased,
          truckId: normStr(inc.truckId) !== "" ? inc.truckId : ex.truckId,
          time: normStr(inc.time) !== "" ? inc.time : ex.time,
          doors: normStr(inc.doors) !== "" ? inc.doors : ex.doors,
          comment: normStr(inc.comment) !== "" ? inc.comment : ex.comment
        };

        return { diffs, mergedRow };
      };

      DAYS.forEach((day) => {
        const existingRows = (currentDays[day] || []).filter(
          (r) =>
            r &&
            (normStr(r.customer) ||
              normStr(r.bookingNo) ||
              normStr(r.type) ||
              normStr(r.exGrid) ||
              normStr(r.ctnReleased))
        );
        const incomingRows = incomingDays[day] || [];

        const usedExistingIndices = new Set();
        const usedIncomingIndices = new Set();
        const updatedExistingMap = new Map();

        const registerMatch = (exIdx, incIdx) => {
          usedExistingIndices.add(exIdx);
          usedIncomingIndices.add(incIdx);

          const ex = existingRows[exIdx];
          const inc = incomingRows[incIdx];
          const { diffs, mergedRow } = buildRowDiffsAndMerge(ex, inc);

          if (diffs.length > 0) {
            updatedExistingMap.set(exIdx, { updatedRow: mergedRow, diffs });
            summary.updatedCount += 1;
            summary.items.push({
              type: "updated",
              day,
              lineNo: exIdx + 1,
              customer: mergedRow.customer,
              bookingNo: mergedRow.bookingNo,
              exGrid: mergedRow.exGrid,
              ctnReleased: mergedRow.ctnReleased,
              truckId: mergedRow.truckId,
              diffs
            });
          } else {
            summary.unchangedCount += 1;
          }
        };

        // Pass 1: Exact composite match
        incomingRows.forEach((inc, incIdx) => {
          if (usedIncomingIndices.has(incIdx)) return;
          const incCust = normKey(inc.customer);
          const incBkg = normKey(inc.bookingNo);
          const incType = normKey(inc.type);
          const incGrid = normKey(inc.exGrid);

          const matchIdx = existingRows.findIndex((ex, exIdx) => {
            if (usedExistingIndices.has(exIdx)) return false;
            return (
              normKey(ex.customer) === incCust &&
              normKey(ex.bookingNo) === incBkg &&
              normKey(ex.type) === incType &&
              normKey(ex.exGrid) === incGrid
            );
          });

          if (matchIdx !== -1) registerMatch(matchIdx, incIdx);
        });

        // Pass 2: Match on same Booking # + Customer
        incomingRows.forEach((inc, incIdx) => {
          if (usedIncomingIndices.has(incIdx)) return;
          const incCust = normKey(inc.customer);
          const incBkg = normKey(inc.bookingNo);
          if (!incBkg) return;

          const matchIdx = existingRows.findIndex((ex, exIdx) => {
            if (usedExistingIndices.has(exIdx)) return false;
            return normKey(ex.customer) === incCust && normKey(ex.bookingNo) === incBkg;
          });

          if (matchIdx !== -1) registerMatch(matchIdx, incIdx);
        });

        // Pass 3: Match on Customer + Type + ExGrid + (Ctn # or Truck ID)
        incomingRows.forEach((inc, incIdx) => {
          if (usedIncomingIndices.has(incIdx)) return;
          const incCust = normKey(inc.customer);
          const incType = normKey(inc.type);
          const incGrid = normKey(inc.exGrid);
          const incCtn = normKey(inc.ctnReleased);
          const incTruck = normKey(inc.truckId);

          if (!incCust) return;

          const matchIdx = existingRows.findIndex((ex, exIdx) => {
            if (usedExistingIndices.has(exIdx)) return false;
            const sameCustomerAndSpec =
              normKey(ex.customer) === incCust &&
              normKey(ex.type) === incType &&
              normKey(ex.exGrid) === incGrid;
            if (!sameCustomerAndSpec) return false;

            const ctnMatches = incCtn !== "" && normKey(ex.ctnReleased) === incCtn;
            const truckMatches = incTruck !== "" && normKey(ex.truckId) === incTruck;
            return ctnMatches || truckMatches;
          });

          if (matchIdx !== -1) registerMatch(matchIdx, incIdx);
        });

        // Pass 4: 1-to-1 same-position match when unmatched counts for Customer+Type+ExGrid match
        incomingRows.forEach((inc, incIdx) => {
          if (usedIncomingIndices.has(incIdx)) return;
          if (incIdx >= existingRows.length || usedExistingIndices.has(incIdx)) return;

          const ex = existingRows[incIdx];
          const sameSignature =
            normKey(ex.customer) !== "" &&
            normKey(ex.customer) === normKey(inc.customer) &&
            normKey(ex.type) === normKey(inc.type) &&
            normKey(ex.exGrid) === normKey(inc.exGrid);

          if (sameSignature) {
            const unmatchedExistingWithSig = existingRows.filter(
              (r, idx) =>
                !usedExistingIndices.has(idx) &&
                normKey(r.customer) === normKey(inc.customer) &&
                normKey(r.type) === normKey(inc.type) &&
                normKey(r.exGrid) === normKey(inc.exGrid)
            ).length;

            const unmatchedIncomingWithSig = incomingRows.filter(
              (r, idx) =>
                !usedIncomingIndices.has(idx) &&
                normKey(r.customer) === normKey(inc.customer) &&
                normKey(r.type) === normKey(inc.type) &&
                normKey(r.exGrid) === normKey(inc.exGrid)
            ).length;

            if (unmatchedExistingWithSig === unmatchedIncomingWithSig) {
              registerMatch(incIdx, incIdx);
            }
          }
        });

        const dayMergedList = existingRows.map((ex, exIdx) => {
          if (!usedExistingIndices.has(exIdx)) {
            summary.removedCount += 1;
            summary.items.push({
              type: "removed",
              day,
              lineNo: exIdx + 1,
              customer: ex.customer,
              bookingNo: ex.bookingNo,
              typeCode: ex.type,
              exGrid: ex.exGrid,
              ctnReleased: ex.ctnReleased,
              truckId: ex.truckId
            });
          }
          if (updatedExistingMap.has(exIdx)) {
            return updatedExistingMap.get(exIdx).updatedRow;
          }
          return { ...ex };
        });

        incomingRows.forEach((inc, incIdx) => {
          if (!usedIncomingIndices.has(incIdx)) {
            const newLineObj = {
              ...inc,
              rowId: inc.rowId || generateRowId()
            };
            dayMergedList.push(newLineObj);
            summary.addedCount += 1;
            summary.items.push({
              type: "added",
              day,
              lineNo: dayMergedList.length,
              customer: inc.customer,
              units: inc.units,
              typeCode: inc.type,
              bookingNo: inc.bookingNo,
              exGrid: inc.exGrid,
              ctnReleased: inc.ctnReleased,
              truckId: inc.truckId,
              time: inc.time,
              comment: inc.comment
            });
          }
        });

        mergedDays[day] = dayMergedList.map((r, idx) => ({ ...r, lineNo: idx + 1 }));
      });

      const typeOrder = { added: 0, updated: 1, removed: 2 };
      summary.items.sort((a, b) => (typeOrder[a.type] ?? 9) - (typeOrder[b.type] ?? 9));

      return { mergedDays, summary };
    };

    function App() {
      const [activeDay, setActiveDay] = useState("Monday");
      const [syncStatus, setSyncStatus] = useState(
        isFirebaseConfigured ? "connecting" : "unconfigured"
      );

      // Users & Auth State
      const [users, setUsers] = useState(() => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed.users) && parsed.users.length > 0) {
              return parsed.users;
            }
          }
        } catch (e) {}
        return INITIAL_USERS;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const savedSession = sessionStorage.getItem(SESSION_STORAGE_KEY);
          if (savedSession) return JSON.parse(savedSession);
        } catch (e) {}
        return null;
      });

      // Live Row Locks State
      const [activeRowLocks, setActiveRowLocks] = useState(() => {
        try {
          const raw = localStorage.getItem(LOCAL_LOCKS_STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      });
      const [nowTick, setNowTick] = useState(Date.now());

      // Login Screen Inputs
      const [loginUsername, setLoginUsername] = useState("");
      const [loginPin, setLoginPin] = useState("");
      const [loginError, setLoginError] = useState("");

      // Forced Personalized PIN Setup State
      const [pendingPinSetupUser, setPendingPinSetupUser] = useState(null);
      const [newPersonalPin, setNewPersonalPin] = useState("");
      const [confirmPersonalPin, setConfirmPersonalPin] = useState("");
      const [pinSetupError, setPinSetupError] = useState("");

      // Admin User Management Modal State
      const [isUserModalOpen, setIsUserModalOpen] = useState(false);
      const [newUserNameInput, setNewUserNameInput] = useState("");
      const [newUserRoleInput, setNewUserRoleInput] = useState("General User");
      const [userMgmtMessage, setUserMgmtMessage] = useState({ type: "", text: "" });

      // Sheet Data State
      const [sheetData, setSheetData] = useState(() => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed.daysData) return normalizeDaysData(parsed.daysData);
          }
        } catch (e) {}
        return createEmptyDaysObject();
      });

      const [headerMetadata, setHeaderMetadata] = useState(() => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed.headerMetadata) return parsed.headerMetadata;
          }
        } catch (e) {}
        return {
          Monday: DEFAULT_HEADER_BLOCK,
          Tuesday: DEFAULT_HEADER_BLOCK,
          Wednesday: DEFAULT_HEADER_BLOCK,
          Thursday: DEFAULT_HEADER_BLOCK,
          Friday: DEFAULT_HEADER_BLOCK,
          Saturday: DEFAULT_HEADER_BLOCK,
          Sunday: DEFAULT_HEADER_BLOCK
        };
      });

      const [currentWorkbookName, setCurrentWorkbookName] = useState(() => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed.currentWorkbookName) return parsed.currentWorkbookName;
          }
        } catch (e) {}
        return "";
      });

      const [workbookTemplateBase64, setWorkbookTemplateBase64] = useState(() => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed.workbookTemplateBase64) return parsed.workbookTemplateBase64;
          }
        } catch (e) {}
        return "";
      });

      const [isNoTemplateAlertOpen, setIsNoTemplateAlertOpen] = useState(false);
      const [pendingImportReview, setPendingImportReview] = useState(null);

      const [notification, setNotification] = useState("");
      const [isEditingNotice, setIsEditingNotice] = useState(false);
      const [tempNotice, setTempNotice] = useState("");
      const [draggedRowIndex, setDraggedRowIndex] = useState(null);
      const [dragOverRowIndex, setDragOverRowIndex] = useState(null);
      const [commentModal, setCommentModal] = useState({ isOpen: false, rowIndex: null, text: "" });
      
      // 7-Day Rolling Log, Sheet Snapshots & Admin-Only Monday-Anchored Weekly Log Archives
      const [activityLogs, setActivityLogs] = useState(() => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed.activityLogs)) return parsed.activityLogs;
          }
        } catch (e) {}
        return [];
      });

      const [importSnapshots, setImportSnapshots] = useState(() => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed.importSnapshots)) return parsed.importSnapshots;
          }
        } catch (e) {}
        return [];
      });

      const [weeklyLogArchives, setWeeklyLogArchives] = useState(() => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed.weeklyLogArchives)) return parsed.weeklyLogArchives;
          }
        } catch (e) {}
        return [];
      });

      const [isLogModalOpen, setIsLogModalOpen] = useState(false);
      const [logModalTab, setLogModalTab] = useState("edits");
      const [logSearchQuery, setLogSearchQuery] = useState("");
      const [forceGroupMode, setForceGroupMode] = useState(false);
      const [selectedArchiveWeekFilter, setSelectedArchiveWeekFilter] = useState("all");
      const [archiveFlashMessage, setArchiveFlashMessage] = useState("");
      
      const initialLoadSnapshotRef = useRef({});
      const fileInputRef = useRef(null);

      // Tracks the user's active single-row editing pass so typing across Ctn # -> Truck ID -> Time -> Doors -> Comments
      // merges into ONE combined log entry, while switching rows, another user editing, or returning later creates a NEW entry.
      const activeRowEditSessionRef = useRef(null);

      const resetRowEditSession = () => {
        activeRowEditSessionRef.current = null;
      };

      const isAdmin = currentUser && currentUser.role === "Admin";

      // Reset row edit session when switching days or opening modals
      useEffect(() => {
        resetRowEditSession();
      }, [activeDay, isLogModalOpen, isUserModalOpen]);

      useEffect(() => {
        if (!isAdmin && logModalTab === "admin-archives") {
          setLogModalTab("edits");
        }
      }, [isAdmin, logModalTab]);

      useEffect(() => {
        const timer = setInterval(() => {
          setNowTick(Date.now());
        }, 500);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const handleStorageSync = (e) => {
          if (e.key === LOCAL_LOCKS_STORAGE_KEY && e.newValue) {
            try {
              setActiveRowLocks(JSON.parse(e.newValue));
            } catch (err) {}
          }
        };
        window.addEventListener("storage", handleStorageSync);
        return () => window.removeEventListener("storage", handleStorageSync);
      }, []);

      const pruneOlderThanSevenDays = (items) => {
        if (!Array.isArray(items)) return [];
        const cutoff = Date.now() - SEVEN_DAYS_MS;
        return items.filter((item) => item && item.timestamp && item.timestamp >= cutoff);
      };

      const touchRowActivityLock = (day, rowObj, rowIndex) => {
        if (!currentUser || !rowObj) return;
        const rowKey = rowObj.rowId || `idx-${rowIndex}`;
        const compositeKey = `${day}__${rowKey}`;
        const lockRecord = {
          userId: currentUser.id,
          username: currentUser.username,
          expiresAt: Date.now() + ROW_LOCK_DURATION_MS
        };

        setActiveRowLocks((prev) => {
          const updated = {
            ...prev,
            [compositeKey]: lockRecord
          };
          try {
            localStorage.setItem(LOCAL_LOCKS_STORAGE_KEY, JSON.stringify(updated));
          } catch (e) {}
          return updated;
        });

        if (db) {
          db.ref(`container_release_locks/${compositeKey}`).set(lockRecord).catch(() => {});
        }
      };

      const persistState = (overrides = {}) => {
        const rawLogs =
          overrides.activityLogs !== undefined ? overrides.activityLogs : activityLogs;
        const baseArchives =
          overrides.weeklyLogArchives !== undefined
            ? overrides.weeklyLogArchives
            : weeklyLogArchives;

        const { archives: syncedArchives } = syncWeeklyLogArchives(
          rawLogs,
          baseArchives,
          false,
          "Auto Weekly Backup (Monday Cycle)"
        );

        const prunedLogs = pruneOlderThanSevenDays(rawLogs);
        const prunedSnapshots = pruneOlderThanSevenDays(
          overrides.importSnapshots !== undefined ? overrides.importSnapshots : importSnapshots
        );

        const nextDaysData = normalizeDaysData(
          overrides.daysData !== undefined ? overrides.daysData : sheetData
        );
        const nextHeaders =
          overrides.headerMetadata !== undefined ? overrides.headerMetadata : headerMetadata;
        const nextNotice =
          overrides.notification !== undefined ? overrides.notification : notification;
        const nextUsers =
          overrides.users !== undefined ? overrides.users : users;
        const nextWorkbookName =
          overrides.currentWorkbookName !== undefined
            ? overrides.currentWorkbookName
            : currentWorkbookName;
        const nextTemplateBase64 =
          overrides.workbookTemplateBase64 !== undefined
            ? overrides.workbookTemplateBase64
            : workbookTemplateBase64;

        setWeeklyLogArchives(syncedArchives);

        const payload = {
          daysData: nextDaysData,
          headerMetadata: nextHeaders,
          notification: nextNotice,
          users: nextUsers,
          currentWorkbookName: nextWorkbookName,
          workbookTemplateBase64: nextTemplateBase64,
          activityLogs: prunedLogs,
          importSnapshots: prunedSnapshots,
          weeklyLogArchives: syncedArchives,
          lastUpdated: new Date().toISOString()
        };

        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(payload));
        } catch (err) {
          console.warn("Local cache save skipped:", err);
        }

        if (db) {
          db.ref("container_release")
            .set(payload)
            .then(() => setSyncStatus("connected"))
            .catch((err) => {
              console.error("Firebase write error:", err);
              setSyncStatus("error");
            });
        }
      };

      useEffect(() => {
        if (!db) return;

        const connectedRef = db.ref(".info/connected");
        connectedRef.on("value", (snap) => {
          if (snap.val() === true) {
            setSyncStatus("connected");
          } else {
            setSyncStatus("connecting");
          }
        });

        const locksRef = db.ref("container_release_locks");
        locksRef.on("value", (snap) => {
          const val = snap.val() || {};
          setActiveRowLocks(val);
        });

        const releaseRef = db.ref("container_release");
        releaseRef.on(
          "value",
          (snapshot) => {
            const val = snapshot.val();
            setSyncStatus("connected");
            if (val) {
              if (val.daysData) {
                const normalized = normalizeDaysData(val.daysData);
                setSheetData(normalized);
                initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(normalized));
              }
              if (val.headerMetadata) setHeaderMetadata(val.headerMetadata);
              if (val.notification !== undefined) setNotification(val.notification);
              if (val.currentWorkbookName !== undefined) setCurrentWorkbookName(val.currentWorkbookName);
              if (val.workbookTemplateBase64 !== undefined) setWorkbookTemplateBase64(val.workbookTemplateBase64);
              if (Array.isArray(val.users) && val.users.length > 0) {
                setUsers(val.users);
              }

              const incomingLogs = Array.isArray(val.activityLogs) ? val.activityLogs : [];
              const incomingArchives = Array.isArray(val.weeklyLogArchives) ? val.weeklyLogArchives : [];
              const { archives: syncedArchives, hasChanges } = syncWeeklyLogArchives(
                incomingLogs,
                incomingArchives,
                false,
                "Auto Weekly Backup (Monday Cycle)"
              );

              setActivityLogs(pruneOlderThanSevenDays(incomingLogs));
              setWeeklyLogArchives(syncedArchives);
              if (val.importSnapshots) setImportSnapshots(pruneOlderThanSevenDays(val.importSnapshots));

              if (hasChanges) {
                db.ref("container_release/weeklyLogArchives").set(syncedArchives).catch(() => {});
              }

              try {
                localStorage.setItem(
                  LOCAL_STORAGE_KEY,
                  JSON.stringify({ ...val, weeklyLogArchives: syncedArchives })
                );
              } catch (e) {}
            } else {
              persistState({ users: INITIAL_USERS });
            }
          },
          (error) => {
            console.error("Firebase read error:", error);
            setSyncStatus("error");
          }
        );

        return () => {
          connectedRef.off();
          locksRef.off();
          releaseRef.off();
        };
      }, []);

      useEffect(() => {
        if (!currentUser) return;
        const freshUser = users.find((u) => u.id === currentUser.id);
        if (!freshUser) {
          handleLogout();
        } else if (freshUser.mustChangePin || freshUser.pin === DEFAULT_PIN) {
          setPendingPinSetupUser(freshUser);
          setCurrentUser(null);
          sessionStorage.removeItem(SESSION_STORAGE_KEY);
        } else if (freshUser.role !== currentUser.role || freshUser.username !== currentUser.username) {
          const safeSession = { id: freshUser.id, username: freshUser.username, role: freshUser.role };
          setCurrentUser(safeSession);
          sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(safeSession));
        }
      }, [users]);

      // --- ADMIN WEEKLY ARCHIVE HANDLERS ---
      const handleBackupCurrentWeekNow = () => {
        if (!isAdmin) return;
        const { archives: updatedArchives } = syncWeeklyLogArchives(
          activityLogs,
          weeklyLogArchives,
          true,
          `Manual Backup by ${currentUser.username} (${formatLogTimestamp(Date.now())})`
        );
        setWeeklyLogArchives(updatedArchives);
        setArchiveFlashMessage("Current week's logs have been backed up into the Admin Weekly Archive.");
        setTimeout(() => setArchiveFlashMessage(""), 4500);
        persistState({ weeklyLogArchives: updatedArchives });
      };

      const handleDeleteWeeklyArchive = (weekStartMs) => {
        if (!isAdmin) return;
        const updatedArchives = weeklyLogArchives.filter((a) => a.weekStartMs !== weekStartMs);
        setWeeklyLogArchives(updatedArchives);
        if (selectedArchiveWeekFilter === String(weekStartMs)) {
          setSelectedArchiveWeekFilter("all");
        }
        persistState({ weeklyLogArchives: updatedArchives });
      };

      const handleDownloadArchiveCsv = (archiveObj) => {
        if (!isAdmin || !archiveObj || !Array.isArray(archiveObj.logs)) return;
        const headers = [
          "Timestamp",
          "User",
          "Role",
          "Day",
          "Line #",
          "Action",
          "Summary",
          "Customer",
          "Units",
          "Type",
          "Booking #",
          "Ex Grid",
          "Ctn # Released",
          "Truck ID",
          "Time",
          "Doors",
          "Comments"
        ];
        const escapeCsv = (val) => `"${String(val || "").replace(/"/g, '""')}"`;
        const rows = archiveObj.logs.map((l) => {
          const s = l.lineSnapshot || {};
          return [
            l.formattedTime,
            l.username,
            l.role,
            l.day,
            l.lineNo,
            l.action,
            l.details,
            s.customer || l.customer || "",
            s.units || "",
            s.type || "",
            s.bookingNo || l.bookingNo || "",
            s.exGrid || "",
            s.ctnReleased || l.ctnReleased || "",
            s.truckId || l.truckId || "",
            s.time || "",
            s.doors || "",
            s.comment || ""
          ]
            .map(escapeCsv)
            .join(",");
        });

        const csvContent = [headers.join(","), ...rows].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const safeLabel = (archiveObj.weekLabel || "Weekly_Log").replace(/[^a-zA-Z0-9_-]+/g, "_");
        link.href = url;
        link.download = `Admin_Log_Archive_${safeLabel}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      // --- AUTHENTICATION HANDLERS ---
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError("");

        const trimmedName = loginUsername.trim();
        if (!trimmedName) {
          setLoginError("Please enter your username.");
          return;
        }
        if (!/^\d{4}$/.test(loginPin)) {
          setLoginError("Please enter a valid 4-digit PIN.");
          return;
        }

        const matchedUser = users.find(
          (u) => u.username.toLowerCase() === trimmedName.toLowerCase()
        );

        if (!matchedUser || matchedUser.pin !== loginPin) {
          setLoginError("Invalid username or PIN.");
          return;
        }

        if (matchedUser.pin === DEFAULT_PIN || matchedUser.mustChangePin) {
          setPendingPinSetupUser(matchedUser);
          setNewPersonalPin("");
          setConfirmPersonalPin("");
          setPinSetupError("");
          setLoginPin("");
          return;
        }

        const safeSession = {
          id: matchedUser.id,
          username: matchedUser.username,
          role: matchedUser.role
        };
        setCurrentUser(safeSession);
        sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(safeSession));
        setLoginUsername("");
        setLoginPin("");
      };

      const handleCompletePinSetup = (e) => {
        e.preventDefault();
        setPinSetupError("");

        if (!/^\d{4}$/.test(newPersonalPin)) {
          setPinSetupError("Your new PIN must be exactly 4 digits.");
          return;
        }
        if (newPersonalPin === DEFAULT_PIN) {
          setPinSetupError("You cannot use the default PIN (1111). Choose a personal 4-digit PIN.");
          return;
        }
        if (newPersonalPin !== confirmPersonalPin) {
          setPinSetupError("PINs do not match. Please re-enter.");
          return;
        }

        const updatedUsers = users.map((u) =>
          u.id === pendingPinSetupUser.id
            ? { ...u, pin: newPersonalPin, mustChangePin: false }
            : u
        );

        const safeSession = {
          id: pendingPinSetupUser.id,
          username: pendingPinSetupUser.username,
          role: pendingPinSetupUser.role
        };

        setUsers(updatedUsers);
        setCurrentUser(safeSession);
        sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(safeSession));
        setPendingPinSetupUser(null);
        setNewPersonalPin("");
        setConfirmPersonalPin("");

        persistState({ users: updatedUsers });
      };

      const handleLogout = () => {
        resetRowEditSession();
        setCurrentUser(null);
        setPendingPinSetupUser(null);
        sessionStorage.removeItem(SESSION_STORAGE_KEY);
      };

      // --- ADMIN USER MANAGEMENT HANDLERS ---
      const handleAddUser = (e) => {
        e.preventDefault();
        setUserMgmtMessage({ type: "", text: "" });

        const cleanName = newUserNameInput.trim();
        if (!cleanName) {
          setUserMgmtMessage({ type: "error", text: "Username cannot be empty." });
          return;
        }

        const duplicateExists = users.some(
          (u) => u.username.toLowerCase() === cleanName.toLowerCase()
        );
        if (duplicateExists) {
          setUserMgmtMessage({
            type: "error",
            text: `Username "${cleanName}" already exists. Choose a different name.`
          });
          return;
        }

        const newUser = {
          id: `user-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
          username: cleanName,
          role: newUserRoleInput,
          pin: DEFAULT_PIN,
          mustChangePin: true,
          createdAt: Date.now()
        };

        const updatedUsers = [...users, newUser];
        const logEntry = createLogEntry(
          "System",
          "-",
          "User Created",
          `Added ${newUserRoleInput} user "${cleanName}" (Default PIN assigned)`
        );
        const updatedLogs = [logEntry, ...activityLogs];

        setUsers(updatedUsers);
        setActivityLogs(pruneOlderThanSevenDays(updatedLogs));
        setNewUserNameInput("");
        setNewUserRoleInput("General User");
        setUserMgmtMessage({
          type: "success",
          text: `User "${cleanName}" added with default PIN (1111). They will be prompted to set a personal PIN on first login.`
        });

        persistState({ users: updatedUsers, activityLogs: updatedLogs });
      };

      const handleResetUserPin = (targetUser) => {
        const updatedUsers = users.map((u) =>
          u.id === targetUser.id ? { ...u, pin: DEFAULT_PIN, mustChangePin: true } : u
        );

        const logEntry = createLogEntry(
          "System",
          "-",
          "PIN Reset",
          `Reset PIN to default (1111) for user "${targetUser.username}"`
        );
        const updatedLogs = [logEntry, ...activityLogs];

        setUsers(updatedUsers);
        setActivityLogs(pruneOlderThanSevenDays(updatedLogs));
        setUserMgmtMessage({
          type: "success",
          text: `PIN for "${targetUser.username}" reset to default (1111).`
        });

        persistState({ users: updatedUsers, activityLogs: updatedLogs });
      };

      const handleRemoveUser = (targetUser) => {
        if (targetUser.id === currentUser.id) {
          setUserMgmtMessage({
            type: "error",
            text: "You cannot delete your own active Admin account."
          });
          return;
        }

        const adminCount = users.filter((u) => u.role === "Admin").length;
        if (targetUser.role === "Admin" && adminCount <= 1) {
          setUserMgmtMessage({
            type: "error",
            text: "Cannot remove the last remaining Admin user."
          });
          return;
        }

        const updatedUsers = users.filter((u) => u.id !== targetUser.id);
        const logEntry = createLogEntry(
          "System",
          "-",
          "User Removed",
          `Removed user "${targetUser.username}"`
        );
        const updatedLogs = [logEntry, ...activityLogs];

        setUsers(updatedUsers);
        setActivityLogs(pruneOlderThanSevenDays(updatedLogs));
        setUserMgmtMessage({
          type: "success",
          text: `User "${targetUser.username}" removed.`
        });

        persistState({ users: updatedUsers, activityLogs: updatedLogs });
      };

      // --- LOGGING & FULL-LINE SNAPSHOT HELPERS ---
      const formatLogTimestamp = (ms) => {
        const d = new Date(ms);
        const day = String(d.getDate()).padStart(2, "0");
        const month = d.toLocaleString("en-NZ", { month: "short" });
        const year = d.getFullYear();
        const hrs = String(d.getHours()).padStart(2, "0");
        const mins = String(d.getMinutes()).padStart(2, "0");
        return `${day} ${month} ${year} • ${hrs}:${mins}`;
      };

      const buildRowSnapshotObject = (meta) => ({
        customer: meta.customer || "",
        units: meta.units || "1",
        type: meta.type || "",
        bookingNo: meta.bookingNo || "",
        exGrid: meta.exGrid || "",
        ctnReleased: meta.ctnReleased || "",
        truckId: meta.truckId || "",
        time: meta.time || "",
        doors: meta.doors || "Forward",
        comment: meta.comment || ""
      });

      const createLogEntry = (day, lineNo, action, details, meta = {}, changeInfo = null) => {
        const now = Date.now();
        const hasRowSnapshot =
          meta &&
          (meta.customer !== undefined ||
            meta.bookingNo !== undefined ||
            meta.ctnReleased !== undefined ||
            meta.exGrid !== undefined);

        const lineSnapshot = hasRowSnapshot ? buildRowSnapshotObject(meta) : null;
        const initialChanges = changeInfo
          ? [
              {
                field: changeInfo.field,
                label: FIELD_LABELS[changeInfo.field] || changeInfo.field,
                oldVal: changeInfo.oldVal || "",
                newVal: changeInfo.newVal || ""
              }
            ]
          : [];

        return {
          id: `${now}-${Math.random().toString(36).substr(2, 5)}`,
          timestamp: now,
          formattedTime: formatLogTimestamp(now),
          day,
          lineNo,
          rowId: meta.rowId || null,
          userId: currentUser ? currentUser.id : "unknown",
          username: currentUser ? currentUser.username : "Unknown",
          role: currentUser ? currentUser.role : "General User",
          action,
          details,
          customer: meta.customer || "",
          bookingNo: meta.bookingNo || "",
          ctnReleased: meta.ctnReleased || "",
          truckId: meta.truckId || "",
          lineSnapshot,
          changes: initialChanges,
          changedField: changeInfo ? changeInfo.field : null,
          oldValue: changeInfo ? changeInfo.oldVal : null,
          newValue: changeInfo ? changeInfo.newVal : null
        };
      };

      const getCurrent24HrTime = () => {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        return `${hours}${minutes}`;
      };

      const format24HrTime = (val) => {
        if (!val) return "";
        let cleaned = val.toString().replace(/[^0-9]/g, "");
        if (cleaned.length > 4) cleaned = cleaned.substring(0, 4);
        return cleaned;
      };

      const isRowValid = (row) => {
        if (!row) return false;
        return (
          (row.customer && row.customer.toString().trim() !== "") ||
          (row.bookingNo && row.bookingNo.toString().trim() !== "") ||
          (row.type && row.type.toString().trim() !== "") ||
          (row.exGrid && row.exGrid.toString().trim() !== "") ||
          (row.ctnReleased && row.ctnReleased.toString().trim() !== "") ||
          (row.truckId && row.truckId.toString().trim() !== "") ||
          (row.comment && row.comment.toString().trim() !== "")
        );
      };

      const getRowLockStatus = (day, rowObj, rowIndex) => {
        if (!rowObj) return { isLocked: false, isLockedByOther: false, remainingSec: 0, username: "" };
        const rowKey = rowObj.rowId || `idx-${rowIndex}`;
        const compositeKey = `${day}__${rowKey}`;
        const lock = activeRowLocks[compositeKey];
        if (!lock || !lock.expiresAt || lock.expiresAt <= nowTick) {
          return { isLocked: false, isLockedByOther: false, remainingSec: 0, username: "" };
        }
        const remainingSec = Math.max(1, Math.ceil((lock.expiresAt - nowTick) / 1000));
        const isSelf = currentUser && lock.userId === currentUser.id;
        return {
          isLocked: true,
          isLockedByOther: !isSelf,
          remainingSec,
          username: lock.username || "Another user"
        };
      };

      // When user focuses/clicks on a row, if it's a DIFFERENT row than their previous focus,
      // close the previous row session so returning to that row later creates a fresh log entry.
      const handleRowFocus = (day, rowObj, rowIndex) => {
        if (!currentUser || !rowObj) return;
        const rowKey = rowObj.rowId || `idx-${rowIndex}`;
        const curSession = activeRowEditSessionRef.current;
        if (
          curSession &&
          (curSession.userId !== currentUser.id ||
            curSession.day !== day ||
            curSession.rowKey !== rowKey)
        ) {
          activeRowEditSessionRef.current = null;
        }
      };

      const handleCellChange = (rowIndex, field, value) => {
        const updatedDayData = [...(sheetData[activeDay] || [])];
        if (!updatedDayData[rowIndex]) return;

        handleRowFocus(activeDay, updatedDayData[rowIndex], rowIndex);
        touchRowActivityLock(activeDay, updatedDayData[rowIndex], rowIndex);

        let autoTime = updatedDayData[rowIndex].time;

        if (field === "ctnReleased" && value.trim() !== "" && (!autoTime || autoTime.trim() === "")) {
          autoTime = getCurrent24HrTime();
        }

        updatedDayData[rowIndex] = {
          ...updatedDayData[rowIndex],
          [field]: value,
          time: autoTime
        };

        const newSheetData = {
          ...sheetData,
          [activeDay]: updatedDayData
        };
        setSheetData(newSheetData);
      };

      const handleCellBlur = (rowIndex, field, value) => {
        let finalValue = value;
        if (field === "time") {
          finalValue = format24HrTime(value);
        }

        const updatedDayData = [...(sheetData[activeDay] || [])];
        if (!updatedDayData[rowIndex]) return;

        const targetRow = updatedDayData[rowIndex];
        const prevRowSnapshot = (initialLoadSnapshotRef.current[activeDay] || [])[rowIndex] || {};

        updatedDayData[rowIndex] = {
          ...targetRow,
          [field]: finalValue
        };

        const updatedRowObj = updatedDayData[rowIndex];
        const newSheetData = {
          ...sheetData,
          [activeDay]: updatedDayData
        };
        setSheetData(newSheetData);

        // Collect all fields on this row that changed since the last saved snapshot
        // (this automatically captures both the field blurred AND any auto-filled Time when Ctn # was entered)
        const fieldDiffs = [];
        const fieldsToCheck = Array.from(new Set([field, "time"]));
        fieldsToCheck.forEach((fKey) => {
          const oldVal = (prevRowSnapshot[fKey] || "").toString().trim();
          const newVal = (updatedRowObj[fKey] || "").toString().trim();
          if (oldVal !== newVal) {
            fieldDiffs.push({
              field: fKey,
              label: FIELD_LABELS[fKey] || fKey,
              oldVal,
              newVal
            });
          }
        });

        let updatedLogs = activityLogs;
        if (fieldDiffs.length > 0) {
          const now = Date.now();
          const rowKey = updatedRowObj.rowId || `idx-${rowIndex}`;
          const session = activeRowEditSessionRef.current;

          const isSameActiveSession =
            session &&
            currentUser &&
            session.userId === currentUser.id &&
            session.day === activeDay &&
            session.rowKey === rowKey &&
            now - session.lastTouchedAt <= ROW_EDIT_SESSION_IDLE_MS;

          const existingEntryIdx = isSameActiveSession
            ? activityLogs.findIndex((item) => item && item.id === session.logId)
            : -1;

          // Check if the user is re-editing a field they already edited in this session (e.g., going back to fix Truck ID)
          const existingEntry = existingEntryIdx !== -1 ? activityLogs[existingEntryIdx] : null;
          const alreadyEditedFields = existingEntry
            ? new Set(
                (Array.isArray(existingEntry.changes) && existingEntry.changes.length > 0
                  ? existingEntry.changes.map((c) => c.field)
                  : existingEntry.changedField
                  ? [existingEntry.changedField]
                  : [])
              )
            : new Set();

          const isReEditingSameField = fieldDiffs.some((d) => alreadyEditedFields.has(d.field));

          if (existingEntry && !isReEditingSameField) {
            // Coalesce into the SAME single log entry for this user's continuous row pass
            const priorChanges =
              Array.isArray(existingEntry.changes) && existingEntry.changes.length > 0
                ? existingEntry.changes
                : existingEntry.changedField
                ? [
                    {
                      field: existingEntry.changedField,
                      label: FIELD_LABELS[existingEntry.changedField] || existingEntry.changedField,
                      oldVal: existingEntry.oldValue || "",
                      newVal: existingEntry.newValue || ""
                    }
                  ]
                : [];

            const mergedChanges = [...priorChanges, ...fieldDiffs];
            const combinedSummary = mergedChanges
              .map((c) => `${c.label}: "${c.oldVal || "Empty"}" → "${c.newVal || "Cleared"}"`)
              .join(" • ");

            const updatedEntry = {
              ...existingEntry,
              timestamp: now,
              formattedTime: formatLogTimestamp(now),
              lineNo: rowIndex + 1,
              action: mergedChanges.length > 1 ? `Line Updated (${mergedChanges.length} fields)` : "Field Updated",
              details: combinedSummary,
              customer: updatedRowObj.customer || "",
              bookingNo: updatedRowObj.bookingNo || "",
              ctnReleased: updatedRowObj.ctnReleased || "",
              truckId: updatedRowObj.truckId || "",
              lineSnapshot: buildRowSnapshotObject(updatedRowObj),
              changes: mergedChanges,
              changedField: mergedChanges[mergedChanges.length - 1].field,
              oldValue: mergedChanges[mergedChanges.length - 1].oldVal,
              newValue: mergedChanges[mergedChanges.length - 1].newVal
            };

            const nextLogs = [...activityLogs];
            nextLogs.splice(existingEntryIdx, 1);
            updatedLogs = [updatedEntry, ...nextLogs];

            activeRowEditSessionRef.current = {
              userId: currentUser.id,
              day: activeDay,
              rowKey,
              logId: updatedEntry.id,
              lastTouchedAt: now
            };
          } else {
            // Start a brand-new log entry (new row, different user, idle > 3 mins, or re-editing an already-changed field)
            const combinedSummary = fieldDiffs
              .map((c) => `${c.label}: "${c.oldVal || "Empty"}" → "${c.newVal || "Cleared"}"`)
              .join(" • ");

            const primaryDiff = fieldDiffs[0];
            const logItem = createLogEntry(
              activeDay,
              rowIndex + 1,
              fieldDiffs.length > 1 ? `Line Updated (${fieldDiffs.length} fields)` : "Field Updated",
              combinedSummary,
              updatedRowObj,
              primaryDiff
            );
            logItem.changes = fieldDiffs;

            updatedLogs = [logItem, ...activityLogs];

            activeRowEditSessionRef.current = {
              userId: currentUser ? currentUser.id : "unknown",
              day: activeDay,
              rowKey,
              logId: logItem.id,
              lastTouchedAt: now
            };
          }

          setActivityLogs(pruneOlderThanSevenDays(updatedLogs));
          initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(newSheetData));
        }

        persistState({
          daysData: newSheetData,
          activityLogs: updatedLogs
        });
      };

      const handleAddRow = () => {
        resetRowEditSession();
        const currentList = sheetData[activeDay] || [];
        const newRow = {
          rowId: generateRowId(),
          lineNo: currentList.length + 1,
          customer: "",
          units: "1",
          type: "",
          bookingNo: "",
          exGrid: "AV1",
          ctnReleased: "",
          truckId: "",
          time: "",
          doors: "Forward",
          comment: "",
          isNew: true
        };
        const updatedList = [...currentList, newRow];
        const newSheetData = { ...sheetData, [activeDay]: updatedList };
        const logItem = createLogEntry(activeDay, updatedList.length, "Line Added", "Added new schedule row", newRow);
        const updatedLogs = [logItem, ...activityLogs];

        setSheetData(newSheetData);
        setActivityLogs(pruneOlderThanSevenDays(updatedLogs));
        initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(newSheetData));
        persistState({ daysData: newSheetData, activityLogs: updatedLogs });
      };

      const handleRemoveRow = (index) => {
        resetRowEditSession();
        const currentList = sheetData[activeDay] || [];
        const removedRow = currentList[index] || {};
        const updatedList = currentList.filter((_, idx) => idx !== index).map((row, idx) => ({
          ...row,
          lineNo: idx + 1
        }));
        const newSheetData = { ...sheetData, [activeDay]: updatedList };
        const detail = `Removed line (${removedRow.customer || "No Customer"} | Booking: ${removedRow.bookingNo || "N/A"})`;
        const logItem = createLogEntry(activeDay, index + 1, "Line Removed", detail, removedRow);
        const updatedLogs = [logItem, ...activityLogs];

        setSheetData(newSheetData);
        setActivityLogs(pruneOlderThanSevenDays(updatedLogs));
        initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(newSheetData));
        persistState({ daysData: newSheetData, activityLogs: updatedLogs });
      };

      const handleDragStart = (e, index) => {
        if (!isAdmin) return;
        resetRowEditSession();
        setDraggedRowIndex(index);
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDragOver = (e, index) => {
        if (!isAdmin) return;
        e.preventDefault();
        if (draggedRowIndex === null) return;
        setDragOverRowIndex(index);
      };

      const handleDrop = (e, index) => {
        if (!isAdmin) return;
        e.preventDefault();
        if (draggedRowIndex === null || draggedRowIndex === index) {
          setDraggedRowIndex(null);
          setDragOverRowIndex(null);
          return;
        }
        const currentList = [...(sheetData[activeDay] || [])];
        const draggedItem = currentList[draggedRowIndex];
        currentList.splice(draggedRowIndex, 1);
        currentList.splice(index, 0, draggedItem);

        const reindexed = currentList.map((item, idx) => ({ ...item, lineNo: idx + 1 }));
        const newSheetData = { ...sheetData, [activeDay]: reindexed };
        const logItem = createLogEntry(
          activeDay,
          index + 1,
          "Line Reordered",
          `Moved line #${draggedRowIndex + 1} to #${index + 1} (${draggedItem.customer || "Row"})`,
          draggedItem
        );
        const updatedLogs = [logItem, ...activityLogs];

        setSheetData(newSheetData);
        setActivityLogs(pruneOlderThanSevenDays(updatedLogs));
        initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(newSheetData));
        persistState({ daysData: newSheetData, activityLogs: updatedLogs });
        setDraggedRowIndex(null);
        setDragOverRowIndex(null);
      };

      // =======================================================================
      // SMART IMPORT PARSING WITH EXCELJS
      // =======================================================================
      const handleImportExcel = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        resetRowEditSession();
        const importedFileName = file.name;

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const arrayBuffer = evt.target.result;
            const incomingBase64 = arrayBufferToBase64(arrayBuffer);

            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(arrayBuffer);

            const parsedIncomingDays = createEmptyDaysObject();
            const newHeaderMeta = { ...headerMetadata };
            let totalIncomingRows = 0;

            workbook.eachSheet((worksheet) => {
              const sheetName = worksheet.name;
              const matchedDay = DAYS.find((d) => sheetName.toLowerCase().includes(d.toLowerCase()));
              if (matchedDay) {
                const headers = [];
                for (let r = 1; r <= 3; r++) {
                  const rowObj = worksheet.getRow(r);
                  const rowArr = [];
                  for (let c = 1; c <= 11; c++) {
                    rowArr.push(getExcelCellText(rowObj.getCell(c)));
                  }
                  headers.push(rowArr);
                }
                if (headers.length > 0) {
                  newHeaderMeta[matchedDay] = headers;
                }

                const parsedRows = [];
                worksheet.eachRow({ includeEmpty: false }, (rowObj, rowNumber) => {
                  if (rowNumber <= 3) return;
                  const rowData = {
                    rowId: generateRowId(),
                    lineNo: parsedRows.length + 1,
                    customer: getExcelCellText(rowObj.getCell(2)),
                    units: getExcelCellText(rowObj.getCell(3)) || "1",
                    type: getExcelCellText(rowObj.getCell(4)),
                    bookingNo: getExcelCellText(rowObj.getCell(5)),
                    exGrid: getExcelCellText(rowObj.getCell(6)).toUpperCase(),
                    ctnReleased: getExcelCellText(rowObj.getCell(7)),
                    truckId: getExcelCellText(rowObj.getCell(8)),
                    time: format24HrTime(getExcelCellText(rowObj.getCell(9))),
                    doors: getExcelCellText(rowObj.getCell(10)) || "Forward",
                    comment: getExcelCellText(rowObj.getCell(11))
                  };
                  if (isRowValid(rowData)) {
                    parsedRows.push(rowData);
                  }
                });

                totalIncomingRows += parsedRows.length;
                parsedIncomingDays[matchedDay] = parsedRows;
              }
            });

            const hasExistingRows = DAYS.some((d) => (sheetData[d] || []).filter(isRowValid).length > 0);

            if (!hasExistingRows) {
              applyImportAction("overwrite", {
                importedFileName,
                incomingBase64,
                incomingDays: parsedIncomingDays,
                mergedDays: parsedIncomingDays,
                newHeaderMeta,
                totalIncomingRows,
                summary: { addedCount: totalIncomingRows, updatedCount: 0, unchangedCount: 0, removedCount: 0, items: [] }
              });
            } else {
              const { mergedDays, summary } = computeImportAnalysis(sheetData, parsedIncomingDays);
              setPendingImportReview({
                importedFileName,
                incomingBase64,
                incomingDays: parsedIncomingDays,
                mergedDays,
                newHeaderMeta,
                totalIncomingRows,
                summary
              });
            }
          } catch (err) {
            console.error("Import error:", err);
            alert("Could not read this Excel file. Please ensure it is a valid .xlsx workbook.");
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = "";
      };

      const applyImportAction = (mode, reviewPayload) => {
        if (!reviewPayload) return;
        resetRowEditSession();
        const {
          importedFileName,
          incomingBase64,
          incomingDays,
          mergedDays,
          newHeaderMeta,
          totalIncomingRows,
          summary
        } = reviewPayload;

        const hasExistingRows = DAYS.some((d) => (sheetData[d] || []).filter(isRowValid).length > 0);
        let updatedSnapshots = pruneOlderThanSevenDays(importSnapshots);

        if (hasExistingRows) {
          const totalActiveRows = DAYS.reduce((acc, d) => acc + (sheetData[d] || []).filter(isRowValid).length, 0);
          const now = Date.now();
          const backedUpSheetTitle = currentWorkbookName || "Previous Release Sheet";
          const backupSnapshot = {
            id: `snap-${now}`,
            timestamp: now,
            formattedTime: formatLogTimestamp(now),
            sheetName: backedUpSheetTitle,
            workbookTemplateBase64: workbookTemplateBase64 || "",
            importedBy: currentUser ? currentUser.username : "Unknown",
            label:
              mode === "merge"
                ? `Backed up before merging changes from "${importedFileName}"`
                : `Backed up before overwriting with "${importedFileName}"`,
            rowCount: totalActiveRows,
            daysData: JSON.parse(JSON.stringify(sheetData)),
            headerMetadata: JSON.parse(JSON.stringify(headerMetadata))
          };
          updatedSnapshots = [backupSnapshot, ...updatedSnapshots];
        }

        const finalDaysData = mode === "merge" ? mergedDays : incomingDays;

        const logDescription =
          mode === "merge"
            ? `Merged "${importedFileName}" (+${summary.addedCount} added, ${summary.updatedCount} updated; existing yard entries preserved)`
            : `Overwrote sheet with "${importedFileName}" (${totalIncomingRows} active lines across week)`;

        const importLog = createLogEntry(
          "All Days",
          "-",
          mode === "merge" ? "Excel Merged" : "Excel Overwritten",
          logDescription
        );
        const updatedLogs = [importLog, ...activityLogs];

        setSheetData(finalDaysData);
        setHeaderMetadata(newHeaderMeta);
        setCurrentWorkbookName(importedFileName);
        setWorkbookTemplateBase64(incomingBase64);
        setImportSnapshots(updatedSnapshots);
        setActivityLogs(pruneOlderThanSevenDays(updatedLogs));
        setPendingImportReview(null);
        initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(finalDaysData));

        persistState({
          daysData: finalDaysData,
          headerMetadata: newHeaderMeta,
          currentWorkbookName: importedFileName,
          workbookTemplateBase64: incomingBase64,
          activityLogs: updatedLogs,
          importSnapshots: updatedSnapshots
        });
      };

      const handleRestoreSnapshot = (snapshot) => {
        if (!snapshot || !snapshot.daysData) return;
        resetRowEditSession();

        const now = Date.now();
        const currentTotal = DAYS.reduce((acc, d) => acc + (sheetData[d] || []).filter(isRowValid).length, 0);
        const restoredSheetTitle = snapshot.sheetName || "Backed Up Sheet";
        const safetyBackup = {
          id: `snap-${now}`,
          timestamp: now,
          formattedTime: formatLogTimestamp(now),
          sheetName: currentWorkbookName || "Previous Release Sheet",
          workbookTemplateBase64: workbookTemplateBase64 || "",
          importedBy: currentUser ? currentUser.username : "Unknown",
          label: `Backed up before restoring "${restoredSheetTitle}"`,
          rowCount: currentTotal,
          daysData: JSON.parse(JSON.stringify(sheetData)),
          headerMetadata: JSON.parse(JSON.stringify(headerMetadata))
        };

        const restoreLog = createLogEntry(
          "All Days",
          "-",
          "Snapshot Restored",
          `Restored "${restoredSheetTitle}" from ${snapshot.formattedTime} (${snapshot.rowCount} lines)`
        );

        const normalizedRestored = normalizeDaysData(snapshot.daysData);
        const restoredTemplate =
          snapshot.workbookTemplateBase64 !== undefined
            ? snapshot.workbookTemplateBase64
            : workbookTemplateBase64;
        const updatedSnapshots = [safetyBackup, ...pruneOlderThanSevenDays(importSnapshots)];
        const updatedLogs = [restoreLog, ...activityLogs];

        setSheetData(normalizedRestored);
        if (snapshot.headerMetadata) setHeaderMetadata(snapshot.headerMetadata);
        setCurrentWorkbookName(restoredSheetTitle);
        setWorkbookTemplateBase64(restoredTemplate);
        setImportSnapshots(updatedSnapshots);
        setActivityLogs(pruneOlderThanSevenDays(updatedLogs));
        initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(normalizedRestored));

        persistState({
          daysData: normalizedRestored,
          headerMetadata: snapshot.headerMetadata || headerMetadata,
          currentWorkbookName: restoredSheetTitle,
          workbookTemplateBase64: restoredTemplate,
          activityLogs: updatedLogs,
          importSnapshots: updatedSnapshots
        });
        setIsLogModalOpen(false);
      };

      // =======================================================================
      // NATIVE EXCELJS EXPORT (PRESERVES ALL ORIGINAL BORDERS, COLORS & LAYOUT)
      // =======================================================================
      const handleExportExcel = async () => {
        if (!workbookTemplateBase64) {
          setIsNoTemplateAlertOpen(true);
          return;
        }

        try {
          const arrayBuffer = base64ToArrayBuffer(workbookTemplateBase64);
          const workbook = new ExcelJS.Workbook();
          await workbook.xlsx.load(arrayBuffer);

          DAYS.forEach((day) => {
            let worksheet = null;
            workbook.eachSheet((ws) => {
              if (!worksheet && ws.name.toLowerCase().includes(day.toLowerCase())) {
                worksheet = ws;
              }
            });
            if (!worksheet) return;

            const rowsList = (sheetData[day] || []).filter(isRowValid);

            const templateColStyles = {};
            const gridStyleByCode = {};
            const templateRow4 = worksheet.getRow(4);
            const templateRowHeight = templateRow4 && templateRow4.height ? templateRow4.height : undefined;

            const scanLimit = Math.max(worksheet.rowCount, 12);
            for (let r = 4; r <= scanLimit; r++) {
              const scanRow = worksheet.getRow(r);
              const gridCode = getExcelCellText(scanRow.getCell(6)).toUpperCase();

              for (let c = 1; c <= 11; c++) {
                const cell = scanRow.getCell(c);
                if (cell && cell.style && Object.keys(cell.style).length > 0) {
                  if (!templateColStyles[c]) {
                    templateColStyles[c] = cloneExcelStyle(cell.style);
                  }
                  if (c === 6 && gridCode && !gridStyleByCode[gridCode]) {
                    gridStyleByCode[gridCode] = cloneExcelStyle(cell.style);
                  }
                }
              }
            }

            if (notification && notification.trim() !== "") {
              const bannerCell = worksheet.getRow(1).getCell(10);
              if (bannerCell) {
                bannerCell.value = notification;
              }
            }

            rowsList.forEach((rowObj, idx) => {
              const targetRowNum = 4 + idx;
              const row = worksheet.getRow(targetRowNum);
              if (templateRowHeight) {
                row.height = templateRowHeight;
              }

              const unitsVal =
                rowObj.units !== "" && !isNaN(Number(rowObj.units))
                  ? Number(rowObj.units)
                  : rowObj.units || "";

              const values = [
                idx + 1,
                rowObj.customer || "",
                unitsVal,
                (rowObj.type || "").toUpperCase(),
                rowObj.bookingNo || "",
                (rowObj.exGrid || "").toUpperCase(),
                (rowObj.ctnReleased || "").toUpperCase(),
                (rowObj.truckId || "").toUpperCase(),
                rowObj.time || "",
                rowObj.doors || "Forward",
                rowObj.comment || ""
              ];

              for (let c = 1; c <= 11; c++) {
                const cell = row.getCell(c);
                const existingStyle =
                  cell.style && Object.keys(cell.style).length > 0
                    ? cloneExcelStyle(cell.style)
                    : cloneExcelStyle(templateColStyles[c]);

                cell.value = values[c - 1];

                if (c === 6) {
                  const gridUpper = (rowObj.exGrid || "").trim().toUpperCase();
                  if (gridStyleByCode[gridUpper]) {
                    cell.style = cloneExcelStyle(gridStyleByCode[gridUpper]);
                  } else {
                    if (existingStyle && Object.keys(existingStyle).length > 0) {
                      cell.style = existingStyle;
                    }
                    if (EXCEL_GRID_ARGB_FALLBACK[gridUpper]) {
                      cell.fill = {
                        type: "pattern",
                        pattern: "solid",
                        fgColor: { argb: EXCEL_GRID_ARGB_FALLBACK[gridUpper] }
                      };
                    }
                  }
                } else if (existingStyle && Object.keys(existingStyle).length > 0) {
                  cell.style = existingStyle;
                }
              }

              row.commit();
            });

            const oldLastRow = worksheet.rowCount;
            const newLastRow = 3 + rowsList.length;
            for (let r = newLastRow + 1; r <= oldLastRow; r++) {
              const extraRow = worksheet.getRow(r);
              for (let c = 1; c <= 11; c++) {
                extraRow.getCell(c).value = null;
              }
              extraRow.commit();
            }
          });

          const outBuffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([outBuffer], {
            type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          const baseName = currentWorkbookName
            ? currentWorkbookName.replace(/\.xlsx?$/i, "")
            : "Mty_Container_Release_Sheet";
          link.href = url;
          link.download = `${baseName}_Updated_${new Date().toISOString().slice(0, 10)}.xlsx`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error("ExcelJS export error:", err);
          alert("There was an issue exporting the workbook. Please try re-importing your master .xlsx file first.");
        }
      };

      const openCommentModal = (index, text) => {
        const targetRow = (sheetData[activeDay] || [])[index];
        const lockStatus = getRowLockStatus(activeDay, targetRow, index);
        if (lockStatus.isLockedByOther) return;
        if (targetRow) {
          handleRowFocus(activeDay, targetRow, index);
          touchRowActivityLock(activeDay, targetRow, index);
        }
        setCommentModal({ isOpen: true, rowIndex: index, text: text || "" });
      };

      const saveCommentModal = () => {
        if (commentModal.rowIndex !== null) {
          const targetRow = (sheetData[activeDay] || [])[commentModal.rowIndex];
          if (targetRow) {
            touchRowActivityLock(activeDay, targetRow, commentModal.rowIndex);
          }
          handleCellBlur(commentModal.rowIndex, "comment", commentModal.text);
        }
        setCommentModal({ isOpen: false, rowIndex: null, text: "" });
      };

      const renderSyncBadge = () => {
        if (syncStatus === "connected") {
          return (
            <span className="inline-flex items-center gap-1.5 text-xs text-emerald-400">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              Cloud Synced
            </span>
          );
        }
        if (syncStatus === "connecting") {
          return (
            <span className="inline-flex items-center gap-1.5 text-xs text-amber-400">
              <span className="w-2 h-2 rounded-full bg-amber-400"></span>
              Connecting...
            </span>
          );
        }
        if (syncStatus === "error") {
          return (
            <span className="inline-flex items-center gap-1.5 text-xs text-rose-400">
              <span className="w-2 h-2 rounded-full bg-rose-400"></span>
              Sync Error (Local Cache Active)
            </span>
          );
        }
        return (
          <span className="inline-flex items-center gap-1.5 text-xs text-amber-300">
            <span className="w-2 h-2 rounded-full bg-amber-400"></span>
            Local Cache Only
          </span>
        );
      };

      // =======================================================================
      // SCREEN 1: FORCED PERSONALIZED PIN SETUP SCREEN (FIRST LOGIN / RESET)
      // =======================================================================
      if (pendingPinSetupUser) {
        return (
          <div className="min-h-screen bg-gray-950 flex items-center justify-center p-4">
            <div className="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-md shadow-2xl">
              <div className="mb-6">
                <span className="inline-block px-2.5 py-1 rounded text-xs font-semibold bg-amber-950 text-amber-300 border border-amber-800/60 mb-3">
                  First-Time / Reset Security Setup
                </span>
                <h1 className="text-2xl font-bold text-white">Create Your Personal PIN</h1>
                <p className="text-sm text-gray-400 mt-1">
                  Welcome <span className="text-emerald-400 font-semibold">{pendingPinSetupUser.username}</span>. The default PIN (<code className="text-gray-300">1111</code>) can only be used once. Choose a private 4-digit PIN to continue.
                </p>
              </div>

              <form onSubmit={handleCompletePinSetup} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">
                    New 4-Digit Personal PIN
                  </label>
                  <input
                    type="password"
                    inputMode="numeric"
                    maxLength={4}
                    value={newPersonalPin}
                    onChange={(e) => setNewPersonalPin(e.target.value.replace(/[^0-9]/g, ""))}
                    placeholder="••••"
                    className="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 rounded-lg px-4 py-3 text-center text-2xl tracking-[0.6em] font-mono text-white focus:outline-none"
                    autoFocus
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">
                    Confirm 4-Digit Personal PIN
                  </label>
                  <input
                    type="password"
                    inputMode="numeric"
                    maxLength={4}
                    value={confirmPersonalPin}
                    onChange={(e) => setConfirmPersonalPin(e.target.value.replace(/[^0-9]/g, ""))}
                    placeholder="••••"
                    className="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 rounded-lg px-4 py-3 text-center text-2xl tracking-[0.6em] font-mono text-white focus:outline-none"
                  />
                </div>

                {pinSetupError && (
                  <div className="bg-rose-950/60 border border-rose-800/70 text-rose-300 text-xs rounded-lg px-3.5 py-2.5">
                    {pinSetupError}
                  </div>
                )}

                <div className="pt-2 flex items-center gap-3">
                  <button
                    type="button"
                    onClick={handleLogout}
                    className="w-1/3 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-medium rounded-lg transition"
                  >
                    Back
                  </button>
                  <button
                    type="submit"
                    className="w-2/3 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-lg transition shadow-lg shadow-emerald-900/30"
                  >
                    Save PIN & Enter Sheet
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // =======================================================================
      // SCREEN 2: LOGIN GATE SCREEN
      // =======================================================================
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-gray-950 flex items-center justify-center p-4">
            <div className="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-md shadow-2xl">
              <div className="flex items-center justify-between mb-6">
                <div>
                  <h1 className="text-xl font-bold text-white flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
                    Container Release Sheet
                  </h1>
                  <p className="text-xs text-gray-400 mt-1">Sign in with your username & 4-digit PIN</p>
                </div>
                {renderSyncBadge()}
              </div>

              <form onSubmit={handleLoginSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">
                    Username
                  </label>
                  <input
                    type="text"
                    value={loginUsername}
                    onChange={(e) => setLoginUsername(e.target.value)}
                    placeholder="Enter your name"
                    className="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none"
                    autoFocus
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">
                    4-Digit PIN
                  </label>
                  <input
                    type="password"
                    inputMode="numeric"
                    maxLength={4}
