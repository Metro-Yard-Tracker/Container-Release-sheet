<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Container Release Sheet & Yard Grid Planner</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- SheetJS (XLSX) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1f2937;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // REPLACE WITH YOUR ACTUAL FIREBASE PROJECT CREDENTIALS
    // =========================================================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const isFirebaseConfigured =
      firebaseConfig.apiKey &&
      !firebaseConfig.apiKey.includes("YOUR_API_KEY") &&
      firebaseConfig.databaseURL &&
      !firebaseConfig.databaseURL.includes("YOUR_PROJECT");

    let db = null;
    if (isFirebaseConfigured) {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    }

    const DAYS = [
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
      "Sunday"
    ];

    const DOOR_OPTIONS = ["Forward", "Rear", "Passengers", "Drivers"];
    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
    const LOCAL_STORAGE_KEY = "container_release_sheet_cache_v2";
    const SESSION_STORAGE_KEY = "container_release_active_user_v1";
    const DEFAULT_PIN = "1111";

    // Default initial Admin account
    const INITIAL_USERS = [
      {
        id: "admin-gareth",
        username: "Gareth",
        role: "Admin",
        pin: DEFAULT_PIN,
        mustChangePin: true,
        createdAt: Date.now()
      }
    ];

    // AV Grid Color Palette
    const GRID_COLOR_MAP = {
      "AV1": "bg-blue-950/80 text-blue-300 border-blue-700/60",
      "AV2": "bg-purple-950/80 text-purple-300 border-purple-700/60",
      "AV3": "bg-amber-950/80 text-amber-300 border-amber-700/60",
      "AV4": "bg-emerald-950/80 text-emerald-300 border-emerald-700/60",
      "AV5": "bg-rose-950/80 text-rose-300 border-rose-700/60"
    };

    const DEFAULT_GRID_STYLE = "bg-gray-800 text-gray-300 border-gray-700";

    const DEFAULT_HEADER_BLOCK = [
      ["00:01 TO 23:59", "Empty Container Release", "", "", "", "", "", "NO Longer Valid", "", "GXT/SH Wont be added to release sheet Domestic should Email to Release Mtys", ""],
      ["", "", "", "", "", "", "", "", "", "", ""],
      ["", "Customer", "# Units", "Type", "Booking #", "Ex Grid", "Ctn # Released", "Truck id", "Time", "Doors", "Comment/Special Instructions"]
    ];

    const FIELD_LABELS = {
      customer: "Customer",
      units: "# Units",
      type: "Type",
      bookingNo: "Booking #",
      exGrid: "Ex Grid",
      ctnReleased: "Ctn # Released",
      truckId: "Truck ID",
      time: "Time",
      doors: "Doors",
      comment: "Comment"
    };

    const createEmptyDaysObject = () => ({
      Monday: [],
      Tuesday: [],
      Wednesday: [],
      Thursday: [],
      Friday: [],
      Saturday: [],
      Sunday: []
    });

    const normalizeDaysData = (rawDays) => {
      const normalized = createEmptyDaysObject();
      if (!rawDays) return normalized;
      DAYS.forEach((day) => {
        if (Array.isArray(rawDays[day])) {
          normalized[day] = rawDays[day];
        } else if (rawDays[day] && typeof rawDays[day] === "object") {
          normalized[day] = Object.values(rawDays[day]);
        }
      });
      return normalized;
    };

    function App() {
      const [activeDay, setActiveDay] = useState("Monday");
      const [syncStatus, setSyncStatus] = useState(
        isFirebaseConfigured ? "connecting" : "unconfigured"
      );

      // Users & Auth State
      const [users, setUsers] = useState(() => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed.users) && parsed.users.length > 0) {
              return parsed.users;
            }
          }
        } catch (e) {}
        return INITIAL_USERS;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const savedSession = sessionStorage.getItem(SESSION_STORAGE_KEY);
          if (savedSession) return JSON.parse(savedSession);
        } catch (e) {}
        return null;
      });

      // Login Screen Inputs
      const [loginUsername, setLoginUsername] = useState("");
      const [loginPin, setLoginPin] = useState("");
      const [loginError, setLoginError] = useState("");

      // Forced Personalized PIN Setup State (when logging in with 1111)
      const [pendingPinSetupUser, setPendingPinSetupUser] = useState(null);
      const [newPersonalPin, setNewPersonalPin] = useState("");
      const [confirmPersonalPin, setConfirmPersonalPin] = useState("");
      const [pinSetupError, setPinSetupError] = useState("");

      // Admin User Management Modal State
      const [isUserModalOpen, setIsUserModalOpen] = useState(false);
      const [newUserNameInput, setNewUserNameInput] = useState("");
      const [newUserRoleInput, setNewUserRoleInput] = useState("General User");
      const [userMgmtMessage, setUserMgmtMessage] = useState({ type: "", text: "" });

      // Sheet Data State
      const [sheetData, setSheetData] = useState(() => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed.daysData) return normalizeDaysData(parsed.daysData);
          }
        } catch (e) {}
        return createEmptyDaysObject();
      });

      const [headerMetadata, setHeaderMetadata] = useState(() => {
        try {
          const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed.headerMetadata) return parsed.headerMetadata;
          }
        } catch (e) {}
        return {
          Monday: DEFAULT_HEADER_BLOCK,
          Tuesday: DEFAULT_HEADER_BLOCK,
          Wednesday: DEFAULT_HEADER_BLOCK,
          Thursday: DEFAULT_HEADER_BLOCK,
          Friday: DEFAULT_HEADER_BLOCK,
          Saturday: DEFAULT_HEADER_BLOCK,
          Sunday: DEFAULT_HEADER_BLOCK
        };
      });

      const [notification, setNotification] = useState("");
      const [isEditingNotice, setIsEditingNotice] = useState(false);
      const [tempNotice, setTempNotice] = useState("");
      const [draggedRowIndex, setDraggedRowIndex] = useState(null);
      const [dragOverRowIndex, setDragOverRowIndex] = useState(null);
      const [commentModal, setCommentModal] = useState({ isOpen: false, rowIndex: null, text: "" });
      
      // 7-Day Rolling Log & Snapshot State
      const [activityLogs, setActivityLogs] = useState([]);
      const [importSnapshots, setImportSnapshots] = useState([]);
      const [isLogModalOpen, setIsLogModalOpen] = useState(false);
      const [logModalTab, setLogModalTab] = useState("edits");
      const [logSearchQuery, setLogSearchQuery] = useState("");
      
      const initialLoadSnapshotRef = useRef({});
      const fileInputRef = useRef(null);

      const pruneOlderThanSevenDays = (items) => {
        if (!Array.isArray(items)) return [];
        const cutoff = Date.now() - SEVEN_DAYS_MS;
        return items.filter((item) => item && item.timestamp && item.timestamp >= cutoff);
      };

      // Save to both localStorage and Firebase Realtime Database
      const persistState = (overrides = {}) => {
        const prunedLogs = pruneOlderThanSevenDays(
          overrides.activityLogs !== undefined ? overrides.activityLogs : activityLogs
        );
        const prunedSnapshots = pruneOlderThanSevenDays(
          overrides.importSnapshots !== undefined ? overrides.importSnapshots : importSnapshots
        );

        const nextDaysData = normalizeDaysData(
          overrides.daysData !== undefined ? overrides.daysData : sheetData
        );
        const nextHeaders =
          overrides.headerMetadata !== undefined ? overrides.headerMetadata : headerMetadata;
        const nextNotice =
          overrides.notification !== undefined ? overrides.notification : notification;
        const nextUsers =
          overrides.users !== undefined ? overrides.users : users;

        const payload = {
          daysData: nextDaysData,
          headerMetadata: nextHeaders,
          notification: nextNotice,
          users: nextUsers,
          activityLogs: prunedLogs,
          importSnapshots: prunedSnapshots,
          lastUpdated: new Date().toISOString()
        };

        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(payload));
        } catch (err) {
          console.warn("Local cache save skipped:", err);
        }

        if (db) {
          db.ref("container_release")
            .set(payload)
            .then(() => setSyncStatus("connected"))
            .catch((err) => {
              console.error("Firebase write error:", err);
              setSyncStatus("error");
            });
        }
      };

      // Realtime Database Listener
      useEffect(() => {
        if (!db) return;

        const connectedRef = db.ref(".info/connected");
        connectedRef.on("value", (snap) => {
          if (snap.val() === true) {
            setSyncStatus("connected");
          } else {
            setSyncStatus("connecting");
          }
        });

        const releaseRef = db.ref("container_release");
        releaseRef.on(
          "value",
          (snapshot) => {
            const val = snapshot.val();
            setSyncStatus("connected");
            if (val) {
              if (val.daysData) {
                const normalized = normalizeDaysData(val.daysData);
                setSheetData(normalized);
                initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(normalized));
              }
              if (val.headerMetadata) setHeaderMetadata(val.headerMetadata);
              if (val.notification !== undefined) setNotification(val.notification);
              if (Array.isArray(val.users) && val.users.length > 0) {
                setUsers(val.users);
              }
              if (val.activityLogs) setActivityLogs(pruneOlderThanSevenDays(val.activityLogs));
              if (val.importSnapshots) setImportSnapshots(pruneOlderThanSevenDays(val.importSnapshots));

              try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(val));
              } catch (e) {}
            } else {
              // Seed initial Admin user in Firebase if empty
              persistState({ users: INITIAL_USERS });
            }
          },
          (error) => {
            console.error("Firebase read error:", error);
            setSyncStatus("error");
          }
        );

        return () => {
          connectedRef.off();
          releaseRef.off();
        };
      }, []);

      // Keep active session synced with user list (e.g. if deleted or role changed)
      useEffect(() => {
        if (!currentUser) return;
        const freshUser = users.find((u) => u.id === currentUser.id);
        if (!freshUser) {
          handleLogout();
        } else if (freshUser.mustChangePin || freshUser.pin === DEFAULT_PIN) {
          setPendingPinSetupUser(freshUser);
          setCurrentUser(null);
          sessionStorage.removeItem(SESSION_STORAGE_KEY);
        } else if (freshUser.role !== currentUser.role || freshUser.username !== currentUser.username) {
          const safeSession = { id: freshUser.id, username: freshUser.username, role: freshUser.role };
          setCurrentUser(safeSession);
          sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(safeSession));
        }
      }, [users]);

      // --- AUTHENTICATION HANDLERS ---
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError("");

        const trimmedName = loginUsername.trim();
        if (!trimmedName) {
          setLoginError("Please enter your username.");
          return;
        }
        if (!/^\d{4}$/.test(loginPin)) {
          setLoginError("Please enter a valid 4-digit PIN.");
          return;
        }

        const matchedUser = users.find(
          (u) => u.username.toLowerCase() === trimmedName.toLowerCase()
        );

        if (!matchedUser || matchedUser.pin !== loginPin) {
          setLoginError("Invalid username or PIN.");
          return;
        }

        // Force personalized PIN setup if using default 1111 PIN
        if (matchedUser.pin === DEFAULT_PIN || matchedUser.mustChangePin) {
          setPendingPinSetupUser(matchedUser);
          setNewPersonalPin("");
          setConfirmPersonalPin("");
          setPinSetupError("");
          setLoginPin("");
          return;
        }

        const safeSession = {
          id: matchedUser.id,
          username: matchedUser.username,
          role: matchedUser.role
        };
        setCurrentUser(safeSession);
        sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(safeSession));
        setLoginUsername("");
        setLoginPin("");
      };

      const handleCompletePinSetup = (e) => {
        e.preventDefault();
        setPinSetupError("");

        if (!/^\d{4}$/.test(newPersonalPin)) {
          setPinSetupError("Your new PIN must be exactly 4 digits.");
          return;
        }
        if (newPersonalPin === DEFAULT_PIN) {
          setPinSetupError("You cannot use the default PIN (1111). Choose a personal 4-digit PIN.");
          return;
        }
        if (newPersonalPin !== confirmPersonalPin) {
          setPinSetupError("PINs do not match. Please re-enter.");
          return;
        }

        const updatedUsers = users.map((u) =>
          u.id === pendingPinSetupUser.id
            ? { ...u, pin: newPersonalPin, mustChangePin: false }
            : u
        );

        const safeSession = {
          id: pendingPinSetupUser.id,
          username: pendingPinSetupUser.username,
          role: pendingPinSetupUser.role
        };

        setUsers(updatedUsers);
        setCurrentUser(safeSession);
        sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(safeSession));
        setPendingPinSetupUser(null);
        setNewPersonalPin("");
        setConfirmPersonalPin("");

        persistState({ users: updatedUsers });
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setPendingPinSetupUser(null);
        sessionStorage.removeItem(SESSION_STORAGE_KEY);
      };

      // --- ADMIN USER MANAGEMENT HANDLERS ---
      const handleAddUser = (e) => {
        e.preventDefault();
        setUserMgmtMessage({ type: "", text: "" });

        const cleanName = newUserNameInput.trim();
        if (!cleanName) {
          setUserMgmtMessage({ type: "error", text: "Username cannot be empty." });
          return;
        }

        // Case-insensitive duplicate check
        const duplicateExists = users.some(
          (u) => u.username.toLowerCase() === cleanName.toLowerCase()
        );
        if (duplicateExists) {
          setUserMgmtMessage({
            type: "error",
            text: `Username "${cleanName}" already exists. Choose a different name.`
          });
          return;
        }

        const newUser = {
          id: `user-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
          username: cleanName,
          role: newUserRoleInput,
          pin: DEFAULT_PIN,
          mustChangePin: true,
          createdAt: Date.now()
        };

        const updatedUsers = [...users, newUser];
        const logEntry = createLogEntry(
          "System",
          "-",
          "User Created",
          `Added ${newUserRoleInput} user "${cleanName}" (Default PIN assigned)`
        );
        const updatedLogs = [logEntry, ...pruneOlderThanSevenDays(activityLogs)];

        setUsers(updatedUsers);
        setActivityLogs(updatedLogs);
        setNewUserNameInput("");
        setNewUserRoleInput("General User");
        setUserMgmtMessage({
          type: "success",
          text: `User "${cleanName}" added with default PIN (1111). They will be prompted to set a personal PIN on first login.`
        });

        persistState({ users: updatedUsers, activityLogs: updatedLogs });
      };

      const handleResetUserPin = (targetUser) => {
        const updatedUsers = users.map((u) =>
          u.id === targetUser.id ? { ...u, pin: DEFAULT_PIN, mustChangePin: true } : u
        );

        const logEntry = createLogEntry(
          "System",
          "-",
          "PIN Reset",
          `Reset PIN to default (1111) for user "${targetUser.username}"`
        );
        const updatedLogs = [logEntry, ...pruneOlderThanSevenDays(activityLogs)];

        setUsers(updatedUsers);
        setActivityLogs(updatedLogs);
        setUserMgmtMessage({
          type: "success",
          text: `PIN for "${targetUser.username}" reset to default (1111).`
        });

        persistState({ users: updatedUsers, activityLogs: updatedLogs });
      };

      const handleRemoveUser = (targetUser) => {
        if (targetUser.id === currentUser.id) {
          setUserMgmtMessage({
            type: "error",
            text: "You cannot delete your own active Admin account."
          });
          return;
        }

        const adminCount = users.filter((u) => u.role === "Admin").length;
        if (targetUser.role === "Admin" && adminCount <= 1) {
          setUserMgmtMessage({
            type: "error",
            text: "Cannot remove the last remaining Admin user."
          });
          return;
        }

        const updatedUsers = users.filter((u) => u.id !== targetUser.id);
        const logEntry = createLogEntry(
          "System",
          "-",
          "User Removed",
          `Removed user "${targetUser.username}"`
        );
        const updatedLogs = [logEntry, ...pruneOlderThanSevenDays(activityLogs)];

        setUsers(updatedUsers);
        setActivityLogs(updatedLogs);
        setUserMgmtMessage({
          type: "success",
          text: `User "${targetUser.username}" removed.`
        });

        persistState({ users: updatedUsers, activityLogs: updatedLogs });
      };

      // --- LOGGING & TABLE HANDLERS ---
      const formatLogTimestamp = (ms) => {
        const d = new Date(ms);
        const day = String(d.getDate()).padStart(2, "0");
        const month = d.toLocaleString("en-NZ", { month: "short" });
        const hrs = String(d.getHours()).padStart(2, "0");
        const mins = String(d.getMinutes()).padStart(2, "0");
        return `${day} ${month} ${hrs}${mins}`;
      };

      const createLogEntry = (day, lineNo, action, details, meta = {}) => {
        const now = Date.now();
        return {
          id: `${now}-${Math.random().toString(36).substr(2, 5)}`,
          timestamp: now,
          formattedTime: formatLogTimestamp(now),
          day,
          lineNo,
          username: currentUser ? currentUser.username : "Unknown",
          role: currentUser ? currentUser.role : "General User",
          action,
          details,
          customer: meta.customer || "",
          bookingNo: meta.bookingNo || "",
          ctnReleased: meta.ctnReleased || "",
          truckId: meta.truckId || ""
        };
      };

      const getCurrent24HrTime = () => {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        return `${hours}${minutes}`;
      };

      const format24HrTime = (val) => {
        if (!val) return "";
        let cleaned = val.toString().replace(/[^0-9]/g, "");
        if (cleaned.length > 4) cleaned = cleaned.substring(0, 4);
        return cleaned;
      };

      const isRowValid = (row) => {
        if (!row) return false;
        return (
          (row.customer && row.customer.toString().trim() !== "") ||
          (row.bookingNo && row.bookingNo.toString().trim() !== "") ||
          (row.type && row.type.toString().trim() !== "") ||
          (row.exGrid && row.exGrid.toString().trim() !== "") ||
          (row.ctnReleased && row.ctnReleased.toString().trim() !== "") ||
          (row.truckId && row.truckId.toString().trim() !== "") ||
          (row.comment && row.comment.toString().trim() !== "")
        );
      };

      const handleCellChange = (rowIndex, field, value) => {
        const updatedDayData = [...(sheetData[activeDay] || [])];
        if (!updatedDayData[rowIndex]) return;

        let autoTime = updatedDayData[rowIndex].time;

        if (field === "ctnReleased" && value.trim() !== "" && (!autoTime || autoTime.trim() === "")) {
          autoTime = getCurrent24HrTime();
        }

        updatedDayData[rowIndex] = {
          ...updatedDayData[rowIndex],
          [field]: value,
          time: autoTime
        };

        const newSheetData = {
          ...sheetData,
          [activeDay]: updatedDayData
        };
        setSheetData(newSheetData);
      };

      const handleCellBlur = (rowIndex, field, value) => {
        let finalValue = value;
        if (field === "time") {
          finalValue = format24HrTime(value);
        }

        const updatedDayData = [...(sheetData[activeDay] || [])];
        if (!updatedDayData[rowIndex]) return;

        const targetRow = updatedDayData[rowIndex];
        const prevRowSnapshot = (initialLoadSnapshotRef.current[activeDay] || [])[rowIndex] || {};
        const oldVal = (prevRowSnapshot[field] || "").toString().trim();
        const newVal = (finalValue || "").toString().trim();

        updatedDayData[rowIndex] = {
          ...targetRow,
          [field]: finalValue
        };

        const newSheetData = {
          ...sheetData,
          [activeDay]: updatedDayData
        };
        setSheetData(newSheetData);

        let updatedLogs = activityLogs;
        if (oldVal !== newVal) {
          const label = FIELD_LABELS[field] || field;
          const summary = `${label}: "${oldVal || "Empty"}" → "${newVal || "Cleared"}"`;
          const logItem = createLogEntry(activeDay, rowIndex + 1, "Field Updated", summary, updatedDayData[rowIndex]);
          updatedLogs = [logItem, ...pruneOlderThanSevenDays(activityLogs)];
          setActivityLogs(updatedLogs);
          initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(newSheetData));
        }

        persistState({
          daysData: newSheetData,
          activityLogs: updatedLogs
        });
      };

      const isAdmin = currentUser && currentUser.role === "Admin";

      const handleAddRow = () => {
        const currentList = sheetData[activeDay] || [];
        const newRow = {
          lineNo: currentList.length + 1,
          customer: "",
          units: "1",
          type: "",
          bookingNo: "",
          exGrid: "AV1",
          ctnReleased: "",
          truckId: "",
          time: "",
          doors: "Forward",
          comment: "",
          isNew: true
        };
        const updatedList = [...currentList, newRow];
        const newSheetData = { ...sheetData, [activeDay]: updatedList };
        const logItem = createLogEntry(activeDay, updatedList.length, "Line Added", "Added new schedule row");
        const updatedLogs = [logItem, ...pruneOlderThanSevenDays(activityLogs)];

        setSheetData(newSheetData);
        setActivityLogs(updatedLogs);
        initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(newSheetData));
        persistState({ daysData: newSheetData, activityLogs: updatedLogs });
      };

      const handleRemoveRow = (index) => {
        const currentList = sheetData[activeDay] || [];
        const removedRow = currentList[index] || {};
        const updatedList = currentList.filter((_, idx) => idx !== index).map((row, idx) => ({
          ...row,
          lineNo: idx + 1
        }));
        const newSheetData = { ...sheetData, [activeDay]: updatedList };
        const detail = `Removed line (${removedRow.customer || "No Customer"} | Booking: ${removedRow.bookingNo || "N/A"})`;
        const logItem = createLogEntry(activeDay, index + 1, "Line Removed", detail, removedRow);
        const updatedLogs = [logItem, ...pruneOlderThanSevenDays(activityLogs)];

        setSheetData(newSheetData);
        setActivityLogs(updatedLogs);
        initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(newSheetData));
        persistState({ daysData: newSheetData, activityLogs: updatedLogs });
      };

      const handleDragStart = (e, index) => {
        if (!isAdmin) return;
        setDraggedRowIndex(index);
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDragOver = (e, index) => {
        if (!isAdmin) return;
        e.preventDefault();
        if (draggedRowIndex === null) return;
        setDragOverRowIndex(index);
      };

      const handleDrop = (e, index) => {
        if (!isAdmin) return;
        e.preventDefault();
        if (draggedRowIndex === null || draggedRowIndex === index) {
          setDraggedRowIndex(null);
          setDragOverRowIndex(null);
          return;
        }
        const currentList = [...(sheetData[activeDay] || [])];
        const draggedItem = currentList[draggedRowIndex];
        currentList.splice(draggedRowIndex, 1);
        currentList.splice(index, 0, draggedItem);

        const reindexed = currentList.map((item, idx) => ({ ...item, lineNo: idx + 1 }));
        const newSheetData = { ...sheetData, [activeDay]: reindexed };
        const logItem = createLogEntry(
          activeDay,
          index + 1,
          "Line Reordered",
          `Moved line #${draggedRowIndex + 1} to #${index + 1} (${draggedItem.customer || "Row"})`,
          draggedItem
        );
        const updatedLogs = [logItem, ...pruneOlderThanSevenDays(activityLogs)];

        setSheetData(newSheetData);
        setActivityLogs(updatedLogs);
        initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(newSheetData));
        persistState({ daysData: newSheetData, activityLogs: updatedLogs });
        setDraggedRowIndex(null);
        setDragOverRowIndex(null);
      };

      const handleImportExcel = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileName = file.name;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: "array" });

          const hasExistingRows = DAYS.some((d) => (sheetData[d] || []).filter(isRowValid).length > 0);
          let updatedSnapshots = pruneOlderThanSevenDays(importSnapshots);

          if (hasExistingRows) {
            const totalActiveRows = DAYS.reduce((acc, d) => acc + (sheetData[d] || []).filter(isRowValid).length, 0);
            const now = Date.now();
            const backupSnapshot = {
              id: `snap-${now}`,
              timestamp: now,
              formattedTime: formatLogTimestamp(now),
              label: `Auto-Backup before importing "${fileName}"`,
              rowCount: totalActiveRows,
              daysData: JSON.parse(JSON.stringify(sheetData)),
              headerMetadata: JSON.parse(JSON.stringify(headerMetadata))
            };
            updatedSnapshots = [backupSnapshot, ...updatedSnapshots];
          }

          const newSheetData = createEmptyDaysObject();
          const newHeaderMeta = { ...headerMetadata };
          let importedCount = 0;

          workbook.SheetNames.forEach((sheetName) => {
            const matchedDay = DAYS.find((d) => sheetName.toLowerCase().includes(d.toLowerCase()));
            if (matchedDay) {
              const worksheet = workbook.Sheets[sheetName];
              const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

              const headers = rawRows.slice(0, 3);
              if (headers.length > 0) {
                newHeaderMeta[matchedDay] = headers;
              }

              const dataRows = rawRows.slice(3);
              const parsedRows = dataRows
                .map((r, idx) => ({
                  lineNo: idx + 1,
                  customer: r[1] !== undefined ? String(r[1]).trim() : "",
                  units: r[2] !== undefined ? String(r[2]).trim() : "1",
                  type: r[3] !== undefined ? String(r[3]).trim() : "",
                  bookingNo: r[4] !== undefined ? String(r[4]).trim() : "",
                  exGrid: r[5] !== undefined ? String(r[5]).trim().toUpperCase() : "",
                  ctnReleased: r[6] !== undefined ? String(r[6]).trim() : "",
                  truckId: r[7] !== undefined ? String(r[7]).trim() : "",
                  time: format24HrTime(r[8] || ""),
                  doors: r[9] !== undefined ? String(r[9]).trim() : "Forward",
                  comment: r[10] !== undefined ? String(r[10]).trim() : ""
                }))
                .filter(isRowValid);

              importedCount += parsedRows.length;
              newSheetData[matchedDay] = parsedRows;
            }
          });

          const importLog = createLogEntry(
            "All Days",
            "-",
            "Excel Imported",
            `Imported "${fileName}" (${importedCount} active lines across week)`
          );
          const updatedLogs = [importLog, ...pruneOlderThanSevenDays(activityLogs)];

          setSheetData(newSheetData);
          setHeaderMetadata(newHeaderMeta);
          setImportSnapshots(updatedSnapshots);
          setActivityLogs(updatedLogs);
          initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(newSheetData));

          persistState({
            daysData: newSheetData,
            headerMetadata: newHeaderMeta,
            activityLogs: updatedLogs,
            importSnapshots: updatedSnapshots
          });

          e.target.value = "";
        };
        reader.readAsArrayBuffer(file);
      };

      const handleRestoreSnapshot = (snapshot) => {
        if (!snapshot || !snapshot.daysData) return;

        const now = Date.now();
        const currentTotal = DAYS.reduce((acc, d) => acc + (sheetData[d] || []).filter(isRowValid).length, 0);
        const safetyBackup = {
          id: `snap-${now}`,
          timestamp: now,
          formattedTime: formatLogTimestamp(now),
          label: `Auto-Backup before restoring snapshot from ${snapshot.formattedTime}`,
          rowCount: currentTotal,
          daysData: JSON.parse(JSON.stringify(sheetData)),
          headerMetadata: JSON.parse(JSON.stringify(headerMetadata))
        };

        const restoreLog = createLogEntry(
          "All Days",
          "-",
          "Snapshot Restored",
          `Restored weekly backup from ${snapshot.formattedTime} (${snapshot.rowCount} lines)`
        );

        const normalizedRestored = normalizeDaysData(snapshot.daysData);
        const updatedSnapshots = [safetyBackup, ...pruneOlderThanSevenDays(importSnapshots)];
        const updatedLogs = [restoreLog, ...pruneOlderThanSevenDays(activityLogs)];

        setSheetData(normalizedRestored);
        if (snapshot.headerMetadata) setHeaderMetadata(snapshot.headerMetadata);
        setImportSnapshots(updatedSnapshots);
        setActivityLogs(updatedLogs);
        initialLoadSnapshotRef.current = JSON.parse(JSON.stringify(normalizedRestored));

        persistState({
          daysData: normalizedRestored,
          headerMetadata: snapshot.headerMetadata || headerMetadata,
          activityLogs: updatedLogs,
          importSnapshots: updatedSnapshots
        });
        setIsLogModalOpen(false);
      };

      const handleExportExcel = () => {
        const wb = XLSX.utils.book_new();

        DAYS.forEach((day) => {
          const dayMeta = headerMetadata[day] || DEFAULT_HEADER_BLOCK;
          const rowsList = (sheetData[day] || []).filter(isRowValid);

          const sheetOutput = [
            ...dayMeta,
            ...rowsList.map((r, idx) => [
              idx + 1,
              r.customer,
              r.units,
              r.type,
              r.bookingNo,
              r.exGrid,
              r.ctnReleased,
              r.truckId,
              r.time,
              r.doors,
              r.comment
            ])
          ];

          const ws = XLSX.utils.aoa_to_sheet(sheetOutput);
          XLSX.utils.book_append_sheet(wb, ws, day);
        });

        XLSX.writeFile(wb, `Mty_Container_Release_Sheet_${new Date().toISOString().slice(0, 10)}.xlsx`);
      };

      const openCommentModal = (index, text) => {
        setCommentModal({ isOpen: true, rowIndex: index, text: text || "" });
      };

      const saveCommentModal = () => {
        if (commentModal.rowIndex !== null) {
          handleCellBlur(commentModal.rowIndex, "comment", commentModal.text);
        }
        setCommentModal({ isOpen: false, rowIndex: null, text: "" });
      };

      const renderSyncBadge = () => {
        if (syncStatus === "connected") {
          return (
            <span className="inline-flex items-center gap-1.5 text-xs text-emerald-400">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              Cloud Synced
            </span>
          );
        }
        if (syncStatus === "connecting") {
          return (
            <span className="inline-flex items-center gap-1.5 text-xs text-amber-400">
              <span className="w-2 h-2 rounded-full bg-amber-400"></span>
              Connecting...
            </span>
          );
        }
        if (syncStatus === "error") {
          return (
            <span className="inline-flex items-center gap-1.5 text-xs text-rose-400">
              <span className="w-2 h-2 rounded-full bg-rose-400"></span>
              Sync Error (Local Cache Active)
            </span>
          );
        }
        return (
          <span className="inline-flex items-center gap-1.5 text-xs text-amber-300">
            <span className="w-2 h-2 rounded-full bg-amber-400"></span>
            Local Cache Only
          </span>
        );
      };

      // =======================================================================
      // SCREEN 1: FORCED PERSONALIZED PIN SETUP SCREEN (FIRST LOGIN / RESET)
      // =======================================================================
      if (pendingPinSetupUser) {
        return (
          <div className="min-h-screen bg-gray-950 flex items-center justify-center p-4">
            <div className="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-md shadow-2xl">
              <div className="mb-6">
                <span className="inline-block px-2.5 py-1 rounded text-xs font-semibold bg-amber-950 text-amber-300 border border-amber-800/60 mb-3">
                  First-Time / Reset Security Setup
                </span>
                <h1 className="text-2xl font-bold text-white">Create Your Personal PIN</h1>
                <p className="text-sm text-gray-400 mt-1">
                  Welcome <span className="text-emerald-400 font-semibold">{pendingPinSetupUser.username}</span>. The default PIN (<code className="text-gray-300">1111</code>) can only be used once. Choose a private 4-digit PIN to continue.
                </p>
              </div>

              <form onSubmit={handleCompletePinSetup} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">
                    New 4-Digit Personal PIN
                  </label>
                  <input
                    type="password"
                    inputMode="numeric"
                    maxLength={4}
                    value={newPersonalPin}
                    onChange={(e) => setNewPersonalPin(e.target.value.replace(/[^0-9]/g, ""))}
                    placeholder="••••"
                    className="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 rounded-lg px-4 py-3 text-center text-2xl tracking-[0.6em] font-mono text-white focus:outline-none"
                    autoFocus
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">
                    Confirm 4-Digit Personal PIN
                  </label>
                  <input
                    type="password"
                    inputMode="numeric"
                    maxLength={4}
                    value={confirmPersonalPin}
                    onChange={(e) => setConfirmPersonalPin(e.target.value.replace(/[^0-9]/g, ""))}
                    placeholder="••••"
                    className="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 rounded-lg px-4 py-3 text-center text-2xl tracking-[0.6em] font-mono text-white focus:outline-none"
                  />
                </div>

                {pinSetupError && (
                  <div className="bg-rose-950/60 border border-rose-800/70 text-rose-300 text-xs rounded-lg px-3.5 py-2.5">
                    {pinSetupError}
                  </div>
                )}

                <div className="pt-2 flex items-center gap-3">
                  <button
                    type="button"
                    onClick={handleLogout}
                    className="w-1/3 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-medium rounded-lg transition"
                  >
                    Back
                  </button>
                  <button
                    type="submit"
                    className="w-2/3 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-lg transition shadow-lg shadow-emerald-900/30"
                  >
                    Save PIN & Enter Sheet
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // =======================================================================
      // SCREEN 2: LOGIN GATE SCREEN
      // =======================================================================
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-gray-950 flex items-center justify-center p-4">
            <div className="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-md shadow-2xl">
              <div className="flex items-center justify-between mb-6">
                <div>
                  <h1 className="text-xl font-bold text-white flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
                    Container Release Sheet
                  </h1>
                  <p className="text-xs text-gray-400 mt-1">Sign in with your username & 4-digit PIN</p>
                </div>
                {renderSyncBadge()}
              </div>

              <form onSubmit={handleLoginSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">
                    Username
                  </label>
                  <input
                    type="text"
                    value={loginUsername}
                    onChange={(e) => setLoginUsername(e.target.value)}
                    placeholder="Enter your name"
                    className="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none"
                    autoFocus
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">
                    4-Digit PIN
                  </label>
                  <input
                    type="password"
                    inputMode="numeric"
                    maxLength={4}
                    value={loginPin}
                    onChange={(e) => setLoginPin(e.target.value.replace(/[^0-9]/g, ""))}
                    placeholder="••••"
                    className="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 rounded-lg px-4 py-3 text-center text-2xl tracking-[0.6em] font-mono text-white focus:outline-none"
                  />
                </div>

                {loginError && (
                  <div className="bg-rose-950/60 border border-rose-800/70 text-rose-300 text-xs rounded-lg px-3.5 py-2.5">
                    {loginError}
                  </div>
                )}

                <button
                  type="submit"
                  className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-lg transition shadow-lg shadow-emerald-900/30 mt-2"
                >
                  Log In
                </button>
              </form>
            </div>
          </div>
        );
      }

      // =======================================================================
      // SCREEN 3: MAIN CONTAINER RELEASE WORKSPACE
      // =======================================================================
      const currentDayRows = (sheetData[activeDay] || []).filter((r) => isRowValid(r) || r.isNew);

      const filteredLogs = activityLogs.filter((log) => {
        if (!logSearchQuery.trim()) return true;
        const q = logSearchQuery.toLowerCase();
        return (
          (log.username && log.username.toLowerCase().includes(q)) ||
          (log.day && log.day.toLowerCase().includes(q)) ||
          (log.action && log.action.toLowerCase().includes(q)) ||
          (log.details && log.details.toLowerCase().includes(q)) ||
          (log.customer && log.customer.toLowerCase().includes(q)) ||
          (log.bookingNo && log.bookingNo.toLowerCase().includes(q)) ||
          (log.ctnReleased && log.ctnReleased.toLowerCase().includes(q)) ||
          (log.truckId && log.truckId.toLowerCase().includes(q)) ||
          (log.formattedTime && log.formattedTime.toLowerCase().includes(q))
        );
      });

      return (
        <div className="flex-1 flex flex-col">
          {/* Header Bar */}
          <header className="bg-gray-900 border-b border-gray-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                Container Release Sheet & Yard Grid Planner
              </h1>
              <div className="flex flex-wrap items-center gap-3 mt-1">
                {renderSyncBadge()}
                <span className="text-gray-600">|</span>
                <span className="text-xs text-gray-300">
                  Signed in as:{" "}
                  <span className="font-bold text-white">{currentUser.username}</span>{" "}
                  <span
                    className={`ml-1 px-2 py-0.5 rounded text-[10px] font-semibold uppercase ${
                      isAdmin
                        ? "bg-amber-950 text-amber-300 border border-amber-700/60"
                        : "bg-emerald-950 text-emerald-300 border border-emerald-700/60"
                    }`}
                  >
                    {currentUser.role}
                  </span>
                </span>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              {/* Admin Only: Manage Users Button */}
              {isAdmin && (
                <button
                  onClick={() => {
                    setUserMgmtMessage({ type: "", text: "" });
                    setIsUserModalOpen(true);
                  }}
                  className="px-3.5 py-2 bg-amber-950/60 hover:bg-amber-900/60 text-amber-200 text-sm font-medium rounded-lg border border-amber-700/60 transition flex items-center gap-2"
                >
                  <span>Manage Users ({users.length})</span>
                </button>
              )}

              {/* 7-Day Log & Archive Button */}
              <button
                onClick={() => setIsLogModalOpen(true)}
                className="px-3.5 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-medium rounded-lg border border-gray-700 transition flex items-center gap-2"
              >
                <span>7-Day Log</span>
                <span className="text-xs bg-gray-950 text-emerald-400 px-1.5 py-0.5 rounded border border-gray-800">
                  {activityLogs.length}
                </span>
              </button>

              {/* Import Button Available for ALL Users */}
              <input
                type="file"
                ref={fileInputRef}
                onChange={handleImportExcel}
                accept=".xlsx, .xls"
                className="hidden"
              />
              <button
                onClick={() => fileInputRef.current.click()}
                className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-medium rounded-lg border border-gray-700 transition flex items-center gap-2"
              >
                <span>Import Master (.xlsx)</span>
              </button>

              {/* Export Button */}
              <button
                onClick={handleExportExcel}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium rounded-lg transition shadow-lg shadow-emerald-900/20 flex items-center gap-2"
              >
                <span>Export Master (.xlsx)</span>
              </button>

              {/* Log Out Button */}
              <button
                onClick={handleLogout}
                className="px-3.5 py-2 bg-gray-950 hover:bg-gray-800 text-gray-400 hover:text-white text-sm font-medium rounded-lg border border-gray-800 transition"
              >
                Log Out
              </button>
            </div>
          </header>

          {/* Notice Banner */}
          <div className="bg-amber-950/40 border-b border-amber-800/50 px-6 py-2.5 flex items-center justify-between text-amber-200 text-sm">
            <div className="flex items-center gap-2 flex-1">
              <span className="font-semibold uppercase tracking-wider text-xs bg-amber-900/60 text-amber-300 px-2 py-0.5 rounded border border-amber-700/50">Notice</span>
              {isEditingNotice && isAdmin ? (
                <input
                  type="text"
                  value={tempNotice}
                  onChange={(e) => setTempNotice(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") {
                      setNotification(tempNotice);
                      setIsEditingNotice(false);
                      persistState({ notification: tempNotice });
                    }
                  }}
                  className="bg-gray-900 text-amber-100 px-3 py-1 rounded border border-amber-700 text-sm w-full focus:outline-none"
                  autoFocus
                />
              ) : (
                <span>{notification || "GXT/SH Won't be added to release sheet. Domestic should Email to Release Mtys."}</span>
              )}
            </div>
            {isAdmin && (
              <button
                onClick={() => {
                  if (isEditingNotice) {
                    setNotification(tempNotice);
                    setIsEditingNotice(false);
                    persistState({ notification: tempNotice });
                  } else {
                    setTempNotice(notification || "GXT/SH Won't be added to release sheet. Domestic should Email to Release Mtys.");
                    setIsEditingNotice(true);
                  }
                }}
                className="text-xs text-amber-400 hover:text-amber-300 underline ml-4 whitespace-nowrap"
              >
                {isEditingNotice ? "Save" : "Edit Notice"}
              </button>
            )}
          </div>

          {/* Day Navigation Tabs */}
          <nav className="bg-gray-900/80 border-b border-gray-800 px-6 flex items-center gap-1 overflow-x-auto">
            {DAYS.map((day) => {
              const active = activeDay === day;
              const count = (sheetData[day] || []).filter(isRowValid).length;
              return (
                <button
                  key={day}
                  onClick={() => setActiveDay(day)}
                  className={`px-5 py-3 text-sm font-medium border-b-2 transition flex items-center gap-2 whitespace-nowrap ${
                    active
                      ? "border-emerald-500 text-emerald-400 bg-gray-800/50"
                      : "border-transparent text-gray-400 hover:text-gray-200 hover:bg-gray-800/30"
                  }`}
                >
                  {day}
                  <span className={`text-xs px-2 py-0.5 rounded-full ${active ? "bg-emerald-950 text-emerald-300 border border-emerald-800" : "bg-gray-800 text-gray-400"}`}>
                    {count}
                  </span>
                </button>
              );
            })}
          </nav>

          {/* Table Workspace */}
          <main className="flex-1 p-6 flex flex-col overflow-hidden">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-lg font-semibold text-gray-200">{activeDay} Schedule</h2>
              {isAdmin && (
                <button
                  onClick={handleAddRow}
                  className="px-3.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-100 text-sm font-medium rounded-md border border-gray-700 transition flex items-center gap-1.5"
                >
                  + Add Line
                </button>
              )}
            </div>

            <div className="flex-1 border border-gray-800 rounded-lg overflow-auto bg-gray-900/40">
              <table className="w-full text-left border-collapse min-w-[1200px]">
                <thead>
                  <tr className="bg-gray-900 text-gray-400 text-xs font-semibold uppercase border-b border-gray-800 sticky top-0 z-10">
                    <th className="py-3 px-3 w-12 text-center">#</th>
                    <th className="py-3 px-3">Customer</th>
                    <th className="py-3 px-3 w-20"># Units</th>
                    <th className="py-3 px-3 w-24">Type</th>
                    <th className="py-3 px-3">Booking #</th>
                    <th className="py-3 px-3 w-32">Ex Grid</th>
                    <th className="py-3 px-3 bg-emerald-950/30 text-emerald-300">Ctn # Released</th>
                    <th className="py-3 px-3 bg-emerald-950/30 text-emerald-300">Truck ID</th>
                    <th className="py-3 px-3 w-28 bg-emerald-950/30 text-emerald-300">Time (HHmm)</th>
                    <th className="py-3 px-3 w-36 bg-emerald-950/30 text-emerald-300">Doors</th>
                    <th className="py-3 px-3 min-w-[200px] bg-emerald-950/30 text-emerald-300">Comments</th>
                    {isAdmin && <th className="py-3 px-3 w-12 text-center">Actions</th>}
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-800/60 text-sm">
                  {currentDayRows.length === 0 ? (
                    <tr>
                      <td colSpan={isAdmin ? 12 : 11} className="py-12 text-center text-gray-500">
                        No active records for {activeDay}. Click "Import Master (.xlsx)" to load a schedule.
                      </td>
                    </tr>
                  ) : (
                    currentDayRows.map((row, idx) => {
                      const isDragged = draggedRowIndex === idx;
                      const isDragOver = dragOverRowIndex === idx;
                      const gridKey = (row.exGrid || "").toString().trim().toUpperCase();
                      const gridColorStyle = GRID_COLOR_MAP[gridKey] || DEFAULT_GRID_STYLE;

                      return (
                        <tr
                          key={idx}
                          draggable={isAdmin}
                          onDragStart={(e) => handleDragStart(e, idx)}
                          onDragOver={(e) => handleDragOver(e, idx)}
                          onDrop={(e) => handleDrop(e, idx)}
                          className={`transition hover:bg-gray-800/40 ${
                            isDragged ? "opacity-30 bg-gray-800" : ""
                          } ${isDragOver ? "border-t-2 border-emerald-500 bg-emerald-950/20" : ""}`}
                        >
                          {/* Line Number */}
                          <td className="py-2.5 px-3 text-center text-gray-500 font-mono text-xs select-none">
                            {idx + 1}
                          </td>

                          {/* Customer */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                value={row.customer || ""}
                                onChange={(e) => handleCellChange(idx, "customer", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "customer", e.target.value)}
                                className="w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition"
                              />
                            ) : (
                              <span className="text-gray-200 font-medium px-1">{row.customer || "-"}</span>
                            )}
                          </td>

                          {/* Units */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                value={row.units || ""}
                                onChange={(e) => handleCellChange(idx, "units", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "units", e.target.value)}
                                className="w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition"
                              />
                            ) : (
                              <span className="text-gray-300 font-mono px-1">{row.units || "1"}</span>
                            )}
                          </td>

                          {/* Type */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                value={row.type || ""}
                                onChange={(e) => handleCellChange(idx, "type", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "type", e.target.value)}
                                className="w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition font-mono uppercase"
                              />
                            ) : (
                              <span className="text-gray-200 font-mono uppercase px-1">{row.type || "-"}</span>
                            )}
                          </td>

                          {/* Booking # */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                value={row.bookingNo || ""}
                                onChange={(e) => handleCellChange(idx, "bookingNo", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "bookingNo", e.target.value)}
                                className="w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition font-mono"
                              />
                            ) : (
                              <span className="text-gray-200 font-mono px-1">{row.bookingNo || "-"}</span>
                            )}
                          </td>

                          {/* Color-Coded Ex Grid */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                value={row.exGrid || ""}
                                onChange={(e) => handleCellChange(idx, "exGrid", e.target.value.toUpperCase())}
                                onBlur={(e) => handleCellBlur(idx, "exGrid", e.target.value.toUpperCase())}
                                className={`w-full font-bold px-2 py-1 rounded border text-xs text-center focus:outline-none transition font-mono uppercase ${gridColorStyle}`}
                              />
                            ) : (
                              <div className={`font-bold px-2 py-1 rounded border text-xs text-center font-mono uppercase ${gridColorStyle}`}>
                                {row.exGrid || "GRID"}
                              </div>
                            )}
                          </td>

                          {/* GENERAL USER EDITABLE: Ctn Released */}
                          <td className="py-2.5 px-3 bg-emerald-950/10">
                            <input
                              type="text"
                              value={row.ctnReleased || ""}
                              placeholder="Enter Ctn #"
                              onChange={(e) => handleCellChange(idx, "ctnReleased", e.target.value)}
                              onBlur={(e) => handleCellBlur(idx, "ctnReleased", e.target.value)}
                              className="w-full bg-gray-900/60 border border-emerald-900/50 focus:border-emerald-500 text-emerald-200 font-mono uppercase px-2 py-1 rounded transition"
                            />
                          </td>

                          {/* GENERAL USER EDITABLE: Truck ID */}
                          <td className="py-2.5 px-3 bg-emerald-950/10">
                            <input
                              type="text"
                              value={row.truckId || ""}
                              placeholder="Enter Truck ID"
                              onChange={(e) => handleCellChange(idx, "truckId", e.target.value)}
                              onBlur={(e) => handleCellBlur(idx, "truckId", e.target.value)}
                              className="w-full bg-gray-900/60 border border-emerald-900/50 focus:border-emerald-500 text-gray-100 font-mono uppercase px-2 py-1 rounded transition"
                            />
                          </td>

                          {/* GENERAL USER EDITABLE: Time */}
                          <td className="py-2.5 px-3 bg-emerald-950/10">
                            <input
                              type="text"
                              maxLength={4}
                              placeholder="HHMM"
                              value={row.time || ""}
                              onChange={(e) => handleCellChange(idx, "time", e.target.value)}
                              onBlur={(e) => handleCellBlur(idx, "time", e.target.value)}
                              className="w-full bg-gray-900/60 border border-emerald-900/50 focus:border-emerald-500 text-amber-300 font-mono px-2 py-1 rounded transition"
                            />
                          </td>

                          {/* GENERAL USER EDITABLE: Doors Dropdown */}
                          <td className="py-2.5 px-3 bg-emerald-950/10">
                            <select
                              value={row.doors || "Forward"}
                              onChange={(e) => {
                                handleCellChange(idx, "doors", e.target.value);
                                handleCellBlur(idx, "doors", e.target.value);
                              }}
                              className="w-full bg-gray-950 border border-emerald-900/50 hover:border-emerald-700 text-gray-200 text-xs py-1 px-2 rounded focus:outline-none focus:border-emerald-500 transition"
                            >
                              {DOOR_OPTIONS.map((option) => (
                                <option key={option} value={option}>
                                  {option}
                                </option>
                              ))}
                            </select>
                          </td>

                          {/* GENERAL USER EDITABLE: Comments Modal Trigger */}
                          <td className="py-2.5 px-3 bg-emerald-950/10">
                            <div className="flex items-center justify-between gap-2">
                              <span
                                onClick={() => openCommentModal(idx, row.comment)}
                                className="text-xs text-gray-300 truncate max-w-[200px] cursor-pointer hover:text-white block"
                                title="Click to expand instructions"
                              >
                                {row.comment || <span className="text-gray-500 italic">+ Add instructions</span>}
                              </span>
                              <button
                                onClick={() => openCommentModal(idx, row.comment)}
                                className="text-emerald-400 hover:text-emerald-300 p-1"
                                title="Expand Instructions"
                              >
                                💬
                              </button>
                            </div>
                          </td>

                          {/* Admin Only Delete */}
                          {isAdmin && (
                            <td className="py-2.5 px-3 text-center">
                              <button
                                onClick={() => handleRemoveRow(idx)}
                                className="text-gray-500 hover:text-rose-400 transition"
                                title="Delete Line"
                              >
                                ✕
                              </button>
                            </td>
                          )}
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </main>

          {/* Comment Pop-out Modal */}
          {commentModal.isOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-6 w-full max-w-lg shadow-2xl">
                <h3 className="text-lg font-bold text-gray-100 mb-2">Special Instructions / Comments</h3>
                <p className="text-xs text-gray-400 mb-4">Line #{commentModal.rowIndex + 1}</p>
                <textarea
                  rows={6}
                  value={commentModal.text}
                  onChange={(e) => setCommentModal({ ...commentModal, text: e.target.value })}
                  className="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-gray-100 focus:outline-none focus:border-emerald-500 text-sm mb-4"
                  placeholder="Enter detailed special instructions..."
                  autoFocus
                />
                <div className="flex justify-end gap-3">
                  <button
                    onClick={() => setCommentModal({ isOpen: false, rowIndex: null, text: "" })}
                    className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm rounded-lg"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={saveCommentModal}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm rounded-lg"
                  >
                    Save Comment
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Admin User Management Modal */}
          {isUserModalOpen && isAdmin && (
            <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
              <div className="bg-gray-900 border border-gray-800 rounded-xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl">
                <div className="px-6 py-4 border-b border-gray-800 flex items-center justify-between">
                  <div>
                    <h3 className="text-lg font-bold text-white">User Management</h3>
                    <p className="text-xs text-gray-400">
                      New users receive default PIN <code className="text-amber-300">1111</code> and must set a personal PIN on first login. PINs are never displayed.
                    </p>
                  </div>
                  <button
                    onClick={() => setIsUserModalOpen(false)}
                    className="text-gray-400 hover:text-white text-lg px-2"
                  >
                    ✕
                  </button>
                </div>

                {/* Add New User Form */}
                <form onSubmit={handleAddUser} className="p-6 bg-gray-950/60 border-b border-gray-800 space-y-3">
                  <div className="flex flex-wrap sm:flex-nowrap items-center gap-3">
                    <input
                      type="text"
                      value={newUserNameInput}
                      onChange={(e) => setNewUserNameInput(e.target.value)}
                      placeholder="Enter new username..."
                      className="flex-1 bg-gray-900 border border-gray-700 focus:border-emerald-500 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none"
                    />
                    <select
                      value={newUserRoleInput}
                      onChange={(e) => setNewUserRoleInput(e.target.value)}
                      className="bg-gray-900 border border-gray-700 focus:border-emerald-500 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none"
                    >
                      <option value="General User">General User</option>
                      <option value="Admin">Admin</option>
                    </select>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-lg transition whitespace-nowrap"
                    >
                      + Add User
                    </button>
                  </div>

                  {userMgmtMessage.text && (
                    <div
                      className={`text-xs rounded-lg px-3 py-2 border ${
                        userMgmtMessage.type === "error"
                          ? "bg-rose-950/60 border-rose-800/70 text-rose-300"
                          : "bg-emerald-950/60 border-emerald-800/70 text-emerald-300"
                      }`}
                    >
                      {userMgmtMessage.text}
                    </div>
                  )}
                </form>

                {/* Active User List (PINs completely hidden) */}
                <div className="flex-1 overflow-auto p-6 space-y-2.5">
                  {users.map((u) => {
                    const isDefaultPending = u.pin === DEFAULT_PIN || u.mustChangePin;
                    return (
                      <div
                        key={u.id}
                        className="bg-gray-950/80 border border-gray-800 rounded-lg px-4 py-3 flex flex-wrap items-center justify-between gap-3"
                      >
                        <div className="flex items-center gap-3">
                          <span className="font-semibold text-sm text-white">{u.username}</span>
                          <span
                            className={`px-2 py-0.5 rounded text-[10px] font-semibold uppercase ${
                              u.role === "Admin"
                                ? "bg-amber-950 text-amber-300 border border-amber-800/60"
                                : "bg-gray-800 text-gray-300"
                            }`}
                          >
                            {u.role}
                          </span>
                          <span
                            className={`px-2 py-0.5 rounded text-[10px] ${
                              isDefaultPending
                                ? "bg-amber-950/50 text-amber-400 border border-amber-800/40"
                                : "bg-emerald-950/50 text-emerald-400 border border-emerald-800/40"
                            }`}
                          >
                            {isDefaultPending ? "Default PIN (1111) - Setup Pending" : "Personal PIN Active"}
                          </span>
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            type="button"
                            onClick={() => handleResetUserPin(u)}
                            className="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-amber-300 text-xs font-medium rounded border border-gray-700 transition"
                          >
                            Reset PIN to 1111
                          </button>
                          {u.id !== currentUser.id && (
                            <button
                              type="button"
                              onClick={() => handleRemoveUser(u)}
                              className="px-3 py-1 bg-rose-950/50 hover:bg-rose-900/60 text-rose-300 text-xs font-medium rounded border border-rose-800/50 transition"
                            >
                              Remove
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="px-6 py-3 border-t border-gray-800 flex justify-end">
                  <button
                    onClick={() => setIsUserModalOpen(false)}
                    className="px-4 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm rounded-lg"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 7-Day Activity Log & Archive Snapshot Modal */}
          {isLogModalOpen && (
            <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
              <div className="bg-gray-900 border border-gray-800 rounded-xl w-full max-w-4xl max-h-[85vh] flex flex-col shadow-2xl">
                <div className="px-6 py-4 border-b border-gray-800 flex items-center justify-between">
                  <div>
                    <h3 className="text-lg font-bold text-white">7-Day Activity Log & Weekly Snapshots</h3>
                    <p className="text-xs text-gray-400">Tracks which user made each edit. Records retained for 7 days.</p>
                  </div>
                  <button
                    onClick={() => setIsLogModalOpen(false)}
                    className="text-gray-400 hover:text-white text-lg px-2"
                  >
                    ✕
                  </button>
                </div>

                <div className="px-6 py-3 bg-gray-950/60 border-b border-gray-800 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setLogModalTab("edits")}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                        logModalTab === "edits"
                          ? "bg-emerald-600 text-white"
                          : "bg-gray-800 text-gray-400 hover:text-gray-200"
                      }`}
                    >
                      Edit History ({activityLogs.length})
                    </button>
                    <button
                      onClick={() => setLogModalTab("snapshots")}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                        logModalTab === "snapshots"
                          ? "bg-amber-600 text-white"
                          : "bg-gray-800 text-gray-400 hover:text-gray-200"
                      }`}
                    >
                      Import Backups ({importSnapshots.length})
                    </button>
                  </div>

                  {logModalTab === "edits" && (
                    <input
                      type="text"
                      value={logSearchQuery}
                      onChange={(e) => setLogSearchQuery(e.target.value)}
                      placeholder="Filter by User, Ctn #, Booking, Truck..."
                      className="bg-gray-900 border border-gray-700 focus:border-emerald-500 rounded-lg px-3 py-1.5 text-xs text-gray-100 w-72 focus:outline-none"
                    />
                  )}
                </div>

                <div className="flex-1 overflow-auto p-6">
                  {logModalTab === "edits" ? (
                    filteredLogs.length === 0 ? (
                      <div className="text-center py-12 text-gray-500 text-sm">
                        No log entries found within the last 7 days.
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {filteredLogs.map((log) => (
                          <div
                            key={log.id}
                            className="bg-gray-950/80 border border-gray-800/80 rounded-lg px-4 py-3 flex flex-wrap items-center justify-between gap-2 text-xs"
                          >
                            <div className="flex items-center gap-3">
                              <span className="font-mono text-emerald-400 font-semibold whitespace-nowrap">
                                {log.formattedTime}
                              </span>
                              <span className="px-2 py-0.5 rounded bg-emerald-950/80 text-emerald-300 border border-emerald-800/50 font-semibold">
                                {log.username || "Unknown"}
                              </span>
                              <span className="px-2 py-0.5 rounded bg-gray-800 text-gray-300 font-medium">
                                {log.day} {log.lineNo !== "-" ? `#${log.lineNo}` : ""}
                              </span>
                              <span className="text-gray-200">{log.details}</span>
                            </div>
                            <div className="flex items-center gap-2 text-gray-400 font-mono">
                              {log.customer && <span>[{log.customer}]</span>}
                              {log.bookingNo && <span>Bkg: {log.bookingNo}</span>}
                            </div>
                          </div>
                        ))}
                      </div>
                    )
                  ) : importSnapshots.length === 0 ? (
                    <div className="text-center py-12 text-gray-500 text-sm">
                      No backup snapshots stored yet. Whenever an Excel sheet is imported, the previous sheet is automatically backed up here for 7 days.
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {importSnapshots.map((snap) => (
                        <div
                          key={snap.id}
                          className="bg-gray-950/80 border border-gray-800 rounded-lg p-4 flex flex-wrap items-center justify-between gap-4"
                        >
                          <div>
                            <div className="flex items-center gap-2 mb-1">
                              <span className="font-mono text-xs text-amber-400 font-semibold">
                                {snap.formattedTime}
                              </span>
                              <span className="text-xs bg-gray-800 text-gray-300 px-2 py-0.5 rounded">
                                {snap.rowCount} Total Lines
                              </span>
                            </div>
                            <p className="text-sm text-gray-200">{snap.label}</p>
                          </div>
                          <button
                            onClick={() => handleRestoreSnapshot(snap)}
                            className="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded-lg transition"
                          >
                            Restore This Sheet
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div className="px-6 py-3 border-t border-gray-800 flex justify-end">
                  <button
                    onClick={() => setIsLogModalOpen(false)}
                    className="px-4 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm rounded-lg"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
