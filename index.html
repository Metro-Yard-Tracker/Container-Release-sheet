<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Container Release Sheet & Yard Grid Planner</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- SheetJS (XLSX) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1f2937;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const DAYS = [
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
      "Sunday"
    ];

    const DOOR_OPTIONS = ["Forward", "Rear", "Passengers", "Drivers"];

    // AV Grid Color Palette
    const GRID_COLOR_MAP = {
      "AV1": "bg-blue-950/80 text-blue-300 border-blue-700/60",
      "AV2": "bg-purple-950/80 text-purple-300 border-purple-700/60",
      "AV3": "bg-amber-950/80 text-amber-300 border-amber-700/60",
      "AV4": "bg-emerald-950/80 text-emerald-300 border-emerald-700/60",
      "AV5": "bg-rose-950/80 text-rose-300 border-rose-700/60"
    };

    const DEFAULT_GRID_STYLE = "bg-gray-800 text-gray-300 border-gray-700";

    const DEFAULT_HEADER_BLOCK = [
      ["00:01 TO 23:59", "Empty Container Release", "", "", "", "", "", "NO Longer Valid", "", "GXT/SH Wont be added to release sheet Domestic should Email to Release Mtys", ""],
      ["", "", "", "", "", "", "", "", "", "", ""],
      ["", "Customer", "# Units", "Type", "Booking #", "Ex Grid", "Ctn # Released", "Truck id", "Time", "Doors", "Comment/Special Instructions"]
    ];

    function App() {
      const [activeDay, setActiveDay] = useState("Monday");
      const [userRole, setUserRole] = useState("General User"); // "General User" or "Admin"
      const [sheetData, setSheetData] = useState({
        Monday: [],
        Tuesday: [],
        Wednesday: [],
        Thursday: [],
        Friday: [],
        Saturday: [],
        Sunday: []
      });
      const [headerMetadata, setHeaderMetadata] = useState({
        Monday: DEFAULT_HEADER_BLOCK,
        Tuesday: DEFAULT_HEADER_BLOCK,
        Wednesday: DEFAULT_HEADER_BLOCK,
        Thursday: DEFAULT_HEADER_BLOCK,
        Friday: DEFAULT_HEADER_BLOCK,
        Saturday: DEFAULT_HEADER_BLOCK,
        Sunday: DEFAULT_HEADER_BLOCK
      });
      const [notification, setNotification] = useState("");
      const [isEditingNotice, setIsEditingNotice] = useState(false);
      const [tempNotice, setTempNotice] = useState("");
      const [draggedRowIndex, setDraggedRowIndex] = useState(null);
      const [dragOverRowIndex, setDragOverRowIndex] = useState(null);
      const [commentModal, setCommentModal] = useState({ isOpen: false, rowIndex: null, text: "" });
      const fileInputRef = useRef(null);

      // Realtime Database sync
      useEffect(() => {
        const releaseRef = db.ref("container_release");
        releaseRef.on("value", (snapshot) => {
          const val = snapshot.val();
          if (val) {
            if (val.daysData) setSheetData(val.daysData);
            if (val.headerMetadata) setHeaderMetadata(val.headerMetadata);
            if (val.notification !== undefined) setNotification(val.notification);
          }
        });
        return () => releaseRef.off();
      }, []);

      const saveToFirebase = (newData, newHeaders, newNotice) => {
        const payload = {
          daysData: newData !== undefined ? newData : sheetData,
          headerMetadata: newHeaders !== undefined ? newHeaders : headerMetadata,
          notification: newNotice !== undefined ? newNotice : notification,
          lastUpdated: new Date().toISOString()
        };
        db.ref("container_release").set(payload);
      };

      // Helper to generate current 24-hr time (HHmm)
      const getCurrent24HrTime = () => {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        return `${hours}${minutes}`;
      };

      const format24HrTime = (val) => {
        if (!val) return "";
        let cleaned = val.toString().replace(/[^0-9]/g, "");
        if (cleaned.length > 4) cleaned = cleaned.substring(0, 4);
        return cleaned;
      };

      const isRowValid = (row) => {
        if (!row) return false;
        return (
          (row.customer && row.customer.trim() !== "") ||
          (row.bookingNo && row.bookingNo.trim() !== "") ||
          (row.type && row.type.trim() !== "") ||
          (row.exGrid && row.exGrid.trim() !== "") ||
          (row.ctnReleased && row.ctnReleased.trim() !== "") ||
          (row.truckId && row.truckId.trim() !== "") ||
          (row.comment && row.comment.trim() !== "")
        );
      };

      const handleCellChange = (rowIndex, field, value) => {
        const updatedDayData = [...(sheetData[activeDay] || [])];
        if (!updatedDayData[rowIndex]) return;

        let autoTime = updatedDayData[rowIndex].time;

        // Auto-populate 24-hr time when container number is added
        if (field === "ctnReleased" && value.trim() !== "" && (!autoTime || autoTime.trim() === "")) {
          autoTime = getCurrent24HrTime();
        }

        updatedDayData[rowIndex] = {
          ...updatedDayData[rowIndex],
          [field]: value,
          time: autoTime
        };

        const newSheetData = {
          ...sheetData,
          [activeDay]: updatedDayData
        };
        setSheetData(newSheetData);
      };

      const handleCellBlur = (rowIndex, field, value) => {
        let finalValue = value;
        if (field === "time") {
          finalValue = format24HrTime(value);
        }

        const updatedDayData = [...(sheetData[activeDay] || [])];
        if (!updatedDayData[rowIndex]) return;

        updatedDayData[rowIndex] = {
          ...updatedDayData[rowIndex],
          [field]: finalValue
        };

        const newSheetData = {
          ...sheetData,
          [activeDay]: updatedDayData
        };
        setSheetData(newSheetData);
        saveToFirebase(newSheetData);
      };

      const handleAddRow = () => {
        const currentList = sheetData[activeDay] || [];
        const newRow = {
          lineNo: currentList.length + 1,
          customer: "",
          units: "1",
          type: "",
          bookingNo: "",
          exGrid: "AV1",
          ctnReleased: "",
          truckId: "",
          time: "",
          doors: "Forward",
          comment: "",
          isNew: true
        };
        const updatedList = [...currentList, newRow];
        const newSheetData = { ...sheetData, [activeDay]: updatedList };
        setSheetData(newSheetData);
        saveToFirebase(newSheetData);
      };

      const handleRemoveRow = (index) => {
        const currentList = sheetData[activeDay] || [];
        const updatedList = currentList.filter((_, idx) => idx !== index).map((row, idx) => ({
          ...row,
          lineNo: idx + 1
        }));
        const newSheetData = { ...sheetData, [activeDay]: updatedList };
        setSheetData(newSheetData);
        saveToFirebase(newSheetData);
      };

      const handleDragStart = (e, index) => {
        if (userRole !== "Admin") return; // Reordering restricted to Admin
        setDraggedRowIndex(index);
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDragOver = (e, index) => {
        if (userRole !== "Admin") return;
        e.preventDefault();
        if (draggedRowIndex === null) return;
        setDragOverRowIndex(index);
      };

      const handleDrop = (e, index) => {
        if (userRole !== "Admin") return;
        e.preventDefault();
        if (draggedRowIndex === null || draggedRowIndex === index) {
          setDraggedRowIndex(null);
          setDragOverRowIndex(null);
          return;
        }
        const currentList = [...(sheetData[activeDay] || [])];
        const draggedItem = currentList[draggedRowIndex];
        currentList.splice(draggedRowIndex, 1);
        currentList.splice(index, 0, draggedItem);

        const reindexed = currentList.map((item, idx) => ({ ...item, lineNo: idx + 1 }));
        const newSheetData = { ...sheetData, [activeDay]: reindexed };
        setSheetData(newSheetData);
        saveToFirebase(newSheetData);
        setDraggedRowIndex(null);
        setDragOverRowIndex(null);
      };

      const handleImportExcel = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: "array" });

          const newSheetData = { ...sheetData };
          const newHeaderMeta = { ...headerMetadata };

          workbook.SheetNames.forEach((sheetName) => {
            const matchedDay = DAYS.find((d) => sheetName.toLowerCase().includes(d.toLowerCase()));
            if (matchedDay) {
              const worksheet = workbook.Sheets[sheetName];
              const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

              const headers = rawRows.slice(0, 3);
              if (headers.length > 0) {
                newHeaderMeta[matchedDay] = headers;
              }

              const dataRows = rawRows.slice(3);
              const parsedRows = dataRows
                .map((r, idx) => ({
                  lineNo: idx + 1,
                  customer: r[1] !== undefined ? String(r[1]).trim() : "",
                  units: r[2] !== undefined ? String(r[2]).trim() : "1",
                  type: r[3] !== undefined ? String(r[3]).trim() : "",
                  bookingNo: r[4] !== undefined ? String(r[4]).trim() : "",
                  exGrid: r[5] !== undefined ? String(r[5]).trim().toUpperCase() : "",
                  ctnReleased: r[6] !== undefined ? String(r[6]).trim() : "",
                  truckId: r[7] !== undefined ? String(r[7]).trim() : "",
                  time: format24HrTime(r[8] || ""),
                  doors: r[9] !== undefined ? String(r[9]).trim() : "Forward",
                  comment: r[10] !== undefined ? String(r[10]).trim() : ""
                }))
                .filter(isRowValid);

              newSheetData[matchedDay] = parsedRows;
            }
          });

          setSheetData(newSheetData);
          setHeaderMetadata(newHeaderMeta);
          saveToFirebase(newSheetData, newHeaderMeta);
        };
        reader.readAsArrayBuffer(file);
      };

      const handleExportExcel = () => {
        const wb = XLSX.utils.book_new();

        DAYS.forEach((day) => {
          const dayMeta = headerMetadata[day] || DEFAULT_HEADER_BLOCK;
          const rowsList = (sheetData[day] || []).filter(isRowValid);

          const sheetOutput = [
            ...dayMeta,
            ...rowsList.map((r, idx) => [
              idx + 1,
              r.customer,
              r.units,
              r.type,
              r.bookingNo,
              r.exGrid,
              r.ctnReleased,
              r.truckId,
              r.time,
              r.doors,
              r.comment
            ])
          ];

          const ws = XLSX.utils.aoa_to_sheet(sheetOutput);
          XLSX.utils.book_append_sheet(wb, ws, day);
        });

        XLSX.writeFile(wb, `Mty_Container_Release_Sheet_${new Date().toISOString().slice(0, 10)}.xlsx`);
      };

      const openCommentModal = (index, text) => {
        setCommentModal({ isOpen: true, rowIndex: index, text: text || "" });
      };

      const saveCommentModal = () => {
        if (commentModal.rowIndex !== null) {
          handleCellBlur(commentModal.rowIndex, "comment", commentModal.text);
        }
        setCommentModal({ isOpen: false, rowIndex: null, text: "" });
      };

      const currentDayRows = (sheetData[activeDay] || []).filter((r) => isRowValid(r) || r.isNew);

      const isAdmin = userRole === "Admin";

      return (
        <div className="flex-1 flex flex-col">
          {/* Header Bar */}
          <header className="bg-gray-900 border-b border-gray-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                Container Release Sheet & Yard Grid Planner
              </h1>
              <p className="text-xs text-gray-400">Real-time Sync | Mode: <span className="font-semibold text-emerald-400">{userRole}</span></p>
            </div>

            <div className="flex items-center gap-3">
              {/* Mode Switcher */}
              <div className="bg-gray-950 p-1 rounded-lg border border-gray-800 flex items-center text-xs">
                <button
                  onClick={() => setUserRole("General User")}
                  className={`px-3 py-1.5 rounded-md font-medium transition ${
                    !isAdmin ? "bg-emerald-600 text-white" : "text-gray-400 hover:text-gray-200"
                  }`}
                >
                  General User
                </button>
                <button
                  onClick={() => setUserRole("Admin")}
                  className={`px-3 py-1.5 rounded-md font-medium transition ${
                    isAdmin ? "bg-amber-600 text-white" : "text-gray-400 hover:text-gray-200"
                  }`}
                >
                  Admin Mode
                </button>
              </div>

              {isAdmin && (
                <>
                  <input
                    type="file"
                    ref={fileInputRef}
                    onChange={handleImportExcel}
                    accept=".xlsx, .xls"
                    className="hidden"
                  />
                  <button
                    onClick={() => fileInputRef.current.click()}
                    className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-medium rounded-lg border border-gray-700 transition flex items-center gap-2"
                  >
                    <span>Import Master (.xlsx)</span>
                  </button>
                </>
              )}

              <button
                onClick={handleExportExcel}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium rounded-lg transition shadow-lg shadow-emerald-900/20 flex items-center gap-2"
              >
                <span>Export Master (.xlsx)</span>
              </button>
            </div>
          </header>

          {/* Notice Banner */}
          <div className="bg-amber-950/40 border-b border-amber-800/50 px-6 py-2.5 flex items-center justify-between text-amber-200 text-sm">
            <div className="flex items-center gap-2 flex-1">
              <span className="font-semibold uppercase tracking-wider text-xs bg-amber-900/60 text-amber-300 px-2 py-0.5 rounded border border-amber-700/50">Notice</span>
              {isEditingNotice && isAdmin ? (
                <input
                  type="text"
                  value={tempNotice}
                  onChange={(e) => setTempNotice(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") {
                      setNotification(tempNotice);
                      setIsEditingNotice(false);
                      saveToFirebase(undefined, undefined, tempNotice);
                    }
                  }}
                  className="bg-gray-900 text-amber-100 px-3 py-1 rounded border border-amber-700 text-sm w-full focus:outline-none"
                  autoFocus
                />
              ) : (
                <span>{notification || "GXT/SH Won't be added to release sheet. Domestic should Email to Release Mtys."}</span>
              )}
            </div>
            {isAdmin && (
              <button
                onClick={() => {
                  if (isEditingNotice) {
                    setNotification(tempNotice);
                    setIsEditingNotice(false);
                    saveToFirebase(undefined, undefined, tempNotice);
                  } else {
                    setTempNotice(notification || "GXT/SH Won't be added to release sheet. Domestic should Email to Release Mtys.");
                    setIsEditingNotice(true);
                  }
                }}
                className="text-xs text-amber-400 hover:text-amber-300 underline ml-4 whitespace-nowrap"
              >
                {isEditingNotice ? "Save" : "Edit Notice"}
              </button>
            )}
          </div>

          {/* Day Navigation Tabs */}
          <nav className="bg-gray-900/80 border-b border-gray-800 px-6 flex items-center gap-1 overflow-x-auto">
            {DAYS.map((day) => {
              const active = activeDay === day;
              const count = (sheetData[day] || []).filter(isRowValid).length;
              return (
                <button
                  key={day}
                  onClick={() => setActiveDay(day)}
                  className={`px-5 py-3 text-sm font-medium border-b-2 transition flex items-center gap-2 whitespace-nowrap ${
                    active
                      ? "border-emerald-500 text-emerald-400 bg-gray-800/50"
                      : "border-transparent text-gray-400 hover:text-gray-200 hover:bg-gray-800/30"
                  }`}
                >
                  {day}
                  <span className={`text-xs px-2 py-0.5 rounded-full ${active ? "bg-emerald-950 text-emerald-300 border border-emerald-800" : "bg-gray-800 text-gray-400"}`}>
                    {count}
                  </span>
                </button>
              );
            })}
          </nav>

          {/* Table Workspace */}
          <main className="flex-1 p-6 flex flex-col overflow-hidden">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-lg font-semibold text-gray-200">{activeDay} Schedule</h2>
              {isAdmin && (
                <button
                  onClick={handleAddRow}
                  className="px-3.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-100 text-sm font-medium rounded-md border border-gray-700 transition flex items-center gap-1.5"
                >
                  + Add Line
                </button>
              )}
            </div>

            <div className="flex-1 border border-gray-800 rounded-lg overflow-auto bg-gray-900/40">
              <table className="w-full text-left border-collapse min-w-[1200px]">
                <thead>
                  <tr className="bg-gray-900 text-gray-400 text-xs font-semibold uppercase border-b border-gray-800 sticky top-0 z-10">
                    <th className="py-3 px-3 w-12 text-center">#</th>
                    <th className="py-3 px-3">Customer</th>
                    <th className="py-3 px-3 w-20"># Units</th>
                    <th className="py-3 px-3 w-24">Type</th>
                    <th className="py-3 px-3">Booking #</th>
                    <th className="py-3 px-3 w-32">Ex Grid</th>
                    <th className="py-3 px-3 bg-emerald-950/30 text-emerald-300">Ctn # Released</th>
                    <th className="py-3 px-3 bg-emerald-950/30 text-emerald-300">Truck ID</th>
                    <th className="py-3 px-3 w-28 bg-emerald-950/30 text-emerald-300">Time (HHmm)</th>
                    <th className="py-3 px-3 w-36 bg-emerald-950/30 text-emerald-300">Doors</th>
                    <th className="py-3 px-3 min-w-[200px] bg-emerald-950/30 text-emerald-300">Comments</th>
                    {isAdmin && <th className="py-3 px-3 w-12 text-center">Actions</th>}
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-800/60 text-sm">
                  {currentDayRows.length === 0 ? (
                    <tr>
                      <td colSpan={isAdmin ? 12 : 11} className="py-12 text-center text-gray-500">
                        No active records for {activeDay}.
                      </td>
                    </tr>
                  ) : (
                    currentDayRows.map((row, idx) => {
                      const isDragged = draggedRowIndex === idx;
                      const isDragOver = dragOverRowIndex === idx;
                      const gridKey = (row.exGrid || "").trim().toUpperCase();
                      const gridColorStyle = GRID_COLOR_MAP[gridKey] || DEFAULT_GRID_STYLE;

                      return (
                        <tr
                          key={idx}
                          draggable={isAdmin}
                          onDragStart={(e) => handleDragStart(e, idx)}
                          onDragOver={(e) => handleDragOver(e, idx)}
                          onDrop={(e) => handleDrop(e, idx)}
                          className={`transition hover:bg-gray-800/40 ${
                            isDragged ? "opacity-30 bg-gray-800" : ""
                          } ${isDragOver ? "border-t-2 border-emerald-500 bg-emerald-950/20" : ""}`}
                        >
                          {/* Line Number */}
                          <td className="py-2.5 px-3 text-center text-gray-500 font-mono text-xs select-none">
                            {idx + 1}
                          </td>

                          {/* Read-Only for General Users: Customer */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                value={row.customer || ""}
                                onChange={(e) => handleCellChange(idx, "customer", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "customer", e.target.value)}
                                className="w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition"
                              />
                            ) : (
                              <span className="text-gray-200 font-medium px-1">{row.customer || "-"}</span>
                            )}
                          </td>

                          {/* Read-Only for General Users: Units */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                value={row.units || ""}
                                onChange={(e) => handleCellChange(idx, "units", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "units", e.target.value)}
                                className="w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition"
                              />
                            ) : (
                              <span className="text-gray-300 font-mono px-1">{row.units || "1"}</span>
                            )}
                          </td>

                          {/* Read-Only for General Users: Type */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                value={row.type || ""}
                                onChange={(e) => handleCellChange(idx, "type", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "type", e.target.value)}
                                className="w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition font-mono uppercase"
                              />
                            ) : (
                              <span className="text-gray-200 font-mono uppercase px-1">{row.type || "-"}</span>
                            )}
                          </td>

                          {/* Read-Only for General Users: Booking # */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                value={row.bookingNo || ""}
                                onChange={(e) => handleCellChange(idx, "bookingNo", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "bookingNo", e.target.value)}
                                className="w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition font-mono"
                              />
                            ) : (
                              <span className="text-gray-200 font-mono px-1">{row.bookingNo || "-"}</span>
                            )}
                          </td>

                          {/* Read-Only for General Users: Color-Coded Ex Grid */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                value={row.exGrid || ""}
                                onChange={(e) => handleCellChange(idx, "exGrid", e.target.value.toUpperCase())}
                                onBlur={(e) => handleCellBlur(idx, "exGrid", e.target.value.toUpperCase())}
                                className={`w-full font-bold px-2 py-1 rounded border text-xs text-center focus:outline-none transition font-mono uppercase ${gridColorStyle}`}
                              />
                            ) : (
                              <div className={`font-bold px-2 py-1 rounded border text-xs text-center font-mono uppercase ${gridColorStyle}`}>
                                {row.exGrid || "GRID"}
                              </div>
                            )}
                          </td>

                          {/* GENERAL USER EDITABLE: Ctn Released */}
                          <td className="py-2.5 px-3 bg-emerald-950/10">
                            <input
                              type="text"
                              value={row.ctnReleased || ""}
                              placeholder="Enter Ctn #"
                              onChange={(e) => handleCellChange(idx, "ctnReleased", e.target.value)}
                              onBlur={(e) => handleCellBlur(idx, "ctnReleased", e.target.value)}
                              className="w-full bg-gray-900/60 border border-emerald-900/50 focus:border-emerald-500 text-emerald-200 font-mono uppercase px-2 py-1 rounded transition"
                            />
                          </td>

                          {/* GENERAL USER EDITABLE: Truck ID */}
                          <td className="py-2.5 px-3 bg-emerald-950/10">
                            <input
                              type="text"
                              value={row.truckId || ""}
                              placeholder="Enter Truck ID"
                              onChange={(e) => handleCellChange(idx, "truckId", e.target.value)}
                              onBlur={(e) => handleCellBlur(idx, "truckId", e.target.value)}
                              className="w-full bg-gray-900/60 border border-emerald-900/50 focus:border-emerald-500 text-gray-100 font-mono uppercase px-2 py-1 rounded transition"
                            />
                          </td>

                          {/* GENERAL USER EDITABLE: Time (Auto-Populates, Editable Override) */}
                          <td className="py-2.5 px-3 bg-emerald-950/10">
                            <input
                              type="text"
                              maxLength={4}
                              placeholder="HHMM"
                              value={row.time || ""}
                              onChange={(e) => handleCellChange(idx, "time", e.target.value)}
                              onBlur={(e) => handleCellBlur(idx, "time", e.target.value)}
                              className="w-full bg-gray-900/60 border border-emerald-900/50 focus:border-emerald-500 text-amber-300 font-mono px-2 py-1 rounded transition"
                            />
                          </td>

                          {/* GENERAL USER EDITABLE: Doors Dropdown */}
                          <td className="py-2.5 px-3 bg-emerald-950/10">
                            <select
                              value={row.doors || "Forward"}
                              onChange={(e) => {
                                handleCellChange(idx, "doors", e.target.value);
                                handleCellBlur(idx, "doors", e.target.value);
                              }}
                              className="w-full bg-gray-950 border border-emerald-900/50 hover:border-emerald-700 text-gray-200 text-xs py-1 px-2 rounded focus:outline-none focus:border-emerald-500 transition"
                            >
                              {DOOR_OPTIONS.map((option) => (
                                <option key={option} value={option}>
                                  {option}
                                </option>
                              ))}
                            </select>
                          </td>

                          {/* GENERAL USER EDITABLE: Comments Modal Trigger */}
                          <td className="py-2.5 px-3 bg-emerald-950/10">
                            <div className="flex items-center justify-between gap-2">
                              <span
                                onClick={() => openCommentModal(idx, row.comment)}
                                className="text-xs text-gray-300 truncate max-w-[200px] cursor-pointer hover:text-white block"
                                title="Click to expand instructions"
                              >
                                {row.comment || <span className="text-gray-500 italic">+ Add instructions</span>}
                              </span>
                              <button
                                onClick={() => openCommentModal(idx, row.comment)}
                                className="text-emerald-400 hover:text-emerald-300 p-1"
                                title="Expand Instructions"
                              >
                                💬
                              </button>
                            </div>
                          </td>

                          {/* Admin Only Delete */}
                          {isAdmin && (
                            <td className="py-2.5 px-3 text-center">
                              <button
                                onClick={() => handleRemoveRow(idx)}
                                className="text-gray-500 hover:text-rose-400 transition"
                                title="Delete Line"
                              >
                                ✕
                              </button>
                            </td>
                          )}
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </main>

          {/* Comment Pop-out Modal */}
          {commentModal.isOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-6 w-full max-w-lg shadow-2xl">
                <h3 className="text-lg font-bold text-gray-100 mb-2">Special Instructions / Comments</h3>
                <p className="text-xs text-gray-400 mb-4">Line #{commentModal.rowIndex + 1}</p>
                <textarea
                  rows={6}
                  value={commentModal.text}
                  onChange={(e) => setCommentModal({ ...commentModal, text: e.target.value })}
                  className="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-gray-100 focus:outline-none focus:border-emerald-500 text-sm mb-4"
                  placeholder="Enter detailed special instructions..."
                  autoFocus
                />
                <div className="flex justify-end gap-3">
                  <button
                    onClick={() => setCommentModal({ isOpen: false, rowIndex: null, text: "" })}
                    className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm rounded-lg"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={saveCommentModal}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm rounded-lg"
                  >
                    Save Comment
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
