                    value={loginPin}
                    onChange={(e) => setLoginPin(e.target.value.replace(/[^0-9]/g, ""))}
                    placeholder="••••"
                    className="w-full bg-gray-950 border border-gray-800 focus:border-emerald-500 rounded-lg px-4 py-3 text-center text-2xl tracking-[0.6em] font-mono text-white focus:outline-none"
                  />
                </div>

                {loginError && (
                  <div className="bg-rose-950/60 border border-rose-800/70 text-rose-300 text-xs rounded-lg px-3.5 py-2.5">
                    {loginError}
                  </div>
                )}

                <button
                  type="submit"
                  className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-lg transition shadow-lg shadow-emerald-900/30 mt-2"
                >
                  Log In
                </button>
              </form>
            </div>
          </div>
        );
      }

      // =======================================================================
      // SCREEN 3: MAIN CONTAINER RELEASE WORKSPACE
      // =======================================================================
      const currentDayRows = (sheetData[activeDay] || []).filter((r) => isRowValid(r) || r.isNew);

      const matchesLogSearch = (log, q) => {
        if (!q) return true;
        const snap = log.lineSnapshot || {};
        return (
          (log.username && log.username.toLowerCase().includes(q)) ||
          (log.day && log.day.toLowerCase().includes(q)) ||
          (log.action && log.action.toLowerCase().includes(q)) ||
          (log.details && log.details.toLowerCase().includes(q)) ||
          (log.customer && log.customer.toLowerCase().includes(q)) ||
          (log.bookingNo && log.bookingNo.toLowerCase().includes(q)) ||
          (log.ctnReleased && log.ctnReleased.toLowerCase().includes(q)) ||
          (log.truckId && log.truckId.toLowerCase().includes(q)) ||
          (snap.customer && snap.customer.toLowerCase().includes(q)) ||
          (snap.bookingNo && snap.bookingNo.toLowerCase().includes(q)) ||
          (snap.ctnReleased && snap.ctnReleased.toLowerCase().includes(q)) ||
          (snap.truckId && snap.truckId.toLowerCase().includes(q)) ||
          (log.formattedTime && log.formattedTime.toLowerCase().includes(q))
        );
      };

      const filteredLogs = activityLogs.filter((log) => {
        if (!logSearchQuery.trim()) return true;
        return matchesLogSearch(log, logSearchQuery.toLowerCase());
      });

      const isGroupedViewActive = logSearchQuery.trim().length > 0 || forceGroupMode;

      const buildGroupedLogs = (logsArr) => {
        const groupsMap = new Map();
        logsArr.forEach((log) => {
          const snap = log.lineSnapshot || {};
          const booking = (snap.bookingNo || log.bookingNo || "").trim().toUpperCase();
          const customer = (snap.customer || log.customer || "").trim();
          const day = log.day || "General";

          let groupKey = "";
          let groupTitle = "";
          let groupSubtitle = "";

          if (booking || customer) {
            groupKey = `${day}::${booking || "NO-BKG"}::${customer.toLowerCase() || "no-cust"}`;
            groupTitle = booking ? `Booking # ${booking}` : customer;
            groupSubtitle = [customer && booking ? customer : "", day !== "All Days" && day !== "System" ? day : ""]
              .filter(Boolean)
              .join(" • ");
          } else {
            groupKey = `SYSTEM::${log.action}`;
            groupTitle = `${log.action} (${day})`;
            groupSubtitle = "System / Workbook Activity";
          }

          if (!groupsMap.has(groupKey)) {
            groupsMap.set(groupKey, {
              key: groupKey,
              title: groupTitle,
              subtitle: groupSubtitle,
              latestCtn: snap.ctnReleased || log.ctnReleased || "",
              latestGrid: snap.exGrid || "",
              logs: []
            });
          }
          const grp = groupsMap.get(groupKey);
          grp.logs.push(log);
          if (!grp.latestCtn && (snap.ctnReleased || log.ctnReleased)) {
            grp.latestCtn = snap.ctnReleased || log.ctnReleased;
          }
          if (!grp.latestGrid && snap.exGrid) {
            grp.latestGrid = snap.exGrid;
          }
        });
        return Array.from(groupsMap.values());
      };

      const groupedLogEntries = buildGroupedLogs(filteredLogs);

      const filteredWeeklyArchives = isAdmin
        ? weeklyLogArchives
            .filter((arch) =>
              selectedArchiveWeekFilter === "all"
                ? true
                : String(arch.weekStartMs) === selectedArchiveWeekFilter
            )
            .map((arch) => {
              const q = logSearchQuery.trim().toLowerCase();
              const matchingLogs = (arch.logs || []).filter((l) => matchesLogSearch(l, q));
              return {
                ...arch,
                matchingLogs
              };
            })
            .filter((arch) => (logSearchQuery.trim() ? arch.matchingLogs.length > 0 : true))
        : [];

      const renderFullLineLogCard = (log) => {
        const snap = log.lineSnapshot;
        const gridKey = snap && snap.exGrid ? snap.exGrid.trim().toUpperCase() : "";
        const gridColorStyle = GRID_COLOR_MAP[gridKey] || DEFAULT_GRID_STYLE;

        // Build lookup map of all edited fields in this combined entry
        const editedMap = new Map();
        if (Array.isArray(log.changes) && log.changes.length > 0) {
          log.changes.forEach((c) => {
            if (c && c.field) editedMap.set(c.field, c);
          });
        } else if (log.changedField) {
          editedMap.set(log.changedField, {
            field: log.changedField,
            oldVal: log.oldValue,
            newVal: log.newValue
          });
        }

        return (
          <div
            key={log.id}
            className="bg-gray-950/90 border border-gray-800 rounded-xl p-3.5 space-y-2.5"
          >
            <div className="flex flex-wrap items-center justify-between gap-2 text-xs">
              <div className="flex flex-wrap items-center gap-2">
                <span className="font-mono text-emerald-400 font-semibold">
                  {log.formattedTime}
                </span>
                <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800/60 font-semibold">
                  {log.username || "Unknown"}
                </span>
                <span className="px-2 py-0.5 rounded bg-gray-800 text-gray-300 font-medium">
                  {log.day} {log.lineNo !== "-" ? `Line #${log.lineNo}` : ""}
                </span>
                <span className="text-gray-200 font-medium">{log.details}</span>
              </div>
              <span className="text-[11px] px-2 py-0.5 rounded bg-gray-900 text-gray-400 border border-gray-800">
                {log.action}
              </span>
            </div>

            {snap && (
              <div className="grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-10 gap-1.5 pt-2 border-t border-gray-800/70">
                {SNAPSHOT_COLUMNS.map((col) => {
                  const changeRecord = editedMap.get(col.key);
                  const isEditedField = Boolean(changeRecord);
                  const cellVal = snap[col.key];

                  return (
                    <div
                      key={col.key}
                      className={`rounded-lg px-2 py-1.5 border text-xs transition ${
                        isEditedField
                          ? "bg-emerald-950/40 border-emerald-500/70 ring-1 ring-emerald-500/30"
                          : "bg-gray-900/70 border-gray-800/80"
                      }`}
                    >
                      <div className="text-[10px] uppercase tracking-wider text-gray-500 flex items-center justify-between">
                        <span>{col.label}</span>
                        {isEditedField && (
                          <span className="text-[9px] font-bold text-emerald-400">EDITED</span>
                        )}
                      </div>

                      {col.key === "exGrid" && cellVal ? (
                        <div className={`mt-0.5 inline-block px-1.5 py-0.2 rounded border text-[11px] font-bold font-mono uppercase ${gridColorStyle}`}>
                          {cellVal}
                        </div>
                      ) : (
                        <div
                          className={`mt-0.5 font-mono truncate ${
                            isEditedField
                              ? "text-emerald-200 font-semibold"
                              : cellVal
                              ? "text-gray-200"
                              : "text-gray-600 italic"
                          }`}
                          title={cellVal || "Empty"}
                        >
                          {cellVal || "—"}
                        </div>
                      )}

                      {isEditedField && (
                        <div className="text-[10px] text-amber-400/90 truncate mt-0.5" title={`Previous: ${changeRecord.oldVal || "Empty"}`}>
                          Was: {changeRecord.oldVal || "Empty"}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      };

      return (
        <div className="flex-1 flex flex-col">
          {/* Header Bar */}
          <header className="bg-gray-900 border-b border-gray-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                Container Release Sheet & Yard Grid Planner
              </h1>
              <div className="flex flex-wrap items-center gap-3 mt-1">
                {renderSyncBadge()}
                <span className="text-gray-600">|</span>
                <span className="text-xs text-gray-300">
                  Signed in as:{" "}
                  <span className="font-bold text-white">{currentUser.username}</span>{" "}
                  <span
                    className={`ml-1 px-2 py-0.5 rounded text-[10px] font-semibold uppercase ${
                      isAdmin
                        ? "bg-amber-950 text-amber-300 border border-amber-700/60"
                        : "bg-emerald-950 text-emerald-300 border border-emerald-700/60"
                    }`}
                  >
                    {currentUser.role}
                  </span>
                </span>
                {currentWorkbookName && (
                  <>
                    <span className="text-gray-600">|</span>
                    <span className="text-xs text-gray-400">
                      Active File: <span className="text-gray-200 font-mono">{currentWorkbookName}</span>
                    </span>
                  </>
                )}
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              {/* Admin Only: Manage Users Button */}
              {isAdmin && (
                <button
                  onClick={() => {
                    setUserMgmtMessage({ type: "", text: "" });
                    setIsUserModalOpen(true);
                  }}
                  className="px-3.5 py-2 bg-amber-950/60 hover:bg-amber-900/60 text-amber-200 text-sm font-medium rounded-lg border border-amber-700/60 transition flex items-center gap-2"
                >
                  <span>Manage Users ({users.length})</span>
                </button>
              )}

              {/* 7-Day Log & Admin Weekly Archives Button */}
              <button
                onClick={() => {
                  setLogModalTab("edits");
                  setIsLogModalOpen(true);
                }}
                className="px-3.5 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-medium rounded-lg border border-gray-700 transition flex items-center gap-2"
              >
                <span>7-Day Log</span>
                <span className="text-xs bg-gray-950 text-emerald-400 px-1.5 py-0.5 rounded border border-gray-800">
                  {activityLogs.length}
                </span>
                {isAdmin && weeklyLogArchives.length > 0 && (
                  <span
                    className="text-[10px] bg-purple-950 text-purple-300 px-1.5 py-0.5 rounded border border-purple-700/60 font-semibold"
                    title="Admin Weekly Log Archives Available"
                  >
                    {weeklyLogArchives.length}W Archive
                  </span>
                )}
              </button>

              {/* Import Button Available for ALL Users */}
              <input
                type="file"
                ref={fileInputRef}
                onChange={handleImportExcel}
                accept=".xlsx"
                className="hidden"
              />
              <button
                onClick={() => fileInputRef.current.click()}
                className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-medium rounded-lg border border-gray-700 transition flex items-center gap-2"
              >
                <span>Import Master (.xlsx)</span>
              </button>

              {/* Export Button */}
              <button
                onClick={handleExportExcel}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium rounded-lg transition shadow-lg shadow-emerald-900/20 flex items-center gap-2"
              >
                <span>Export Master (.xlsx)</span>
              </button>

              {/* Log Out Button */}
              <button
                onClick={handleLogout}
                className="px-3.5 py-2 bg-gray-950 hover:bg-gray-800 text-gray-400 hover:text-white text-sm font-medium rounded-lg border border-gray-800 transition"
              >
                Log Out
              </button>
            </div>
          </header>

          {/* Notice Banner */}
          <div className="bg-amber-950/40 border-b border-amber-800/50 px-6 py-2.5 flex items-center justify-between text-amber-200 text-sm">
            <div className="flex items-center gap-2 flex-1">
              <span className="font-semibold uppercase tracking-wider text-xs bg-amber-900/60 text-amber-300 px-2 py-0.5 rounded border border-amber-700/50">Notice</span>
              {isEditingNotice && isAdmin ? (
                <input
                  type="text"
                  value={tempNotice}
                  onChange={(e) => setTempNotice(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") {
                      setNotification(tempNotice);
                      setIsEditingNotice(false);
                      persistState({ notification: tempNotice });
                    }
                  }}
                  className="bg-gray-900 text-amber-100 px-3 py-1 rounded border border-amber-700 text-sm w-full focus:outline-none"
                  autoFocus
                />
              ) : (
                <span>{notification || "GXT/SH Won't be added to release sheet. Domestic should Email to Release Mtys."}</span>
              )}
            </div>
            {isAdmin && (
              <button
                onClick={() => {
                  if (isEditingNotice) {
                    setNotification(tempNotice);
                    setIsEditingNotice(false);
                    persistState({ notification: tempNotice });
                  } else {
                    setTempNotice(notification || "GXT/SH Won't be added to release sheet. Domestic should Email to Release Mtys.");
                    setIsEditingNotice(true);
                  }
                }}
                className="text-xs text-amber-400 hover:text-amber-300 underline ml-4 whitespace-nowrap"
              >
                {isEditingNotice ? "Save" : "Edit Notice"}
              </button>
            )}
          </div>

          {/* Day Navigation Tabs */}
          <nav className="bg-gray-900/80 border-b border-gray-800 px-6 flex items-center gap-1 overflow-x-auto">
            {DAYS.map((day) => {
              const active = activeDay === day;
              const count = (sheetData[day] || []).filter(isRowValid).length;
              return (
                <button
                  key={day}
                  onClick={() => setActiveDay(day)}
                  className={`px-5 py-3 text-sm font-medium border-b-2 transition flex items-center gap-2 whitespace-nowrap ${
                    active
                      ? "border-emerald-500 text-emerald-400 bg-gray-800/50"
                      : "border-transparent text-gray-400 hover:text-gray-200 hover:bg-gray-800/30"
                  }`}
                >
                  {day}
                  <span className={`text-xs px-2 py-0.5 rounded-full ${active ? "bg-emerald-950 text-emerald-300 border border-emerald-800" : "bg-gray-800 text-gray-400"}`}>
                    {count}
                  </span>
                </button>
              );
            })}
          </nav>

          {/* Table Workspace */}
          <main className="flex-1 p-6 flex flex-col overflow-hidden">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div className="flex items-center gap-3">
                <h2 className="text-lg font-semibold text-gray-200">{activeDay} Schedule</h2>
                <span className="text-xs text-gray-400 flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-rose-500 inline-block"></span>
                  Lines highlighted red are actively being typed in (5s live lock)
                </span>
              </div>
              {isAdmin && (
                <button
                  onClick={handleAddRow}
                  className="px-3.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-100 text-sm font-medium rounded-md border border-gray-700 transition flex items-center gap-1.5"
                >
                  + Add Line
                </button>
              )}
            </div>

            <div className="flex-1 border border-gray-800 rounded-lg overflow-auto bg-gray-900/40">
              <table className="w-full text-left border-collapse min-w-[1200px]">
                <thead>
                  <tr className="bg-gray-900 text-gray-400 text-xs font-semibold uppercase border-b border-gray-800 sticky top-0 z-10">
                    <th className="py-3 px-3 w-12 text-center">#</th>
                    <th className="py-3 px-3">Customer</th>
                    <th className="py-3 px-3 w-20"># Units</th>
                    <th className="py-3 px-3 w-24">Type</th>
                    <th className="py-3 px-3">Booking #</th>
                    <th className="py-3 px-3 w-32">Ex Grid</th>
                    <th className="py-3 px-3 bg-emerald-950/30 text-emerald-300">Ctn # Released</th>
                    <th className="py-3 px-3 bg-emerald-950/30 text-emerald-300">Truck ID</th>
                    <th className="py-3 px-3 w-28 bg-emerald-950/30 text-emerald-300">Time (HHmm)</th>
                    <th className="py-3 px-3 w-36 bg-emerald-950/30 text-emerald-300">Doors</th>
                    <th className="py-3 px-3 min-w-[200px] bg-emerald-950/30 text-emerald-300">Comments</th>
                    {isAdmin && <th className="py-3 px-3 w-12 text-center">Actions</th>}
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-800/60 text-sm">
                  {currentDayRows.length === 0 ? (
                    <tr>
                      <td colSpan={isAdmin ? 12 : 11} className="py-12 text-center text-gray-500">
                        No active records for {activeDay}. Click "Import Master (.xlsx)" to load a schedule.
                      </td>
                    </tr>
                  ) : (
                    currentDayRows.map((row, idx) => {
                      const isDragged = draggedRowIndex === idx;
                      const isDragOver = dragOverRowIndex === idx;
                      const gridKey = (row.exGrid || "").toString().trim().toUpperCase();
                      const gridColorStyle = GRID_COLOR_MAP[gridKey] || DEFAULT_GRID_STYLE;

                      const lockStatus = getRowLockStatus(activeDay, row, idx);
                      const rowRedHighlightClass = lockStatus.isLocked
                        ? "bg-rose-950/75 ring-1 ring-inset ring-rose-500/80"
                        : "hover:bg-gray-800/40";

                      return (
                        <tr
                          key={row.rowId || idx}
                          draggable={isAdmin && !lockStatus.isLockedByOther}
                          onDragStart={(e) => handleDragStart(e, idx)}
                          onDragOver={(e) => handleDragOver(e, idx)}
                          onDrop={(e) => handleDrop(e, idx)}
                          className={`transition-colors duration-200 ${rowRedHighlightClass} ${
                            isDragged ? "opacity-30 bg-gray-800" : ""
                          } ${isDragOver ? "border-t-2 border-emerald-500 bg-emerald-950/20" : ""}`}
                        >
                          {/* Line Number + Live 5s Lock Badge */}
                          <td className="py-2.5 px-3 text-center text-gray-400 font-mono text-xs select-none">
                            <div>{idx + 1}</div>
                            {lockStatus.isLocked && (
                              <div
                                className="mt-1 inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-rose-600 text-white text-[10px] font-bold whitespace-nowrap shadow"
                                title={
                                  lockStatus.isLockedByOther
                                    ? `Read-only while ${lockStatus.username} is entering data`
                                    : "Active typing window (5s)"
                                }
                              >
                                <span>{lockStatus.username}</span>
                                <span>• {lockStatus.remainingSec}s</span>
                              </div>
                            )}
                          </td>

                          {/* Customer */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                readOnly={lockStatus.isLockedByOther}
                                value={row.customer || ""}
                                onFocus={() => handleRowFocus(activeDay, row, idx)}
                                onChange={(e) => handleCellChange(idx, "customer", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "customer", e.target.value)}
                                className={`w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition ${
                                  lockStatus.isLockedByOther ? "cursor-not-allowed opacity-75" : ""
                                }`}
                              />
                            ) : (
                              <span className="text-gray-200 font-medium px-1">{row.customer || "-"}</span>
                            )}
                          </td>

                          {/* Units */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                readOnly={lockStatus.isLockedByOther}
                                value={row.units || ""}
                                onFocus={() => handleRowFocus(activeDay, row, idx)}
                                onChange={(e) => handleCellChange(idx, "units", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "units", e.target.value)}
                                className={`w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition ${
                                  lockStatus.isLockedByOther ? "cursor-not-allowed opacity-75" : ""
                                }`}
                              />
                            ) : (
                              <span className="text-gray-300 font-mono px-1">{row.units || "1"}</span>
                            )}
                          </td>

                          {/* Type */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                readOnly={lockStatus.isLockedByOther}
                                value={row.type || ""}
                                onFocus={() => handleRowFocus(activeDay, row, idx)}
                                onChange={(e) => handleCellChange(idx, "type", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "type", e.target.value)}
                                className={`w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition font-mono uppercase ${
                                  lockStatus.isLockedByOther ? "cursor-not-allowed opacity-75" : ""
                                }`}
                              />
                            ) : (
                              <span className="text-gray-200 font-mono uppercase px-1">{row.type || "-"}</span>
                            )}
                          </td>

                          {/* Booking # */}
                          <td className="py-2.5 px-3">
                            {isAdmin ? (
                              <input
                                type="text"
                                readOnly={lockStatus.isLockedByOther}
                                value={row.bookingNo || ""}
                                onFocus={() => handleRowFocus(activeDay, row, idx)}
                                onChange={(e) => handleCellChange(idx, "bookingNo", e.target.value)}
                                onBlur={(e) => handleCellBlur(idx, "bookingNo", e.target.value)}
                                className={`w-full bg-transparent border-b border-transparent hover:border-gray-700 focus:border-emerald-500 text-gray-100 focus:outline-none px-1 py-0.5 rounded transition font-mono ${
                                  lockStatus.isLockedByOther ? "cursor-not-allowed opacity-75" : ""
                                }`}

            <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
              <div className="bg-gray-900 border border-gray-800 rounded-xl w-full max-w-6xl max-h-[88vh] flex flex-col shadow-2xl">
                <div className="px-6 py-4 border-b border-gray-800 flex items-center justify-between">
                  <div>
                    <h3 className="text-lg font-bold text-white">
                      {logModalTab === "admin-archives" && isAdmin
                        ? "Admin Weekly Log Archives (Monday-to-Sunday Backups)"
                        : "7-Day Activity Log & Weekly Snapshots"}
                    </h3>
                    <p className="text-xs text-gray-400">
                      {logModalTab === "admin-archives" && isAdmin
                        ? "Restricted to Admin users. Logs are automatically backed up in Monday-to-Sunday weekly bundles so past weeks remain searchable."
                        : "Fields entered by the same user across one line combine into a single entry; edits by other users or return edits appear separately."}
                    </p>
                  </div>
                  <button
                    onClick={() => setIsLogModalOpen(false)}
                    className="text-gray-400 hover:text-white text-lg px-2"
                  >
                    ✕
                  </button>
                </div>

                <div className="px-6 py-3 bg-gray-950/60 border-b border-gray-800 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      onClick={() => setLogModalTab("edits")}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                        logModalTab === "edits"
                          ? "bg-emerald-600 text-white"
                          : "bg-gray-800 text-gray-400 hover:text-gray-200"
                      }`}
                    >
                      Edit History ({activityLogs.length})
                    </button>
                    <button
                      onClick={() => setLogModalTab("snapshots")}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                        logModalTab === "snapshots"
                          ? "bg-amber-600 text-white"
                          : "bg-gray-800 text-gray-400 hover:text-gray-200"
                      }`}
                    >
                      Import Backups ({importSnapshots.length})
                    </button>

                    {/* ADMIN ONLY TAB: Weekly Log Archives (Monday Start) */}
                    {isAdmin && (
                      <button
                        onClick={() => setLogModalTab("admin-archives")}
                        className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 border ${
                          logModalTab === "admin-archives"
                            ? "bg-purple-600 text-white border-purple-400"
                            : "bg-purple-950/60 text-purple-200 border-purple-700/60 hover:bg-purple-900/60"
                        }`}
                      >
                        <span>Admin Weekly Archives ({weeklyLogArchives.length})</span>
                      </button>
                    )}
                  </div>

                  {(logModalTab === "edits" || (logModalTab === "admin-archives" && isAdmin)) && (
                    <div className="flex flex-wrap items-center gap-2">
                      {logModalTab === "admin-archives" && isAdmin && (
                        <>
                          <select
                            value={selectedArchiveWeekFilter}
                            onChange={(e) => setSelectedArchiveWeekFilter(e.target.value)}
                            className="bg-gray-900 border border-purple-700/60 focus:border-purple-400 rounded-lg px-2.5 py-1.5 text-xs text-purple-100 focus:outline-none"
                          >
                            <option value="all">All Archived Weeks ({weeklyLogArchives.length})</option>
                            {weeklyLogArchives.map((arch) => (
                              <option key={arch.id} value={String(arch.weekStartMs)}>
                                {arch.weekLabel} ({arch.logs ? arch.logs.length : 0})
                              </option>
                            ))}
                          </select>

                          <button
                            type="button"
                            onClick={handleBackupCurrentWeekNow}
                            className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-purple-700 hover:bg-purple-600 text-white transition"
                            title="Immediately save a backup snapshot of this week's logs"
                          >
                            + Snapshot Current Week
                          </button>
                        </>
                      )}

                      <button
                        type="button"
                        onClick={() => setForceGroupMode(!forceGroupMode)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition ${
                          isGroupedViewActive
                            ? "bg-emerald-950/70 text-emerald-300 border-emerald-700/60"
                            : "bg-gray-900 text-gray-400 border-gray-700 hover:text-gray-200"
                        }`}
                      >
                        {isGroupedViewActive ? "Grouped View: ON" : "Group by Booking/Customer"}
                      </button>

                      <div className="relative flex items-center">
                        <input
                          type="text"
                          value={logSearchQuery}
                          onChange={(e) => setLogSearchQuery(e.target.value)}
                          placeholder="Search Booking #, Customer, User, Ctn #..."
                          className="bg-gray-900 border border-gray-700 focus:border-emerald-500 rounded-lg px-3 py-1.5 text-xs text-gray-100 w-64 sm:w-72 focus:outline-none pr-7"
                        />
                        {logSearchQuery && (
                          <button
                            onClick={() => setLogSearchQuery("")}
                            className="absolute right-2 text-gray-400 hover:text-white text-xs"
                            title="Clear search"
                          >
                            ✕
                          </button>
                        )}
                      </div>
                    </div>
                  )}
                </div>

                <div className="flex-1 overflow-auto p-6">
                  {logModalTab === "admin-archives" && isAdmin ? (
                    <div className="space-y-5">
                      {archiveFlashMessage && (
                        <div className="bg-purple-950/70 border border-purple-700/70 text-purple-200 text-xs rounded-lg px-4 py-2.5">
                          {archiveFlashMessage}
                        </div>
                      )}

                      {filteredWeeklyArchives.length === 0 ? (
                        <div className="text-center py-12 text-gray-400 text-sm space-y-2">
                          <p>
                            {logSearchQuery.trim()
                              ? "No archived weekly log entries matched your search."
                              : "No completed Monday-to-Sunday weekly log archives stored yet."}
                          </p>
                          <p className="text-xs text-gray-500">
                            Every Monday, the previous week's logs are automatically backed up here—or click "+ Snapshot Current Week" above to archive this week right now.
                          </p>
                        </div>
                      ) : (
                        filteredWeeklyArchives.map((arch) => {
                          const displayLogs = arch.matchingLogs || [];
                          const groupedArchiveLogs = isGroupedViewActive
                            ? buildGroupedLogs(displayLogs)
                            : [];

                          return (
                            <div
                              key={arch.id}
                              className="bg-gray-900/80 border border-purple-800/50 rounded-xl overflow-hidden shadow-xl"
                            >
                              <div className="bg-purple-950/40 px-4 py-3 border-b border-purple-800/50 flex flex-wrap items-center justify-between gap-3">
                                <div className="flex flex-wrap items-center gap-2.5">
                                  <span className="px-2 py-0.5 rounded bg-purple-700 text-white text-[10px] font-bold uppercase">
                                    Admin Archive
                                  </span>
                                  <span className="text-sm font-bold text-white">
                                    {arch.weekLabel}
                                  </span>
                                  <span className="text-xs bg-gray-950 text-purple-300 border border-purple-800/60 px-2.5 py-0.5 rounded-full font-mono">
                                    {displayLogs.length} {displayLogs.length === 1 ? "Entry" : "Entries"}
                                  </span>
                                  {arch.backupNote && (
                                    <span className="text-[11px] text-gray-400">
                                      • {arch.backupNote}
                                    </span>
                                  )}
                                </div>

                                <div className="flex items-center gap-2">
                                  <button
                                    type="button"
                                    onClick={() => handleDownloadArchiveCsv(arch)}
                                    className="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-emerald-300 text-xs font-semibold rounded border border-gray-700 transition"
                                  >
                                    Export CSV
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => handleDeleteWeeklyArchive(arch.weekStartMs)}
                                    className="px-2.5 py-1 bg-rose-950/50 hover:bg-rose-900/60 text-rose-300 text-xs rounded border border-rose-800/50 transition"
                                    title="Delete this weekly archive"
                                  >
                                    Delete
                                  </button>
                                </div>
                              </div>

                              <div className="p-4 space-y-3">
                                {isGroupedViewActive
                                  ? groupedArchiveLogs.map((group) => (
                                      <div
                                        key={group.key}
                                        className="bg-gray-950/70 border border-gray-800 rounded-xl overflow-hidden"
                                      >
                                        <div className="bg-gray-800/60 px-4 py-2.5 border-b border-gray-800 flex flex-wrap items-center justify-between gap-2">
                                          <div className="flex flex-wrap items-center gap-2">
                                            <span className="text-xs font-bold text-white">
                                              {group.title}
                                            </span>
                                            {group.subtitle && (
                                              <span className="text-xs text-gray-400">
                                                ({group.subtitle})
                                              </span>
                                            )}
                                            {group.latestCtn && (
                                              <span className="text-[11px] font-mono px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800/60">
                                                Ctn: {group.latestCtn}
                                              </span>
                                            )}
                                          </div>
                                          <span className="text-[11px] font-mono text-gray-400">
                                            {group.logs.length} {group.logs.length === 1 ? "Edit" : "Edits"}
                                          </span>
                                        </div>
                                        <div className="p-3 space-y-2">
                                          {group.logs.map((log) => renderFullLineLogCard(log))}
                                        </div>
                                      </div>
                                    ))
                                  : displayLogs.map((log) => renderFullLineLogCard(log))}
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  ) : logModalTab === "edits" ? (
                    filteredLogs.length === 0 ? (
                      <div className="text-center py-12 text-gray-500 text-sm">
                        No log entries found matching your filter within the last 7 days.
                      </div>
                    ) : isGroupedViewActive ? (
                      <div className="space-y-5">
                        {groupedLogEntries.map((group) => (
                          <div
                            key={group.key}
                            className="bg-gray-900/70 border border-gray-800 rounded-xl overflow-hidden shadow-lg"
                          >
                            <div className="bg-gray-800/70 px-4 py-3 border-b border-gray-800 flex flex-wrap items-center justify-between gap-2">
                              <div className="flex flex-wrap items-center gap-2.5">
                                <span className="text-sm font-bold text-white">
                                  {group.title}
                                </span>
                                {group.subtitle && (
                                  <span className="text-xs text-gray-300">
                                    ({group.subtitle})
                                  </span>
                                )}
                                {group.latestCtn && (
                                  <span className="text-xs font-mono px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800/60">
                                    Ctn: {group.latestCtn}
                                  </span>
                                )}
                                {group.latestGrid && (
                                  <span
                                    className={`text-xs font-mono font-bold px-2 py-0.5 rounded border uppercase ${
                                      GRID_COLOR_MAP[group.latestGrid.toUpperCase()] || DEFAULT_GRID_STYLE
                                    }`}
                                  >
                                    {group.latestGrid}
                                  </span>
                                )}
                              </div>
                              <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-gray-950 text-emerald-400 border border-gray-700">
                                {group.logs.length} {group.logs.length === 1 ? "Edit" : "Edits"}
                              </span>
                            </div>

                            <div className="p-3.5 space-y-2.5">
                              {group.logs.map((log) => renderFullLineLogCard(log))}
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="space-y-3">
                        {filteredLogs.map((log) => renderFullLineLogCard(log))}
                      </div>
                    )
                  ) : importSnapshots.length === 0 ? (
                    <div className="text-center py-12 text-gray-500 text-sm">
                      No backup snapshots stored yet. Whenever an Excel sheet is imported, the previous sheet is automatically backed up here for 7 days.
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {importSnapshots.map((snap) => (
                        <div
                          key={snap.id}
                          className="bg-gray-950/80 border border-gray-800 rounded-lg p-4 flex flex-wrap items-center justify-between gap-4"
                        >
                          <div className="space-y-1">
                            <div className="flex flex-wrap items-center gap-2.5">
                              <span className="text-sm font-bold text-white font-mono">
                                {snap.sheetName || "Previous Release Sheet"}
                              </span>
                              <span className="font-mono text-xs bg-amber-950/70 text-amber-300 border border-amber-800/50 px-2.5 py-0.5 rounded font-semibold">
                                {snap.formattedTime}
                              </span>
                              <span className="text-xs bg-gray-800 text-gray-300 px-2 py-0.5 rounded">
                                {snap.rowCount} Total Lines
                              </span>
                            </div>
                            <p className="text-xs text-gray-400">
                              {snap.label} {snap.importedBy ? `by ${snap.importedBy}` : ""}
                            </p>
                          </div>
                          <button
                            onClick={() => handleRestoreSnapshot(snap)}
                            className="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded-lg transition"
                          >
                            Restore This Sheet
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div className="px-6 py-3 border-t border-gray-800 flex justify-end">
                  <button
                    onClick={() => setIsLogModalOpen(false)}
                    className="px-4 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm rounded-lg"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
