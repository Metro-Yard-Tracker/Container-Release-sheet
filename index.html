<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empty Container Release Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        @keyframes pulse-red {
            0%, 100% { background-color: rgba(239, 68, 68, 0.2); }
            50% { background-color: rgba(239, 68, 68, 0.6); }
        }
        .row-highlight {
            animation: pulse-red 1s ease-in-out 3;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyD-PlaceholderKey-ChangeMeForProduction",
            authDomain: "empty-container-tracker.firebaseapp.com",
            databaseURL: "https://empty-container-tracker-default-rtdb.firebaseio.com",
            projectId: "empty-container-tracker",
            storageBucket: "empty-container-tracker.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const DAYS_OF_WEEK = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const DOOR_OPTIONS = ['REAR', 'FRONT', 'PASSENGER', 'DRIVERS', 'ANY'];

        function formatTo24Hour(val) {
            if (!val) return '';
            const s = String(val).trim();
            const clean = s.replace(/[^0-9]/g, '');
            if (clean.length === 4) return clean;
            if (clean.length === 3) return '0' + clean;
            return s;
        }

        function App() {
            const [activeTab, setActiveTab] = useState('Monday');
            const [isAdmin, setIsAdmin] = useState(false);
            const [adminPinModal, setAdminPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [adminPins, setAdminPins] = useState(['1234', '9999']);
            const [releaseData, setReleaseData] = useState({
                Monday: [], Tuesday: [], Wednesday: [], Thursday: [], Friday: [], Saturday: [], Sunday: []
            });
            const [highlightedRowId, setHighlightedRowId] = useState(null);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            const [commentModal, setCommentModal] = useState({ show: false, text: '', rowId: null });
            const [searchQuery, setSearchQuery] = useState('');

            const triggerToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3500);
            };

            useEffect(() => {
                const dataRef = db.ref('releaseTrackerData');
                dataRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val && val.sheets) {
                        setReleaseData(val.sheets);
                    }
                    if (val && val.highlightedRowId) {
                        setHighlightedRowId(val.highlightedRowId);
                        setTimeout(() => setHighlightedRowId(null), 4000);
                    }
                });

                const pinRef = db.ref('releaseTrackerPins');
                pinRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val && Array.isArray(val)) {
                        setAdminPins(val);
                    }
                });

                return () => {
                    dataRef.off();
                    pinRef.off();
                };
            }, []);

            const saveToFirebase = (newSheets, newHighlight = null) => {
                const payload = { sheets: newSheets };
                if (newHighlight) payload.highlightedRowId = newHighlight;
                db.ref('releaseTrackerData').set(payload);
            };

            // Robust Excel File Import handling daily sheets
        const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const importedData = { ...releaseData };
                    let totalImportedCount = 0;

                    wb.SheetNames.forEach(sheetName => {
                        const matchedDay = DAYS_OF_WEEK.find(d => d.toLowerCase() === sheetName.toLowerCase()) || sheetName;
                        const ws = wb.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(ws, { header: 1 });

                        if (json.length > 0) {
                            const rows = [];
                            
                            // Start reading strictly at row index 3 (Excel Row 4 where actual data begins)
                            // Rows 0, 1, 2 are title banners and headers.
                            const startIndex = Math.min(3, json.length);

                            for (let i = startIndex; i < json.length; i++) {
                                const r = json[i];
                                if (!r || r.length === 0) continue;

                                const customerVal = String(r[1] || '').trim();
                                const bookingVal = String(r[4] || '').trim();
                                
                                // Skip completely empty rows
                                if (!customerVal && !bookingVal) continue;
                                
                                // Skip any accidental header repetition
                                const lowerCust = customerVal.toLowerCase();
                                if (lowerCust.includes('customer') || lowerCust.includes('line #') || lowerCust.includes('00:01')) {
                                    continue;
                                }

                                const ctnVal = String(r[6] || '').trim();
                                rows.push({
                                    id: `imp_${matchedDay}_${i}_${Date.now()}`,
                                    lineNum: rows.length + 1,
                                    customer: customerVal,
                                    units: Number(r[2]) || 1,
                                    type: String(r[3] || '20GP').trim(),
                                    booking: bookingVal,
                                    exGrid: String(r[5] || '').trim(),
                                    ctnReleased: ctnVal,
                                    truckId: String(r[7] || '').trim(),
                                    time: formatTo24Hour(r[8]),
                                    doors: DOOR_OPTIONS.includes(String(r[9]).toUpperCase()) ? String(r[9]).toUpperCase() : 'ANY',
                                    comments: String(r[10] || '').trim(),
                                    status: ctnVal ? 'Released' : 'Pending'
                                });
                                totalImportedCount++;
                            }
                            importedData[matchedDay] = rows;
                        }
                    });

                    setReleaseData(importedData);
                    saveToFirebase(importedData);
                    triggerToast(`Successfully imported ${totalImportedCount} bookings!`, 'success');
                    e.target.value = '';
                } catch (err) {
                    console.error("Excel parse error:", err);
                    triggerToast('Failed to parse Excel workbook.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        const handleExportExcel = () => {
                try {
                    const wb = XLSX.utils.book_new();
                    DAYS_OF_WEEK.forEach(day => {
                        const dayRows = releaseData[day] || [];
                        const aoa = [
                            ["00:01 TO 23:59"],
                            [],
                            ["Line #", "Customer", "Units", "Type", "Booking #", "Ex Grid", "Ctn # Released", "Truck ID", "Time (24h)", "Doors", "Comments", "Status"]
                        ];
                        dayRows.forEach((r, idx) => {
                            aoa.push([
                                idx + 1,
                                r.customer,
                                r.units,
                                r.type,
                                r.booking,
                                r.exGrid,
                                r.ctnReleased,
                                r.truckId,
                                r.time,
                                r.doors,
                                r.comments,
                                r.status
                            ]);
                        });
                        const ws = XLSX.utils.aoa_to_sheet(aoa);
                        XLSX.utils.book_append_sheet(wb, ws, day);
                    });
                    XLSX.writeFile(wb, `Container_Release_Schedule_${new Date().toISOString().slice(0,10)}.xlsx`);
                    triggerToast('Workbook exported successfully', 'success');
                } catch (e) {
                    console.error(e);
                    triggerToast('Export failed', 'error');
                }
            };

            const handleFieldChange = (rowId, field, value) => {
                const currentRows = releaseData[activeTab] || [];
                const updatedRows = currentRows.map(row => {
                    if (row.id === rowId) {
                        const updated = { ...row, [field]: value };
                        if (field === 'doors' && value && value !== 'ANY' && !updated.time) {
                            const now = new Date();
                            const hh = String(now.getHours()).padStart(2, '0');
                            const mm = String(now.getMinutes()).padStart(2, '0');
                            updated.time = hh + mm;
                        }
                        if (field === 'ctnReleased') {
                            updated.status = value.trim() ? 'Released' : 'Pending';
                        }
                        return updated;
                    }
                    return row;
                });

                const newSheets = { ...releaseData, [activeTab]: updatedRows };
                setReleaseData(newSheets);
                saveToFirebase(newSheets, rowId);
            };

            const handleAddRow = () => {
                if (!isAdmin) {
                    triggerToast('Admin mode required to add new rows', 'error');
                    return;
                }
                const currentRows = releaseData[activeTab] || [];
                const newRow = {
                    id: `row_${Date.now()}`,
                    lineNum: currentRows.length + 1,
                    customer: '',
                    units: 1,
                    type: '20GP',
                    booking: '',
                    exGrid: '',
                    ctnReleased: '',
                    truckId: '',
                    time: '',
                    doors: 'ANY',
                    comments: '',
                    status: 'Pending'
                };
                const newSheets = { ...releaseData, [activeTab]: [...currentRows, newRow] };
                setReleaseData(newSheets);
                saveToFirebase(newSheets);
                triggerToast('New booking row added', 'success');
            };

            const handleDeleteRow = (rowId) => {
                if (!isAdmin) {
                    triggerToast('Admin mode required to delete rows', 'error');
                    return;
                }
                if (!confirm('Are you sure you want to delete this row?')) return;
                const currentRows = releaseData[activeTab] || [];
                const updatedRows = currentRows.filter(r => r.id !== rowId).map((r, idx) => ({ ...r, lineNum: idx + 1 }));
                const newSheets = { ...releaseData, [activeTab]: updatedRows };
                setReleaseData(newSheets);
                saveToFirebase(newSheets);
                triggerToast('Row deleted', 'success');
            };

            const verifyAdminPin = () => {
                if (adminPins.includes(pinInput.trim())) {
                    setIsAdmin(true);
                    setAdminPinModal(false);
                    setPinInput('');
                    triggerToast('Admin mode unlocked successfully!', 'success');
                } else {
                    triggerToast('Invalid PIN', 'error');
                }
            };

            const currentRows = (releaseData[activeTab] || []).filter(r => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                return (
                    (r.customer && r.customer.toLowerCase().includes(q)) ||
                    (r.booking && r.booking.toLowerCase().includes(q)) ||
                    (r.ctnReleased && r.ctnReleased.toLowerCase().includes(q)) ||
                    (r.truckId && r.truckId.toLowerCase().includes(q))
                );
            });

            return (
                <div className="w-full max-w-[1920px] mx-auto p-4 md:p-6">
                    {toast.show && (
                        <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl text-white font-medium flex items-center space-x-2 transition-all duration-300 ${toast.type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`}>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    <header className="flex flex-col md:flex-row justify-between items-center bg-slate-800/90 backdrop-blur border border-slate-700/60 p-4 rounded-2xl shadow-xl mb-6 gap-4">
                        <div className="flex items-center space-x-3">
                            <div className="bg-emerald-500/20 text-emerald-400 p-3 rounded-xl">
                                <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight text-white">Empty Container Release Tracker</h1>
                                <p className="text-sm text-slate-400">Live synchronized yard gate operations & dispatch schedule</p>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-3">
                            <div className="relative">
                                <input
                                    type="text"
                                    placeholder="Search customer, booking, ctn..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 w-64"
                                />
                            </div>

                            <label className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-sm font-medium cursor-pointer transition shadow flex items-center space-x-2">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                <span>Import Excel</span>
                                <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="hidden" />
                            </label>

                            <button onClick={handleExportExcel} className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow flex items-center space-x-2">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                <span>Export</span>
                            </button>

                            {isAdmin ? (
                                <button onClick={() => { setIsAdmin(false); triggerToast('Locked back to standard user mode', 'success'); }} className="bg-rose-500/20 text-rose-400 border border-rose-500/40 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2">
                                    <span>Admin Mode ON</span>
                                </button>
                            ) : (
                                <button onClick={() => setAdminPinModal(true)} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow flex items-center space-x-2">
                                    <span>Admin Unlock</span>
                                </button>
                            )}
                        </div>
                    </header>

                    <div className="flex overflow-x-auto space-x-2 pb-3 mb-6 scrollbar-thin">
                        {DAYS_OF_WEEK.map(day => {
                            const count = (releaseData[day] || []).length;
                            const isActive = activeTab === day;
                            return (
                                <button
                                    key={day}
                                    onClick={() => setActiveTab(day)}
                                    className={`px-5 py-3 rounded-xl font-semibold text-sm transition-all whitespace-nowrap flex items-center space-x-2 shadow-md ${isActive ? 'bg-emerald-600 text-white shadow-emerald-900/40' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                                >
                                    <span>{day}</span>
                                    <span className={`text-xs px-2 py-0.5 rounded-full ${isActive ? 'bg-emerald-700 text-emerald-100' : 'bg-slate-700 text-slate-400'}`}>{count}</span>
                                </button>
                            );
                        })}
                    </div>

                    <div className="bg-slate-800/80 backdrop-blur border border-slate-700/80 rounded-2xl shadow-2xl overflow-hidden">
                        <div className="p-4 bg-slate-800/90 border-b border-slate-700 flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white flex items-center space-x-2">
                                <span>Active Schedule: <span className="text-emerald-400">{activeTab}</span></span>
                            </h2>
                            {isAdmin && (
                                <button onClick={handleAddRow} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow">
                                    + Add New Booking Row
                                </button>
                            )}
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[1400px]">
                                <thead>
                                    <tr className="bg-slate-900/90 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                                        <th className="py-3.5 px-3 w-16 text-center">Line #</th>
                                        <th className="py-3.5 px-3 w-48">Customer</th>
                                        <th className="py-3.5 px-3 w-20 text-center">Units</th>
                                        <th className="py-3.5 px-3 w-28">Type</th>
                                        <th className="py-3.5 px-3 w-40">Booking #</th>
                                        <th className="py-3.5 px-3 w-32">Ex Grid</th>
                                        <th className="py-3.5 px-3 w-52">Ctn # Released</th>
                                        <th className="py-3.5 px-3 w-44">Truck ID</th>
                                        <th className="py-3.5 px-3 w-36">Time (24h)</th>
                                        <th className="py-3.5 px-3 w-36">Doors</th>
                                        <th className="py-3.5 px-3 w-48">Comments</th>
                                        <th className="py-3.5 px-3 w-32 text-center">Status</th>
                                        {isAdmin && <th className="py-3.5 px-3 w-16 text-center">Actions</th>}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700/60 text-sm">
                                    {currentRows.length === 0 ? (
                                        <tr>
                                            <td colSpan="13" className="text-center py-12 text-slate-500">
                                                No container release records found for {activeTab}. Upload an Excel file or add a row to get started.
                                            </td>
                                        </tr>
                                    ) : (
                                        currentRows.map((row, index) => {
                                            const isHighlighted = highlightedRowId === row.id;
                                            return (
                                                <tr key={row.id} className={`transition duration-300 hover:bg-slate-750 ${isHighlighted ? 'row-highlight' : ''}`}>
                                                    <td className="py-2.5 px-3 text-center font-medium text-slate-400">{index + 1}</td>
                                                    <td className="py-2.5 px-3">
                                                        <input
                                                            type="text"
                                                            value={row.customer}
                                                            onChange={(e) => handleFieldChange(row.id, 'customer', e.target.value)}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white focus:outline-none focus:border-emerald-500"
                                                        />
                                                    </td>
                                                    <td className="py-2.5 px-3 text-center">
                                                        <input
                                                            type="number"
                                                            value={row.units}
                                                            onChange={(e) => handleFieldChange(row.id, 'units', e.target.value)}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-white text-center focus:outline-none focus:border-emerald-500"
                                                        />
                                                    </td>
                                                    <td className="py-2.5 px-3">
                                                        <input
                                                            type="text"
                                                            value={row.type}
                                                            onChange={(e) => handleFieldChange(row.id, 'type', e.target.value)}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white focus:outline-none focus:border-emerald-500"
                                                        />
                                                    </td>
                                                    <td className="py-2.5 px-3">
                                                        <input
                                                            type="text"
                                                            value={row.booking}
                                                            onChange={(e) => handleFieldChange(row.id, 'booking', e.target.value)}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white focus:outline-none focus:border-emerald-500 font-mono"
                                                        />
                                                    </td>
                                                    <td className="py-2.5 px-3">
                                                        <input
                                                            type="text"
                                                            value={row.exGrid}
                                                            onChange={(e) => handleFieldChange(row.id, 'exGrid', e.target.value)}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white focus:outline-none focus:border-emerald-500"
                                                        />
                                                    </td>
                                                    <td className="py-2.5 px-3">
                                                        <input
                                                            type="text"
                                                            value={row.ctnReleased}
                                                            onChange={(e) => handleFieldChange(row.id, 'ctnReleased', e.target.value)}
                                                            placeholder="Enter ctn #"
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-emerald-400 font-mono font-semibold focus:outline-none focus:border-emerald-500"
                                                        />
                                                    </td>
                                                    <td className="py-2.5 px-3">
                                                        <input
                                                            type="text"
                                                            value={row.truckId}
                                                            onChange={(e) => handleFieldChange(row.id, 'truckId', e.target.value)}
                                                            placeholder="Truck ID..."
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white focus:outline-none focus:border-emerald-500 font-mono"
                                                        />
                                                    </td>
                                                    <td className="py-2.5 px-3">
                                                        <input
                                                            type="text"
                                                            value={row.time}
                                                            onChange={(e) => handleFieldChange(row.id, 'time', e.target.value)}
                                                            placeholder="HHMM"
                                                            maxLength="4"
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white text-center font-mono focus:outline-none focus:border-emerald-500"
                                                        />
                                                    </td>
                                                    <td className="py-2.5 px-3">
                                                        <select
                                                            value={row.doors}
                                                            onChange={(e) => handleFieldChange(row.id, 'doors', e.target.value)}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white focus:outline-none focus:border-emerald-500 font-medium"
                                                        >
                                                            {DOOR_OPTIONS.map(d => (
                                                                <option key={d} value={d}>{d}</option>
                                                            ))}
                                                        </select>
                                                    </td>
                                                    <td className="py-2.5 px-3">
                                                        <div className="flex items-center space-x-1">
                                                            <input
                                                                type="text"
                                                                value={row.comments}
                                                                onChange={(e) => handleFieldChange(row.id, 'comments', e.target.value)}
                                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white text-xs focus:outline-none focus:border-emerald-500"
                                                            />
                                                            <button
                                                                onClick={() => setCommentModal({ show: true, text: row.comments, rowId: row.id })}
                                                                className="bg-slate-700 hover:bg-slate-600 text-slate-300 p-1.5 rounded-lg text-xs"
                                                                title="Expand Comment"
                                                            >
                                                                💬
                                                            </button>
                                                        </div>
                                                    </td>
                                                    <td className="py-2.5 px-3 text-center">
                                                        <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider inline-block ${row.status === 'Released' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>
                                                            {row.status}
                                                        </span>
                                                    </td>
                                                    {isAdmin && (
                                                        <td className="py-2.5 px-3 text-center">
                                                            <button
                                                                onClick={() => handleDeleteRow(row.id)}
                                                                className="text-rose-400 hover:text-rose-300 p-1.5 rounded-lg transition"
                                                                title="Delete Row"
                                                            >
                                                                ✕
                                                            </button>
                                                        </td>
                                                    )}
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {adminPinModal && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-sm shadow-2xl">
                                <h3 className="text-xl font-bold text-white mb-2">Enter Admin PIN</h3>
                                <p className="text-xs text-slate-400 mb-4">Default PIN is <code className="text-emerald-400 font-mono">1234</code> or <code className="text-emerald-400 font-mono">9999</code>.</p>
                                <input
                                    type="password"
                                    placeholder="Enter PIN"
                                    value={pinInput}
                                    onChange={(e) => setPinInput(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && verifyAdminPin()}
                                    autoFocus
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white mb-4 focus:outline-none focus:border-emerald-500 tracking-widest text-center text-lg font-mono"
                                />
                                <div className="flex space-x-3">
                                    <button onClick={() => setAdminPinModal(false)} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-sm font-medium transition">Cancel</button>
                                    <button onClick={verifyAdminPin} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-sm font-semibold transition shadow">Unlock</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {commentModal.show && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-lg shadow-2xl">
                                <h3 className="text-lg font-bold text-white mb-2">Full Comment View</h3>
                                <textarea
                                    value={commentModal.text}
                                    onChange={(e) => {
                                        const txt = e.target.value;
                                        setCommentModal(prev => ({ ...prev, text: txt }));
                                        handleFieldChange(commentModal.rowId, 'comments', txt);
                                    }}
                                    rows="5"
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm mb-4 focus:outline-none focus:border-emerald-500"
                                />
                                <div className="flex justify-end">
                                    <button onClick={() => setCommentModal({ show: false, text: '', rowId: null })} className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-xl text-sm font-semibold transition">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
